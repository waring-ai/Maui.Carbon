name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Build all targets, test, pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install Android dependencies
        run: dotnet build src/Maui.Carbon -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True

      - name: Generator drift check
        run: dotnet run --project tools/Maui.Carbon.Generator -- --check

      # The Relay sample (app, core and tests) stays out of CI; tools/verify.sh --samples covers it locally.
      - name: Build
        run: dotnet build Maui.Carbon.CI.slnf -c Release

      - name: Test
        run: dotnet test tests/Maui.Carbon.Tests -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          dotnet pack src/Maui.Carbon -c Release -o out -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/*

  macos:
    name: Build Apple targets
    # The .NET 10 Apple packs need the 26.4 SDKs for linking apps; macos-15 tops out at Xcode 26.3.
    runs-on: macos-26
    env:
      # Only the Apple workloads are installed here; restore would otherwise evaluate the Android target too.
      CarbonIncludeAndroid: false
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst

      - name: Build library
        run: |
          dotnet build src/Maui.Carbon -f net10.0-ios -c Release
          dotnet build src/Maui.Carbon -f net10.0-maccatalyst -c Release

      - name: Build gallery
        run: |
          dotnet build samples/Maui.Carbon.Gallery -f net10.0-maccatalyst -r maccatalyst-arm64
          dotnet build samples/Maui.Carbon.Gallery -f net10.0-ios -r iossimulator-arm64

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # Trusted publishing: nuget.org trusts this repo, workflow file (ci.yml) and environment (nuget) through a policy,
    # and swaps the job's GitHub OIDC token for an API key that lasts an hour. No long-lived key is stored.
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: out

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC to a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name that owns the policy, not an email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
