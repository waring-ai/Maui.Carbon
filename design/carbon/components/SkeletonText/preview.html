<!-- @dsCard group="Status" height=442 subtitle="Single line, heading, paragraph, custom widths, loading and loaded card" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.card{border:1px solid var(--border-subtle-01);background:var(--layer-01);padding:16px;min-height:132px;box-sizing:border-box} .card h4{margin:0 0 8px;font:400 20px/24px var(--font-sans);color:var(--text-primary)} .card p{margin:0 0 8px;font:400 14px/16px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)} .card .lbl{margin:0 0 8px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
function App(){
 return h('div',{className:'stack'},
  h('div',{className:'grid'},
   B('Single line (16px, full width)',h(C.SkeletonText)),
   B('heading (24px), width="60%"',h(C.SkeletonText,{heading:true,width:'60%'})),
   B('width="150px": a short value such as a date',h(C.SkeletonText,{width:'150px'})),
   B('paragraph, lineCount={4}',h(C.SkeletonText,{paragraph:true,lineCount:4})),
   B('paragraph with width="70%": every line the same width',h(C.SkeletonText,{paragraph:true,lineCount:3,width:'70%'})),
   B('On a Layer: same skeleton tokens',h(C.Layer,{withBackground:true,style:{padding:16}},h(C.SkeletonText,{paragraph:true,lineCount:2})))),
  h('div',{className:'grid2'},
   B('In context: cluster summary card while loading (aria-busy on the card)',h('div',{className:'card','aria-busy':'true','aria-label':'Loading cluster summary'},
    h('p',{className:'lbl'},'Cluster'),h(C.SkeletonText,{heading:true,width:'55%'}),h(C.SkeletonText,{width:'40%'}),h(C.SkeletonText,{width:'70%'}))),
   B('...and once loaded: the same size, so nothing shifts',h('div',{className:'card'},
    h('p',{className:'lbl'},'Cluster'),h('h4',null,'prod-us-east-1'),h('p',null,'Kubernetes 1.29.4'),h('p',null,'12 worker nodes in 3 zones, us-east')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
