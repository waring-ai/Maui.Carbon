<!-- @dsCard group="Data" height=850 subtitle="Nested nodes, selected and active, icons, xs and sm, disabled, multiselect, bucket browser" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.browser{display:grid;grid-template-columns:280px 1fr;border:1px solid var(--border-subtle-01);min-height:300px} .tree{padding:16px 0;border-inline-end:1px solid var(--border-subtle-01)} .tree .cds--label{padding-inline:16px} .files{padding:16px} .path{margin:0 0 12px;font:400 14px/20px var(--font-mono);color:var(--text-primary)} .narrow{width:220px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
const N=(id,label,icon,kids,extra)=>h(C.TreeNode,Object.assign({key:id,id,label,renderIcon:icon},extra||{}),kids);
function Resources(icons,pre,openBuckets){
 const f=icons?'folder':undefined, d=icons?'document':undefined, p=pre||'';
 return [
  N(p+'rg','Resource group: production',f,[
   N(p+'cl','Clusters',f,[N(p+'cl1','prod-us-east-1',d),N(p+'cl2','prod-eu-de-1',d)],{defaultIsExpanded:!openBuckets}),
   N(p+'bk','Buckets',f,[N(p+'bk1','logs-archive',d),N(p+'bk2','static-assets-prod',d)],{defaultIsExpanded:!!openBuckets})],{defaultIsExpanded:true}),
  N(p+'st','Resource group: staging',f,[N(p+'st1','staging-us-south',d)]),
  N(p+'lg','Resource group: legacy (read-only)',f,null,{disabled:true}),
  N(p+'df','Default resource group',f)];
}
const tree={
 'logs-archive':{'2026':{'03':['api-gateway.log.gz','ingress.log.gz','audit.json'],'02':['api-gateway.log.gz','ingress.log.gz']},'2025':{'12':['year-end-audit.json']}}
};
function Browser(){
 const [sel,setSel]=useState('lg-2026-03');
 const files={'lg-2026-03':tree['logs-archive']['2026']['03'],'lg-2026-02':tree['logs-archive']['2026']['02'],'lg-2025-12':tree['logs-archive']['2025']['12']};
 const path={'lg-2026-03':'logs-archive/2026/03/','lg-2026-02':'logs-archive/2026/02/','lg-2025-12':'logs-archive/2025/12/'};
 const list=files[sel]||[];
 return h('div',{className:'browser'},
  h('div',{className:'tree'},h(C.TreeView,{label:'Folders in logs-archive',size:'sm',active:'lg-2026-03',selected:['lg-2026-03'],onSelect:(e,n)=>setSel(n.id)},
   N('lg-2026','2026','folder',[N('lg-2026-03','03 (March)','folder'),N('lg-2026-02','02 (February)','folder')],{defaultIsExpanded:true}),
   N('lg-2025','2025','folder',[N('lg-2025-12','12 (December)','folder')]))),
  h('div',{className:'files'},h('p',{className:'path'},path[sel]||'Select a month folder'),
   h(C.ContainedList,{label:list.length+' objects',size:'sm'},list.map(f=>h(C.ContainedListItem,{key:f,renderIcon:'document'},f)))));
}
function App(){
 return h('div',{className:'stack'},
  h('div',{className:'grid'},
   B('size="sm" (32px, default): prod-us-east-1 selected and active',h(C.TreeView,{label:'Resources',hideLabel:true,size:'sm',active:'cl1',selected:['cl1']},Resources(false))),
   B('size="xs" (24px) with folder and document icons',h(C.TreeView,{label:'Resources',hideLabel:true,size:'xs'},Resources(true,'x-'))),
   B('Visible label; multiselect (Ctrl/Cmd+click), two buckets selected',h(C.TreeView,{label:'Resources to export',size:'sm',multiselect:true,selected:['m-bk1','m-bk2'],active:'m-bk2'},Resources(true,'m-',true)))),
  B('Long labels truncate with an ellipsis (full text in the title tooltip on hover)',h('div',{className:'narrow'},h(C.TreeView,{label:'Deployments',hideLabel:true,size:'sm'},
   N('t1','checkout-service-blue-green-canary-rollout-2026-03','folder',[N('t11','values-production-us-east-overrides.yaml','document')],{defaultIsExpanded:true})))),
  B('In context: browsing folders of a bucket (select a month)',h(Browser)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
