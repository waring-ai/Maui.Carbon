<!-- @dsCard group="AI" height=764 subtitle="Pill buttons for chat: kinds, sizes, quick actions and states; an assistant composer in context" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.chat{background:var(--layer-01);padding:24px;max-inline-size:640px}
.msg{margin:0 0 16px;padding:12px 16px;background:var(--background);font:400 14px/20px var(--font-sans);letter-spacing:.16px;max-inline-size:480px}
.msg.me{margin-inline-start:auto;background:var(--layer-accent-01)}
.who{display:block;margin-bottom:4px;font:600 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
.qa{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .cds--form-item{flex:1}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Chat(){
 const [sel,setSel]=React.useState(-1),[text,setText]=React.useState('');
 const qa=['Why is prod-us-2 degraded?','Show nodes not ready','Draft an incident note'];
 return h('div',{className:'chat',role:'region','aria-label':'Cluster assistant'},
  h('p',{className:'msg me'},h('span',{className:'who'},'You'),'prod-us-2 has been slow since this morning.'),
  h('p',{className:'msg'},h('span',{className:'who'},'Assistant'),'2 of 9 nodes in prod-us-2 are not ready after a kernel update. Pick a follow-up or ask something else.'),
  h('div',{className:'qa',role:'group','aria-label':'Suggested prompts'},qa.map((t,i)=>h(C.ChatButton,{key:t,isQuickAction:true,isSelected:sel===i,onClick:()=>{setSel(i);setText(t)}},t))),
  h('div',{className:'composer'},
   h(C.TextInput,{id:'cb-msg',labelText:'Message',placeholder:'Ask about your clusters',value:text,onChange:e=>setText(e.target.value),size:'lg'}),
   h(C.ChatButton,{kind:'primary',size:'lg',renderIcon:'arrow--up',disabled:!text,onClick:()=>setText('')},'Send')));
}
function App(){
 return h('div',null,
  Cap('kind, at size lg, with renderIcon (icon after the label) and without; disabled'),
  h('div',{className:'row'},['primary','secondary','tertiary','ghost','danger'].map(k=>h(C.ChatButton,{key:k,kind:k,renderIcon:'add'},{primary:'New chat',secondary:'Attach file',tertiary:'Add context',ghost:'Insert snippet',danger:'Clear history'}[k]))),
  h('div',{className:'row'},['primary','secondary','tertiary','ghost'].map(k=>h(C.ChatButton,{key:k,kind:k},{primary:'Send',secondary:'Stop generating',tertiary:'Regenerate',ghost:'Copy answer'}[k])),h(C.ChatButton,{disabled:true},'Send'),h(C.ChatButton,{kind:'secondary',disabled:true},'Stop generating')),
  Cap('size: sm 32, md 40, lg 48 (default)'),
  h('div',{className:'row'},['sm','md','lg'].map(s=>h(C.ChatButton,{key:s,size:s,renderIcon:'arrow--up'},'Send ('+s+')')),['sm','md','lg'].map(s=>h(C.ChatButton,{key:'n'+s,size:s,kind:'secondary'},'Stop ('+s+')'))),
  Cap('isQuickAction: default, isSelected, with icon, disabled, selected and disabled'),
  h('div',{className:'row'},
   h(C.ChatButton,{isQuickAction:true},'Summarize logs'),
   h(C.ChatButton,{isQuickAction:true,isSelected:true},'Show cost trend'),
   h(C.ChatButton,{isQuickAction:true,renderIcon:'add'},'Add a node pool'),
   h(C.ChatButton,{isQuickAction:true,disabled:true},'Restart nodes'),
   h(C.ChatButton,{isQuickAction:true,isSelected:true,disabled:true},'Explain the alert')),
  Cap('In context: an assistant panel with suggested prompts (click one) and a composer with a Send chat button'),
  h(Chat));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
