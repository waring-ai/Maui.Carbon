<!-- @dsCard group="Forms" height=504 subtitle="Visible label, magnifier at the bottom right, clear button; disabled, skeleton; live filter in a side panel" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:24px}
.panel{max-inline-size:400px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.list{list-style:none;margin:0;padding:0;block-size:160px;overflow:auto} .list li{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;border-block-end:1px solid var(--border-subtle-01);font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)} .list li span:last-child{color:var(--text-secondary)} .empty{padding:11px 16px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el){return h('div',null,Cap(t),el)}
const BUCKETS=[['payments-invoices','us-south'],['payments-exports','us-south'],['audit-logs-2026','eu-de'],['ml-training-data','us-east'],['static-site-assets','eu-gb'],['backups-postgres','us-south']];

function AttachPanel(){
 const [q,setQ]=React.useState('pay');
 const hits=BUCKETS.filter(function(b){return b[0].indexOf(q.trim().toLowerCase())>-1});
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Attach a bucket'),h('p',null,'Choose the bucket payments-api reads its exports from.')),
  h(C.FluidSearch,{id:'ab-q',labelText:'Search buckets',placeholder:'Filter by bucket name',value:q,onChange:function(e){setQ(e.target.value)}}),
  hits.length?h('ul',{className:'list','aria-label':'Buckets'},hits.map(function(b){return h('li',{key:b[0]},h('span',null,b[0]),h('span',null,b[1]))}))
   :h('div',{className:'list'},h('p',{className:'empty'},'No buckets match "'+q+'". Check the spelling or create a bucket.')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Default (placeholder)',h(C.FluidSearch,{labelText:'Search services',placeholder:'Find a service by name'})),
   Cell('Filled (clear button)',h(C.FluidSearch,{labelText:'Search services',placeholder:'Find a service by name',defaultValue:'payments'})),
   Cell('Disabled',h(C.FluidSearch,{labelText:'Search services',placeholder:'Find a service by name',disabled:true})),
   Cell('Skeleton (FluidSearchSkeleton)',h(C.FluidSearchSkeleton))),
  Cap('In context: filtering a list in a side panel (type, press Escape or the clear button)'),
  h(AttachPanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
