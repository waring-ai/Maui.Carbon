<!-- @dsCard group="Forms" height=1202 subtitle="Single, range and simple with FluidDatePickerInput: calendar open, invalid (picker or one input), warning, disabled, read-only, skeleton" -->
<style>body{margin:0;padding:24px;background:var(--background)} .grid{display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,288px));gap:24px;margin-bottom:24px} .tall{min-height:420px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.panel{max-inline-size:440px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p,.sum{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)} .sum{padding:12px 16px 16px}
.pf{display:flex} .pf > .cds--btn{flex:1 1 0;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el,tall){return h('div',{className:tall?'tall':null},Cap(t),el)}
const now=new Date(),Y=now.getFullYear(),M=now.getMonth();
const d=(n)=>new Date(Y,M,n);
const p2=(n)=>(n<10?'0':'')+n;
const fmt=(x)=>x?p2(x.getMonth()+1)+'/'+p2(x.getDate())+'/'+x.getFullYear():'';
function P(props,inputs){return h(C.FluidDatePicker,Object.assign({style:{width:'100%'}},props),inputs.map(function(p,i){return h(C.FluidDatePickerInput,Object.assign({key:i,placeholder:'mm/dd/yyyy'},p))}))}

function ExportPanel(){
 const [r,setR]=React.useState([d(1),d(14)]);
 const days=r.length===2?Math.round((r[1]-r[0])/864e5)+1:0;
 const tooLong=days>92;
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Export usage report'),h('p',null,'A CSV of metered usage for every resource in the payments account.')),
  h(C.FluidForm,{'aria-label':'Export usage report',onSubmit:function(e){e.preventDefault()}},
   P({id:'ex',datePickerType:'range',value:r,onChange:setR,maxDate:d(28),invalid:tooLong,invalidText:'Choose a period of 92 days or less'},[{id:'ex-start',labelText:'From'},{id:'ex-end',labelText:'To'}])),
  h('p',{className:'sum'},days?days+' days, '+fmt(r[0])+' to '+fmt(r[1]):'Choose a start and an end date'),
  h('div',{className:'pf'},h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),h(C.Button,{kind:'primary',size:'xl',disabled:!days||tooLong},'Export CSV')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Single, calendar open',P({datePickerType:'single',defaultValue:d(15),defaultOpen:true},[{id:'fdp-s',labelText:'Maintenance date'}]),true),
   Cell('Range, calendar open',P({datePickerType:'range',defaultValue:[d(9),d(17)],defaultOpen:true},[{id:'fdp-r1',labelText:'Start date'},{id:'fdp-r2',labelText:'End date'}]),true),
   Cell('Simple (text only, no calendar)',P({datePickerType:'simple',defaultValue:d(12)},[{id:'fdp-simple',labelText:'Key expiry date'}]),true)),
  h('div',{className:'grid'},
   Cell('Invalid (whole picker)',P({datePickerType:'single',defaultValue:d(2),invalid:true,invalidText:'Choose a date from the 5th onward'},[{id:'fdp-inv',labelText:'Maintenance date'}])),
   Cell('Invalid (whole range)',P({datePickerType:'range',defaultValue:[d(20),d(4)],invalid:true,invalidText:'End date must be after the start date'},[{id:'fdp-ri1',labelText:'Start date'},{id:'fdp-ri2',labelText:'End date'}])),
   Cell('Invalid (one input of a range)',P({datePickerType:'range',defaultValue:[d(3)]},[{id:'fdp-rx1',labelText:'Start date'},{id:'fdp-rx2',labelText:'End date',invalid:true,invalidText:'Enter an end date'}])),
   Cell('Warning',P({datePickerType:'single',defaultValue:d(25),warn:true,warnText:'Support is not staffed on this date'},[{id:'fdp-w',labelText:'Maintenance date'}])),
   Cell('Disabled',P({datePickerType:'single',defaultValue:d(15),disabled:true},[{id:'fdp-d',labelText:'Maintenance date'}])),
   Cell('Read only',P({datePickerType:'range',defaultValue:[d(9),d(17)],readOnly:true},[{id:'fdp-ro1',labelText:'Start date'},{id:'fdp-ro2',labelText:'End date'}])),
   Cell('Skeleton (FluidDatePickerSkeleton)',h(C.FluidDatePickerSkeleton)),
   Cell('Skeleton, range',h(C.FluidDatePickerSkeleton,{datePickerType:'range'}))),
  Cap('In context: a report period in a side panel (range longer than 92 days is flagged)'),
  h(ExportPanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
