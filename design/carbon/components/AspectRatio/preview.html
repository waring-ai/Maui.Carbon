<!-- @dsCard group="Layout" height=823 subtitle="Nine ratios, width-driven height, as=figure, media tiles in context" -->
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:24px}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.cell{inline-size:84px}
.fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--layer-01);outline:1px solid var(--border-strong-01);outline-offset:-1px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--layer-01);display:flex;flex-direction:column}
.media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--layer-accent-01);color:var(--icon-secondary)}
.media svg{fill:currentColor}
.body{padding:16px;display:flex;flex-direction:column;gap:8px}
.t{margin:0;font:600 14px/18px var(--font-sans);letter-spacing:.16px}
.d{margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
figure{margin:0}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:start;margin-bottom:24px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function App(){
 const ratios=['16x9','2x1','4x3','3x2','1x1','2x3','3x4','1x2','9x16'];
 return h('div',null,
  Cap('ratio: every value, each 84px wide; the child is absolutely positioned to fill the box'),
  h('div',{className:'row'},ratios.map(r=>h('div',{key:r,className:'cell'},h(C.AspectRatio,{ratio:r},h('div',{className:'fill'},r))))),
  h('div',{className:'split'},
   h('div',null,Cap('Height follows width: 16x9 at 120, 200 and 280px'),
    h('div',{className:'row',style:{marginBottom:0,alignItems:'flex-end'}},[120,200,280].map(w=>h('div',{key:w,style:{inlineSize:w}},h(C.AspectRatio,{ratio:'16x9'},h('div',{className:'fill'},w+' x '+Math.round(w*9/16))))))),
   h('div',null,Cap('as="figure": a 4x3 chart area with a caption'),
    h('div',{style:{inlineSize:200}},
     h(C.AspectRatio,{as:'figure',ratio:'4x3','aria-label':'CPU usage, last 24 hours'},h('div',{className:'fill'},'CPU, 24 h')),
     h('p',{className:'cap',style:{marginTop:8}},'CPU usage, last 24 hours')))),
  Cap('In context: getting-started tiles with 16x9 media so the row lines up whatever the image size'),
  h('div',{className:'tiles'},
   [['Deploy a container','Push an image and run it on a managed cluster in minutes.','virtual-machine'],
    ['Connect object storage','Mount a bucket and stream logs to it from every node.','folder--open'],
    ['Set up alerts','Get notified in Slack or email when a node pool degrades.','notification']].map(c=>
    h('div',{key:c[0],className:'card'},
     h(C.AspectRatio,{ratio:'16x9'},h('div',{className:'media'},h(C.Icon,{name:c[2],size:32}))),
     h('div',{className:'body'},h('p',{className:'t'},c[0]),h('p',{className:'d'},c[1]),h(C.Link,{href:'#'},'Start tutorial'))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
