<!-- @dsCard group="Status" height=369 subtitle="Pulsing placeholder for an icon: 16px default, sized for 20/24/32, in a loading list" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin-bottom:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.sz{display:flex;flex-direction:column;align-items:center;gap:8px;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:1px solid var(--border-subtle-01);font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.panel h4{margin:0;padding:12px 16px;font:600 14px/20px var(--font-sans);letter-spacing:.16px;border-block-end:1px solid var(--border-subtle-01)}
.it{display:flex;align-items:center;gap:12px;block-size:48px;padding-inline:16px;border-block-end:1px solid var(--border-subtle-01)}.it:last-child{border-block-end:0}
.it .cds--skeleton__text{margin:0}.it .sub{margin-inline-start:auto;color:var(--text-secondary)}.it svg{fill:var(--icon-primary);flex-shrink:0}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const ITEMS=[['virtual-machine','prod-us-east','12 nodes'],['folder','billing-exports','1,284 objects'],['catalog','orders-db','PostgreSQL 16']];
function App(){
 return h('div',null,
  Cap('Default 16px, and sized with style for 20, 24 and 32px icons'),
  h('div',{className:'row'},[16,20,24,32].map(s=>h('div',{className:'sz',key:s},h(C.SkeletonIcon,s===16?{}:{style:{width:s,height:s}}),s+'px'))),
  Cap('In context: a recent resources panel while loading (left, SkeletonIcon with SkeletonText) and loaded (right)'),
  h('div',{className:'ctx'},
   h('div',{className:'panel','aria-busy':'true'},h('h4',null,'Recent resources'),
    [60,45,52].map((w,i)=>h('div',{className:'it',key:i},h(C.SkeletonIcon),h(C.SkeletonText,{width:w+'%'})))),
   h('div',{className:'panel'},h('h4',null,'Recent resources'),
    ITEMS.map(r=>h('div',{className:'it',key:r[1]},h(C.Icon,{name:r[0],size:16}),h('span',null,r[1]),h('span',{className:'sub'},r[2]))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
