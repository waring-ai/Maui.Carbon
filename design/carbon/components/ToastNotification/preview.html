<!-- @dsCard group="Feedback" height=1356 subtitle="Six kinds, high and low contrast, caption, timeout, stacked in a corner" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .grid{display:grid;grid-template-columns:repeat(3,288px);gap:16px;align-items:start;margin-bottom:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.app{position:relative;block-size:24rem;border:1px solid var(--border-subtle-01);background:var(--background);overflow:hidden;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.bar{display:flex;align-items:center;block-size:48px;padding-inline:16px;background:var(--layer-01);border-block-end:1px solid var(--border-subtle-01);font-weight:600}
.main{padding:16px}.main h3{font:400 20px/28px var(--font-sans);margin:0 0 8px}.main p{margin:0 0 16px;color:var(--text-secondary)}
.stack{position:absolute;inset-block-start:56px;inset-inline-end:8px;display:flex;flex-direction:column;gap:8px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const K=[
 ['error','Deployment failed','checkout-api could not start: image pull timed out.'],
 ['success','Cluster created','prod-eu-west is ready with 3 worker nodes.'],
 ['warning','Storage almost full','billing-exports is at 92% of its 500 GB quota.'],
 ['warning-alt','Certificate expires soon','The TLS certificate for api.example.com expires in 7 days.'],
 ['info','Maintenance scheduled','Control plane upgrades run Saturday 02:00 to 04:00 UTC.'],
 ['info-square','New region available','You can now deploy to ap-south-2.']];
const T=(k,i,extra)=>h(C.ToastNotification,Object.assign({key:k[0],kind:k[0],title:k[1],subtitle:k[2],caption:'10:4'+i+' AM'},extra));
let n=0;
function Corner(){
 const [toasts,setToasts]=React.useState([
  {id:'a',kind:'success',title:'Deployment complete',subtitle:'checkout-api v2.4.1 is live in prod-us-east.',caption:'2 minutes ago'},
  {id:'b',kind:'error',title:'Backup failed',subtitle:'Snapshot of orders-db could not be written. Check the target bucket permissions.',caption:'6 minutes ago'}]);
 const add=()=>setToasts(t=>[{id:'n'+(++n),kind:'info',title:'Scaling started',subtitle:'worker-pool-a is scaling from 3 to 5 nodes.',caption:'Just now',timeout:5000}].concat(t));
 const drop=id=>setToasts(t=>t.filter(x=>x.id!==id));
 return h('div',{className:'app'},
  h('div',{className:'bar'},'Cloud console'),
  h('div',{className:'main'},h('h3',null,'Deployments'),h('p',null,'Toasts stack in the top-right corner, newest first, 8px apart.'),
   h(C.Button,{kind:'primary',size:'md',onClick:add},'Scale worker pool')),
  h('div',{className:'stack',role:'log','aria-label':'Notifications'},toasts.map(t=>h(C.ToastNotification,Object.assign({key:t.id,onClose:()=>{drop(t.id);return false}},t)))));
}
function App(){
 return h('div',null,
  Cap('High contrast (default): error, success, warning, warning-alt, info, info-square; caption'),
  h('div',{className:'grid'},K.map((k,i)=>T(k,i))),
  Cap('lowContrast'),
  h('div',{className:'grid'},K.map((k,i)=>T(k,i,{lowContrast:true}))),
  Cap('No caption; hideCloseButton; children (a link) under the subtitle'),
  h('div',{className:'grid'},
   h(C.ToastNotification,{kind:'success',title:'API key created',subtitle:'Copy it now. You cannot view it again.'}),
   h(C.ToastNotification,{kind:'info',lowContrast:true,hideCloseButton:true,title:'Syncing',subtitle:'Usage data refreshes every 15 minutes.'}),
   h(C.ToastNotification,{kind:'error',title:'Invoice payment failed',subtitle:'Your card was declined.',caption:'Today, 09:12'},h('div',{style:{marginTop:8}},h(C.Link,{href:'#'},'Update payment method')))),
  Cap('In context: a notifications area. The button adds a toast that closes itself after 5 seconds (timeout)'),
  h(Corner));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
