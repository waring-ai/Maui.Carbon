<!-- @dsCard group="Containers" height=786 subtitle="TileGroup of RadioTiles: selected, disabled tile, disabled group, on a Layer, AI decorator; a plan picker" -->
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--text-primary)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles .cds--tile{min-block-size:88px;block-size:100%}
.tt{display:block;margin:0 0 4px;font:600 14px/18px var(--font-sans);letter-spacing:.16px}
.ts{display:block;margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.tp{display:block;margin-top:12px;font:400 20px/28px var(--font-sans)}
.tp small{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px;margin-bottom:24px}
.on-layer{background:var(--layer-01);padding:16px}
.panel{background:var(--layer-01);padding:24px}
.ph{margin:0;font:400 20px/28px var(--font-sans)}
.psub{margin:4px 0 16px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.foot .cds--btn-set{flex:0 0 392px}
.sum{font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.ai p{margin:0 0 8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px} .ai .s{color:var(--text-secondary)}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const T=(t,s)=>[h('span',{key:1,className:'tt'},t),h('span',{key:2,className:'ts'},s)];
const AI=()=>h(C.AILabel,{size:'mini','aria-label':'Why this flavor is suggested'},h(C.AILabelContent,null,h('div',{className:'ai'},h('p',{className:'s'},'AI explained'),h('p',null,'Suggested from the last 30 days of CPU and memory use on this pool.'))));
const PLANS=[['dev','Development','1 zone, no SLA',0],['std','Standard','3 zones, 99.9% SLA',240],['ha','High availability','3 zones + standby, 99.99% SLA',610]];
function Plan(){
 const [v,setV]=React.useState('std');
 const p=PLANS.find(x=>x[0]===v);
 return h('div',{className:'panel'},
  h('p',{className:'ph'},'Choose a cluster plan'),
  h('p',{className:'psub'},'You can change the plan later. Changes apply at the next maintenance window.'),
  h(C.Layer,null,h(C.TileGroup,{name:'rt-plan',legend:'Plan',valueSelected:v,onChange:x=>setV(x)},
   h('div',{className:'tiles'},PLANS.map(x=>h(C.RadioTile,{key:x[0],id:'rt-p-'+x[0],value:x[0]},T(x[1],x[2]),h('span',{className:'tp'},x[3]?'$'+x[3]:'Free',x[3]?h('small',null,' / month'):null)))))),
  h('div',{className:'foot'},
   h('span',{className:'sum'},'Selected: ',h('b',null,p[1]),p[3]?' · $'+p[3]+' / month':' · no charge'),
   h(C.ButtonSet,null,h(C.Button,{kind:'secondary'},'Back'),h(C.Button,null,'Create cluster'))));
}
function App(){
 return h('div',null,
  h('div',{className:'two'},
   h('div',null,Cap('defaultSelected; one tile disabled'),
    h(C.TileGroup,{name:'rt-region',legend:'Region',defaultSelected:'eu'},
     h('div',{className:'tiles'},
      h(C.RadioTile,{value:'us',id:'rt-us'},T('us-south','Dallas')),
      h(C.RadioTile,{value:'eu',id:'rt-eu'},T('eu-de','Frankfurt')),
      h(C.RadioTile,{value:'ap',id:'rt-ap',disabled:true},T('jp-tok','At capacity'))))),
   h('div',null,Cap('Group disabled (every tile, selected one keeps its border)'),
    h(C.TileGroup,{name:'rt-size',legend:'Node size',defaultSelected:'m',disabled:true},
     h('div',{className:'tiles'},
      h(C.RadioTile,{value:'s',id:'rt-s'},T('Small','2 vCPU, 8 GB')),
      h(C.RadioTile,{value:'m',id:'rt-m'},T('Medium','4 vCPU, 16 GB')),
      h(C.RadioTile,{value:'l',id:'rt-l'},T('Large','8 vCPU, 32 GB'))))),
   h('div',{className:'on-layer'},Cap('On a layer-01 panel: wrap the group in Layer (layer-02 tiles)'),
    h(C.Layer,null,h(C.TileGroup,{name:'rt-os',legend:'Operating system',defaultSelected:'ubuntu'},
     h('div',{className:'tiles'},
      h(C.RadioTile,{value:'ubuntu',id:'rt-ub'},T('Ubuntu 24.04','LTS')),
      h(C.RadioTile,{value:'rhel',id:'rt-rh'},T('RHEL 9','Licensed')),
      h(C.RadioTile,{value:'cos',id:'rt-co'},T('Container OS','Minimal')))))),
   h('div',null,Cap('decorator: an AILabel on the suggested tile (AI gradient)'),
    h(C.TileGroup,{name:'rt-flavor',legend:'Worker flavor',defaultSelected:'bx4'},
     h('div',{className:'tiles',style:{gridTemplateColumns:'repeat(2,minmax(0,1fr))'}},
      h(C.RadioTile,{value:'bx2',id:'rt-bx2'},T('bx2.4x16','Balanced, 4 vCPU')),
      h(C.RadioTile,{value:'bx4',id:'rt-bx4',decorator:h(AI)},T('bx2.8x32','Suggested, 8 vCPU')))))),
  Cap('In context: a controlled plan picker; the group is one tab stop and arrow keys move the selection'),
  h(Plan));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
