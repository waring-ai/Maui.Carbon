<!-- @dsCard group="Navigation" width=1280 height=1160 subtitle="Full header, title only, with breadcrumb, with tabs, hero image" -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.sec{margin-bottom:32px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:32px;align-items:start}
.panel{padding:16px 32px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);border:1px solid var(--border-subtle-01);border-top:0}
.panel strong{display:block;margin-bottom:4px;font-weight:600;color:var(--text-primary)}
.hero{display:flex;align-items:center;justify-content:center;inline-size:100%;block-size:100%;background:var(--layer-accent-01)}
.hero .cds--icon{fill:var(--icon-secondary)}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const crumbs=(items)=>h(C.Breadcrumb,{size:'sm'},items.map(t=>h(C.BreadcrumbItem,{key:t,href:'#'},t)));
const ib=(icon,label)=>h(C.IconButton,{kind:'ghost',size:'md',renderIcon:icon,label:label,align:'bottom'});
const TABS=[{label:'Overview'},{label:'Network interfaces'},{label:'Storage volumes'},{label:'Monitoring'},{label:'Snapshots',disabled:true}];
const PANELS=[
 ['Overview','bx2-4x16 profile in Dallas 1. Created Oct 4, 2026 from the ubuntu-24-04 image.'],
 ['Network interfaces','eth0 · 10.240.0.14 · subnet dal-1-private · security group web-tier'],
 ['Storage volumes','Boot volume 100 GB (general purpose) and data-01, 500 GB (10 IOPS/GB).'],
 ['Monitoring','CPU 37% average over 24 hours, memory 58%, no alerts in the last 7 days.'],
 ['Snapshots','']];
function Full(){
 const [sel,setSel]=React.useState(0);
 return h('div',null,
  h(C.PageHeader,null,
   h(C.PageHeaderBreadcrumbBar,{renderIcon:'cloud-foundry--1',
     contentActions:h(C.Button,{size:'md',kind:'ghost'},'Open console'),
     pageActions:h(React.Fragment,null,ib('activity','Activity log'),ib('share','Share'),ib('settings','Settings'))},
    crumbs(['Compute','Virtual servers'])),
   h(C.PageHeaderContent,{title:'dal-vm-01',renderIcon:'virtual-machine',
     contextualActions:h(C.Tag,{type:'green',size:'lg'},'Running'),
     pageActions:h(C.PageHeaderContentPageActions,{actions:[
      {id:'restart',body:ib('restart','Restart')},
      {id:'stop',body:ib('stop','Stop')},
      {id:'snap',body:h(C.Button,{kind:'primary',size:'md',renderIcon:'add'},'Create snapshot')}]})},
    h(C.PageHeaderContentText,{subtitle:'Checkout service, US storefront'},'Backups run nightly at 02:00 UTC and are kept for 30 days. Stop the server before you resize its boot volume.')),
   h(C.PageHeaderTabBar,{tabs:TABS,selectedIndex:sel,onChange:e=>setSel(e.selectedIndex),tags:[{type:'blue',text:'Production'},{type:'purple',text:'Dallas 1'},{type:'teal',text:'Backup enabled'}]})),
  h('div',{className:'panel'},h('strong',null,PANELS[sel][0]),PANELS[sel][1]));
}
function TitleOnly(){
 return h(C.PageHeader,null,h(C.PageHeaderContent,{title:'Billing and usage'}));
}
function WithBreadcrumb(){
 return h(C.PageHeader,null,
  h(C.PageHeaderBreadcrumbBar,{border:false},crumbs(['Object storage','Buckets'])),
  h(C.PageHeaderContent,{title:'logs-archive-prod-us-south-standard-class-retention-policy-2026-compliance-hold'},
   h(C.PageHeaderContentText,null,'Long titles clamp at two lines; hover the title for the full name.')));
}
function WithTabs(){
 const [sel,setSel]=React.useState(0);
 return h(C.PageHeader,null,
  h(C.PageHeaderContent,{title:'Access (IAM)',pageActions:h(C.PageHeaderContentPageActions,{actions:h(C.Button,{kind:'primary',size:'md',renderIcon:'add'},'Invite users')})},
   h(C.PageHeaderContentText,null,'Manage who can sign in to this account and what they can change.')),
  h(C.PageHeaderTabBar,{tabs:[{label:'Users'},{label:'Access groups'},{label:'Service IDs'},{label:'API keys'}],selectedIndex:sel,onChange:e=>setSel(e.selectedIndex),ariaLabel:'Access sections'}));
}
function App(){
 return h('div',null,
  h('div',{className:'sec'},Cap('Full: breadcrumb bar (icon, content action, page actions), title with icon and status tag, page actions, subtitle and body, tab bar with tags; tabs switch the panel below'),h(Full)),
  h('div',{className:'two'},
   h('div',null,Cap('Minimal: title only'),h(TitleOnly),
    h('div',{style:{height:24}}),Cap('With breadcrumb (border off, nothing follows the bar); long title clamps at two lines'),h(WithBreadcrumb)),
   h('div',null,Cap('With tabs, no breadcrumb; one primary page action'),h(WithTabs))),
  h('div',null,Cap('With hero image (placeholder box in a 2x1 frame beside the text)'),
   h(C.PageHeader,null,
    h(C.Grid,null,
     h(C.Column,{lg:8,md:4,sm:4},
      h(C.PageHeaderBreadcrumbBar,{border:false,renderIcon:'catalog'},crumbs(['Catalog'])),
      h(C.PageHeaderContent,{title:'Get started with Kubernetes'},h(C.PageHeaderContentText,{subtitle:'Create your first cluster in about 10 minutes'},'Pick a region and a worker profile, connect your container registry, then deploy a sample app with one command.'))),
     h(C.Column,{lg:8,md:4,sm:0},
      h(C.PageHeaderHeroImage,null,h('div',{className:'hero'},h(C.Icon,{name:'cloud-foundry--1',size:32}))))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
