<!-- @dsCard group="Navigation" height=796 subtitle="Right-hand panel: app Switcher, notifications" -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
/* a transformed ancestor makes the fixed header and panel position inside the frame */
.frame{position:relative;transform:translateZ(0);height:320px;border:1px solid var(--border-subtle-01);overflow:hidden;background:var(--layer-background-01)}
.frame .cds--header__nav{display:block}
.frame+.cap{margin-top:24px}
.np{padding:16px 0 0;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.np h2{margin:0 16px 8px;font:600 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)}
.np ul{margin:0;padding:0;list-style:none}
.np li{padding:8px 16px;border-bottom:1px solid var(--border-subtle-01)}
.np strong{display:block;font-weight:400;color:var(--text-primary)}
.np span{font-size:12px;line-height:16px;letter-spacing:.32px;color:var(--text-secondary)}
.np .cds--link{display:inline-block;margin:12px 16px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Demo(){
 const [open,setOpen]=React.useState(true);
 return h('div',{className:'frame'},
  h(C.Header,{'aria-label':'Platform'},
   h(C.HeaderName,{href:'#',prefix:'IBM'},'Platform'),
   h(C.HeaderNavigation,{'aria-label':'Platform'},
    h(C.HeaderMenuItem,{href:'#',isActive:true},'Catalog'),
    h(C.HeaderMenuItem,{href:'#'},'Billing')),
   h(C.HeaderGlobalBar,null,
    h(C.HeaderGlobalAction,{'aria-label':'Notifications'},h(C.Icon,{name:'notification',size:20})),
    h(C.HeaderGlobalAction,{'aria-label':open?'Close switcher':'Open switcher','aria-expanded':open,isActive:open,id:'hp-switcher-btn',onClick:()=>setOpen(!open)},h(C.Icon,{name:'switcher',size:20}))),
   h(C.HeaderPanel,{expanded:open,onHeaderPanelFocus:()=>setOpen(false),href:'#hp-switcher-btn'},
    h(C.Switcher,{'aria-label':'Switcher',expanded:open},
     h(C.SwitcherItem,{href:'#','aria-label':'Platform',isSelected:true},'Platform'),
     h(C.SwitcherDivider),
     h(C.SwitcherItem,{href:'#','aria-label':'Analytics'},'Analytics'),
     h(C.SwitcherItem,{href:'#','aria-label':'Storage'},'Storage'),
     h(C.SwitcherItem,{href:'#','aria-label':'Security'},'Security'),
     h(C.SwitcherItem,{href:'#','aria-label':'Integrations'},'Integrations'),
     h(C.SwitcherDivider),
     h(C.SwitcherItem,{href:'#','aria-label':'All products'},'All products')))));
}
const NOTES=[['Cluster prod-us-south upgraded to 1.31.2','12 minutes ago'],['Invoice for October 2026 is ready','2 hours ago'],['API key legacy-backup expired','Yesterday']];
function Notifications(){
 const [open,setOpen]=React.useState(true);
 return h('div',{className:'frame',style:{height:352}},
  h(C.Header,{'aria-label':'Platform'},
   h(C.HeaderName,{href:'#',prefix:'IBM'},'Platform'),
   h(C.HeaderGlobalBar,null,
    h(C.HeaderGlobalAction,{'aria-label':open?'Close notifications':'Open notifications','aria-expanded':open,isActive:open,id:'hp-notes-btn',onClick:()=>setOpen(!open)},h(C.Icon,{name:'notification',size:20})),
    h(C.HeaderGlobalAction,{'aria-label':'Open switcher'},h(C.Icon,{name:'switcher',size:20}))),
   h(C.HeaderPanel,{expanded:open,onHeaderPanelFocus:()=>setOpen(false),href:'#hp-notes-btn','aria-label':'Notifications'},
    h('div',{className:'np'},
     h('h2',null,'Notifications'),
     h('ul',null,NOTES.map(n=>h('li',{key:n[0]},h('strong',null,n[0]),h('span',null,n[1])))),
     h('a',{className:'cds--link',href:'#',tabIndex:open?0:-1},'View all notifications')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,
 Cap('Switcher: switcher action active, panel expanded (256px), current product first and selected; click the action to close'),h(Demo),
 Cap('Your own content (no Switcher): a notifications panel; Escape or moving focus out closes it'),h(Notifications)));
</script>
