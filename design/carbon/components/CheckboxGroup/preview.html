<!-- @dsCard group="Forms" height=878 subtitle="Vertical, horizontal, invalid, warning, read-only, disabled, AI decorator; alert settings with select all" -->
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--text-primary)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.panel{background:var(--layer-01);padding:24px}
.ph{margin:0 0 4px;font:400 20px/28px var(--font-sans)}
.psub{margin:0 0 16px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.kids{padding-inline-start:24px;display:flex;flex-direction:column;gap:8px}
.ai p{margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function boxes(p,checked){return [h(C.Checkbox,{key:1,id:p+'1',labelText:'Email',defaultChecked:checked}),h(C.Checkbox,{key:2,id:p+'2',labelText:'SMS'}),h(C.Checkbox,{key:3,id:p+'3',labelText:'Slack',defaultChecked:checked})]}
const EVENTS=[['nr','Node not ready'],['df','Deployment failed'],['ce','Certificate expiring'],['qo','Quota over 80%']];
function Alerts(){
 const [on,setOn]=React.useState({nr:true,df:true});
 const n=EVENTS.filter(e=>on[e[0]]).length;
 const all=n===EVENTS.length, some=n>0&&!all;
 return h('div',{className:'panel'},
  h('p',{className:'ph'},'Alert notifications'),
  h('p',{className:'psub'},'Applies to every cluster in the platform resource group.'),
  h(C.Stack,{gap:7},
   h(C.CheckboxGroup,{legendText:'Send alerts for',helperText:'At most one message per event every 15 minutes.'},
    h(C.Checkbox,{id:'cg-all',labelText:'All events',checked:all,indeterminate:some,onChange:()=>{const v=!all;const o={};EVENTS.forEach(e=>o[e[0]]=v);setOn(o)}}),
    h('div',{className:'kids'},EVENTS.map(e=>h(C.Checkbox,{key:e[0],id:'cg-'+e[0],labelText:e[1],checked:!!on[e[0]],onChange:ev=>setOn(Object.assign({},on,{[e[0]]:ev.target.checked}))})))),
   h('div',null,h(C.Button,{size:'md'},'Save settings'))));
}
function App(){
 const AI=h(C.AILabel,{size:'mini','aria-label':'Why these channels'},h(C.AILabelContent,null,h('div',{className:'ai'},h('p',null,'Your team answered 90% of alerts on Email and Slack last month.'))));
 return h('div',{className:'grid'},
  h('div',null,Cap('Vertical (default) with helper text'),
   h(C.CheckboxGroup,{legendText:'Notify me by',helperText:'You can change this later in your profile'},boxes('a',true))),
  h('div',{style:{gridColumn:'span 2'}},Cap('orientation="horizontal"'),
   h(C.CheckboxGroup,{legendText:'Notify me by',orientation:'horizontal',helperText:'Choose any number of channels'},boxes('b',true))),
  h('div',null,Cap('invalid'),
   h(C.CheckboxGroup,{legendText:'Notify me by',invalid:true,invalidText:'Select at least one channel'},boxes('c',false))),
  h('div',null,Cap('warn'),
   h(C.CheckboxGroup,{legendText:'Notify me by',warn:true,warnText:'SMS may incur carrier charges'},boxes('d',true))),
  h('div',null,Cap('readOnly and disabled'),
   h('div',{style:{display:'flex',gap:32}},
    h(C.CheckboxGroup,{legendText:'Read-only',readOnly:true},boxes('e',true).slice(0,2)),
    h(C.CheckboxGroup,{legendText:'Disabled',disabled:true,helperText:'Managed by admin'},boxes('f',true).slice(0,2)))),
  h('div',null,Cap('decorator: an AILabel after the legend'),
   h(C.CheckboxGroup,{legendText:'Suggested channels',decorator:AI},boxes('g',true))),
  h('div',{style:{gridColumn:'span 2'}},Cap('In context: alert settings with a select-all parent (indeterminate when some are checked)'),h(Alerts)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
