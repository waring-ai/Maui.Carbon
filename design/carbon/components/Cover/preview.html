<!-- @dsCard height=288 -->
<style>
html,body{margin:0;background:var(--background)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--background)}
.cover svg{position:absolute;left:0;top:0}
.b-blue{fill:var(--interactive)}
.b-ink{fill:var(--background-inverse)}
.b-tint{fill:var(--layer-accent-01)}
.b-signal{fill:var(--support-warning)}
.sq{rx:var(--radius-none);ry:var(--radius-none)}
.plus{fill:var(--interactive)}
.txt{position:absolute;left:32px;bottom:32px;width:440px}
.txt h1{margin:0;font-family:var(--font-sans);font-weight:300;font-size:96px;line-height:.95;letter-spacing:0;color:var(--text-primary)}
.txt p{margin:16px 0 0;font-family:var(--font-sans);font-size:14px;line-height:18px;letter-spacing:.16px;color:var(--text-secondary)}
</style>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- derivation
blocks: interactive 240x192 slab (7.5 x 6 steps of spacing-07), background-inverse 240x96 bleeding off the right edge and 128x96 bottom, layer-accent-01 120x96, support-warning 32x32 (size-small) as the one signal.
arrangement: flush modular grid on a 32px pitch (spacing-07), square corners (radius-none), blocks bleed off the top and right edges; a staggered stack with the blue slab leading.
pattern: precise, technical, 8px mini-unit grid -> a plus grid at one pitch (spacing-07, 32px), 3 rows x 10 cols = 30 marks, in interactive, between the lower blocks.
steps/radii used: spacing-07 (32px) pitch and multiples, size-small (32px) signal, radius-none on every block.
-->
<rect class="sq b-blue" x="480" y="0" width="240" height="192"/>
<rect class="sq b-ink" x="720" y="0" width="240" height="96"/>
<rect class="sq b-tint" x="720" y="96" width="120" height="96"/>
<rect class="sq b-signal" x="840" y="96" width="32" height="32"/>
<rect class="sq b-ink" x="480" y="192" width="128" height="96"/>
<g id="plusgrid"></g>
</svg>
<div class="txt"><h1>Carbon</h1><p>Carbon is IBM's open source design system for products and digital experiences.</p></div>
</div>
<script>
// plus grid: 3 rows x 10 cols, pitch 32px (spacing-07), arms 12px x 2px, from x=640 to the right edge, y=192..288
(function(){var g=document.getElementById('plusgrid'),ns='http://www.w3.org/2000/svg',x0=656,y0=208,p=32;
for(var r=0;r<3;r++)for(var c=0;c<10;c++){var cx=x0+c*p,cy=y0+r*p;
 [[cx-6,cy-1,12,2],[cx-1,cy-6,2,12]].forEach(function(a){var e=document.createElementNS(ns,'rect');e.setAttribute('class','plus');e.setAttribute('x',a[0]);e.setAttribute('y',a[1]);e.setAttribute('width',a[2]);e.setAttribute('height',a[3]);g.appendChild(e);});}})();
</script>
