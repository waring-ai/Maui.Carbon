<!-- @dsCard group="Status" height=974 subtitle="Determinate, indeterminate, finished, error; big and small; default, inline and indented; upload panel" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.card{border:1px solid var(--border-subtle-01);padding:16px;display:flex;flex-direction:column;gap:20px} .card h3{margin:0;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .card .sub{margin:-16px 0 0;font:400 14px/20px var(--font-sans);color:var(--text-secondary)} .files{display:flex;flex-direction:column;gap:16px} .acts{display:flex;justify-content:flex-end;gap:1px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState,useEffect}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
function Live(){
 const [v,setV]=useState(0);
 useEffect(()=>{const t=setInterval(()=>setV(x=>x>=320?0:x+16),600);return()=>clearInterval(t)},[]);
 const done=v>=256, val=Math.min(v,256);
 return h(C.ProgressBar,{label:'Copying snapshot db-backup-0412',value:val,max:256,status:done?'finished':'active',helperText:done?'Copied 256 of 256 GB':'Copied '+val+' of 256 GB'});
}
function Uploads(){
 return h(C.Layer,{withBackground:true,className:'card'},
  h('h3',null,'Uploading to logs-archive'),
  h('p',{className:'sub'},'3 files, 1.4 GB. You can leave this page; uploads continue in the background.'),
  h(C.ProgressBar,{label:'Total',value:62,helperText:'62% · about 2 minutes left'}),
  h('div',{className:'files'},
   h(C.ProgressBar,{label:'api-gateway.log.gz',value:100,status:'finished',size:'small',type:'inline'}),
   h(C.ProgressBar,{label:'ingress.log.gz',value:48,size:'small',type:'inline'}),
   h(C.ProgressBar,{label:'audit.json',value:30,status:'error',size:'small',helperText:'Upload failed: the file is larger than 5 GB. Split it or use multipart upload.'})),
  h('div',{className:'acts'},h(C.Button,{kind:'secondary',size:'md'},'Cancel uploads'),h(C.Button,{kind:'primary',size:'md',renderIcon:'restart'},'Retry failed')));
}
function App(){
 return h('div',{className:'stack'},
  h('div',{className:'grid'},
   B('Determinate (status="active"): value 45 of 100, helper with the exact count',h(C.ProgressBar,{label:'Uploading usage-march.csv',value:45,helperText:'45 of 100 MB'})),
   B('Indeterminate: omit value while the size is unknown',h(C.ProgressBar,{label:'Preparing export',helperText:'Collecting billing records'})),
   B('status="finished": full green bar and check icon',h(C.ProgressBar,{label:'Uploading usage-march.csv',value:100,status:'finished',helperText:'100 of 100 MB uploaded'})),
   B('status="error": red bar, error icon, helper says what to do',h(C.ProgressBar,{label:'Uploading usage-march.csv',value:60,status:'error',helperText:'Connection lost. Check your network and try again.'})),
   B('size="small" (4px track) for cards, tables and side panels',h(C.ProgressBar,{label:'Provisioning worker nodes',value:70,size:'small',helperText:'7 of 10 nodes ready'})),
   B('hideLabel: the label is kept for screen readers only',h(C.ProgressBar,{label:'Storage used in logs-archive',hideLabel:true,value:82,helperText:'820 GB of 1 TB used'})),
   B('type="inline": label beside the track (data tables, lists)',h(C.ProgressBar,{label:'Rebuilding index',value:35,type:'inline'})),
   B('type="indented": label and helper indented 16px (side panels, dashboard cards)',h(C.ProgressBar,{label:'Rebuilding index',value:35,type:'indented',helperText:'35%'}))),
  h('div',{className:'grid'},
   B('Live: value counts up, then finishes',h(Live)),
   B('In context: an upload panel on a Layer (the track follows the layer) with a total and per-file bars',h(Uploads))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
