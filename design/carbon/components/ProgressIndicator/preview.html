<!-- @dsCard group="Status" height=885 subtitle="Horizontal and vertical; complete, current, incomplete, invalid, disabled; clickable, spaced; create-cluster wizard" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.wiz{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--border-subtle-01);background:var(--layer-01)} .wiz-steps{padding:24px 16px;border-inline-end:1px solid var(--border-subtle-01)} .wiz-body{display:flex;flex-direction:column} .wiz-main{flex:1;padding:24px 16px} .wiz-main h3{margin:0 0 4px;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .wiz-main p{margin:0 0 16px;font:400 14px/20px var(--font-sans);color:var(--text-secondary)} .wiz-foot{display:flex;justify-content:flex-end;gap:1px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
const S=(label,extra)=>h(C.ProgressStep,Object.assign({key:label,label},extra||{}));
function Clickable(){
 const [i,setI]=useState(1);
 return h(C.ProgressIndicator,{currentIndex:i,onChange:setI},
  S('Plan',{description:'Step 1: choose a plan'}),
  S('Nodes',{description:'Step 2: configure worker nodes'}),
  S('Networking',{invalid:true,secondaryLabel:'Fix the subnet',description:'Step 3: networking has an error'}),
  S('Add-ons',{secondaryLabel:'Optional',description:'Step 4: add-ons'}),
  S('Review',{disabled:true,description:'Step 5: review, available after networking is fixed'}));
}
const steps=[
 {label:'Choose plan',title:'Choose a plan',text:'Standard plan selected: $0.11 per node hour, autoscaling and a 99.9% SLA.'},
 {label:'Configure nodes',title:'Configure worker nodes',text:'3 nodes of bx2.4x16 in us-east-1, us-east-2 and us-east-3.'},
 {label:'Networking',title:'Set up networking',text:'Public and private endpoints on VPC prod-vpc, subnet 10.240.0.0/24.'},
 {label:'Add-ons',secondary:'Optional',title:'Add-ons',text:'Logging and monitoring agents. You can add them later.'},
 {label:'Review',title:'Review and create',text:'Check the summary, then create the cluster. Provisioning takes about 20 minutes.'}];
function Wizard(){
 const [i,setI]=useState(1);
 const s=steps[i], last=i===steps.length-1;
 return h('div',{className:'wiz'},
  h('div',{className:'wiz-steps'},h(C.ProgressIndicator,{vertical:true,currentIndex:i,onChange:n=>{if(n<i)setI(n)}},steps.map(x=>S(x.label,{secondaryLabel:x.secondary})))),
  h('div',{className:'wiz-body'},
   h('div',{className:'wiz-main'},h('h3',null,s.title),h('p',null,s.text),h(C.InlineNotification,{kind:'info',lowContrast:true,hideCloseButton:true,title:'Step '+(i+1)+' of '+steps.length,subtitle:'Completed steps are clickable so you can go back and change them.'})),
   h('div',{className:'wiz-foot'},h(C.Button,{kind:'secondary',disabled:i===0,onClick:()=>setI(i-1)},'Back'),h(C.Button,{kind:'primary',onClick:()=>setI(last?0:i+1)},last?'Create cluster':'Next'))));
}
function App(){
 return h('div',{className:'stack'},
  B('Horizontal with onChange (click a step): complete, current, invalid with helper text, optional, disabled. Labels over 88px are truncated, so keep them short',h(Clickable)),
  B('spaceEqually: steps share the full width',h(C.ProgressIndicator,{currentIndex:2,spaceEqually:true},S('Choose plan'),S('Configure nodes'),S('Networking'),S('Review'))),
  h('div',{className:'grid'},
   B('vertical: preferred when there is room; labels can wrap',h(C.ProgressIndicator,{vertical:true,currentIndex:2},S('Create bucket'),S('Set access policy'),S('Upload objects',{secondaryLabel:'3 of 12 files done'}),S('Enable versioning',{secondaryLabel:'Optional'}))),
   B('vertical with an invalid and a disabled step; not clickable (no onChange)',h(C.ProgressIndicator,{vertical:true,currentIndex:1},S('Generate key'),S('Assign scopes',{invalid:true,secondaryLabel:'Select at least one scope'}),S('Download key',{disabled:true})))),
  B('In context: create-cluster wizard with Back / Next',h(Wizard)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
