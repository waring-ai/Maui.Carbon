<!-- @dsCard group="Forms" height=873 subtitle="Label inside the field: filled, character and word counters, invalid, warning, read-only, disabled, skeleton" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:24px}
.panel{max-inline-size:400px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.pf{display:flex} .pf > .cds--btn{flex:1 1 0;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el){return h('div',null,Cap(t),el)}

function ResolvePanel(){
 const [note,setNote]=React.useState('');
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Resolve incident INC-2041'),h('p',null,'The note is posted to the incident timeline and the on-call channel.')),
  h(C.FluidForm,{'aria-label':'Resolve incident',onSubmit:function(e){e.preventDefault()}},
   h(C.FluidTextArea,{id:'inc-note',labelText:'Resolution note',placeholder:'What fixed it, and what follow-up is needed',rows:3,enableCounter:true,maxCount:280,value:note,onChange:function(e){setNote(e.target.value)}})),
  h('div',{className:'pf'},h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),h(C.Button,{kind:'primary',size:'xl',disabled:!note.trim()},'Resolve incident')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Default (placeholder)',h(C.FluidTextArea,{labelText:'Description',placeholder:'What does this deployment do?',rows:3})),
   Cell('Filled, character counter',h(C.FluidTextArea,{labelText:'Release notes',defaultValue:'Adds retry with backoff to the payments webhook.',enableCounter:true,maxCount:200,rows:3})),
   Cell('Word counter (counterMode="word")',h(C.FluidTextArea,{labelText:'Summary',defaultValue:'Rotate the storage keys before the audit on Friday.',enableCounter:true,counterMode:'word',maxCount:50,rows:3})),
   Cell('Invalid',h(C.FluidTextArea,{labelText:'Description',defaultValue:'TBD',invalid:true,invalidText:'Enter at least 20 characters so reviewers know what changed',rows:3})),
   Cell('Warning',h(C.FluidTextArea,{labelText:'Release notes',defaultValue:'Migrates every bucket in the account to the new storage class.',warn:true,warnText:'Notes over 500 characters are cut off in email digests',rows:3})),
   Cell('Read only',h(C.FluidTextArea,{labelText:'Change log',defaultValue:'Generated by the build pipeline for release 2.4.1.',readOnly:true,rows:3})),
   Cell('Disabled',h(C.FluidTextArea,{labelText:'Release notes',defaultValue:'Locked while the deployment is rolling out.',disabled:true,rows:3})),
   Cell('Skeleton (FluidTextAreaSkeleton)',h(C.FluidTextAreaSkeleton))),
  Cap('In context: a resolution note in an incident side panel'),
  h(ResolvePanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
