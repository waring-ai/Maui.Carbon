<!-- @dsCard group="Feedback" height=936 subtitle="Persistent in-page message, no close button: info and warning, link, action, high contrast, in a settings page" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .col{display:flex;flex-direction:column;gap:16px;margin-bottom:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;align-items:start}
.ctx{border:1px solid var(--border-subtle-01);padding:24px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.ctx h4{font:400 20px/28px var(--font-sans);margin:0 0 4px}.ctx p{margin:0 0 16px;color:var(--text-secondary);max-inline-size:560px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function App(){
 return h('div',null,
  Cap('Recommended kinds: info (default) with an inline link, warning with an action button; info without a title'),
  h('div',{className:'col'},
   h(C.Callout,{kind:'info',title:'Maintenance on Saturday',titleId:'co-1',subtitle:h('span',null,'Control plane upgrades run from 02:00 to 04:00 UTC; the API is read-only during that time. ',h(C.Link,{href:'#',inline:true,'aria-describedby':'co-1'},'View the schedule'))}),
   h(C.Callout,{kind:'warning',title:'vCPU quota almost reached',titleId:'co-2',subtitle:'This project uses 92 of 100 vCPUs. New nodes fail to start once the quota is reached.',actionButtonLabel:'Request increase'}),
   h(C.Callout,{kind:'info',subtitle:'Prices shown exclude tax. Your invoice lists tax separately.'})),
  Cap('Other kinds still render (Carbon recommends info and warning only): info-square, warning-alt, success, error'),
  h('div',{className:'grid'},
   h(C.Callout,{kind:'info-square',title:'Read-only project',subtitle:'You can view resources but not change them.'}),
   h(C.Callout,{kind:'warning-alt',title:'Preview feature',subtitle:'GPU node pools may change before general availability.'}),
   h(C.Callout,{kind:'success',title:'Domain verified',subtitle:'api.example.com now routes to this cluster.'}),
   h(C.Callout,{kind:'error',title:'Billing suspended',subtitle:'Update the payment method to resume deployments.'})),
  Cap('lowContrast={false}: the inverse style, for a message that must stand out'),
  h('div',{className:'grid'},
   h(C.Callout,{kind:'info',lowContrast:false,title:'Region retiring',subtitle:'ap-south-1 closes on 31 Mar 2027.',actionButtonLabel:'Plan migration'}),
   h(C.Callout,{kind:'warning',lowContrast:false,title:'Public endpoint',subtitle:'Anyone with the URL can reach this service.'})),
  Cap('In context: a callout placed right above the action it is about, on a cluster settings page'),
  h('div',{className:'ctx'},
   h('h4',null,'Delete cluster'),
   h('p',null,'Deleting prod-us-east removes its nodes, load balancers and DNS records.'),
   h('div',{style:{marginBottom:16}},
    h(C.Callout,{kind:'warning',title:'3 persistent volumes are deleted too',titleId:'co-del',subtitle:h('span',null,'Snapshot volumes you want to keep before you delete the cluster. ',h(C.Link,{href:'#',inline:true,'aria-describedby':'co-del'},'How to snapshot volumes'))})),
   h(C.Button,{kind:'danger',size:'md'},'Delete cluster')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
