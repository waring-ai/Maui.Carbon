<!-- @dsCard group="Forms" height=1412 subtitle="Open single and range calendars; simple, sm / md / lg, DatePickerInput; helper, invalid and warning (single and range), read-only, disabled, skeleton; usage export form" -->
<style>body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.sec{margin-bottom:32px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tall{min-height:428px}
.ctx{padding:24px;max-width:592px}
.ttl{font:600 16px/24px var(--font-sans);color:var(--text-primary);margin:0 0 4px}
.sub{font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);margin:0 0 24px}
.row{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
.row > :last-child{flex:1}
.actions{display:flex;justify-content:flex-end;margin-top:32px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el,cls){return h('div',{className:cls},Cap(t),el)}
const now=new Date(),Y=now.getFullYear(),M=now.getMonth(),D=now.getDate();
const d=n=>new Date(Y,M,n);
const day=24*3600*1000;
function App(){
 const [range,setRange]=React.useState([new Date(Y,M,1),new Date(Y,M,Math.min(D,28))]);
 const span=range.length===2?Math.round((range[1]-range[0])/day)+1:0;
 const tooLong=span>92;
 return h('div',null,
  Cap('Open calendars'),
  h('div',{className:'g3 sec'},
   Cell('Single: selected, today (dot), minDate',h(C.DatePicker,{id:'dp-open',datePickerType:'single',labelText:'Snapshot date',defaultValue:d(Math.min(D+3,28)),minDate:d(Math.max(D-2,1)),defaultOpen:true}),'tall'),
   Cell('Range: start, end and the days between',h(C.DatePicker,{id:'dp-open-r',datePickerType:'range',labelText:'Start date',endLabelText:'End date',defaultValue:[d(6),d(19)],defaultOpen:true}),'tall'),
   Cell('Other formats: dateFormat="Y-m-d", large',h(C.DatePicker,{id:'dp-open-iso',datePickerType:'single',size:'lg',labelText:'Certificate expiry',dateFormat:'Y-m-d',defaultValue:new Date(Y+1,1,14),defaultOpen:true}),'tall')),
  Cap('Variants and sizes'),
  h('div',{className:'g3 sec'},
   Cell('Simple (typed only, no calendar)',h(C.DatePicker,{id:'dp-simple',datePickerType:'simple',labelText:'Contract start',placeholder:'mm/dd/yyyy',helperText:'Format mm/dd/yyyy'})),
   Cell('Small (sm, 32px)',h(C.DatePicker,{id:'dp-sm',size:'sm',labelText:'Report date',defaultValue:d(12)})),
   Cell('DatePickerInput on its own (your own calendar)',h('div',{className:'cds--date-picker cds--date-picker--single'},h(C.DatePickerInput,{id:'dpi-alone',labelText:'Billing date',placeholder:'mm/dd/yyyy',datePickerType:'single'})))),
  Cap('States'),
  h('div',{className:'g3 sec'},
   Cell('Helper text',h(C.DatePicker,{id:'dp-help',labelText:'Go-live date',helperText:'Deployments are frozen on public holidays'})),
   Cell('Invalid',h(C.DatePicker,{id:'dp-inv',labelText:'Snapshot date',defaultValue:d(1),invalid:true,invalidText:'Choose a date in the last 30 days'})),
   Cell('Warning',h(C.DatePicker,{id:'dp-warn',labelText:'Maintenance date',defaultValue:new Date(Y,11,26),warn:true,warnText:'December 26 is a holiday in some regions'})),
   Cell('Range, invalid (one message for both)',h(C.DatePicker,{id:'dp-rinv',datePickerType:'range',labelText:'Start date',endLabelText:'End date',defaultValue:[d(2),d(27)],invalid:true,invalidText:'Choose a range of 14 days or less'})),
   Cell('Range, warning',h(C.DatePicker,{id:'dp-rwarn',datePickerType:'range',labelText:'Start date',endLabelText:'End date',defaultValue:[d(3),d(10)],warn:true,warnText:'Data before the 5th is still being processed'})),
   Cell('Read only',h(C.DatePicker,{id:'dp-ro',labelText:'Created on',defaultValue:d(2),readOnly:true})),
   Cell('Disabled',h(C.DatePicker,{id:'dp-dis',labelText:'Renewal date',defaultValue:d(28),disabled:true,helperText:'Renews automatically'})),
   Cell('Skeleton',h(C.DatePickerSkeleton)),
   Cell('Skeleton, range',h(C.DatePickerSkeleton,{range:true}))),
  Cap('In context: export usage data'),
  h(C.Layer,{withBackground:true,className:'ctx'},
   h('p',{className:'ttl'},'Export usage'),
   h('p',{className:'sub'},'Exports include every resource in the Acme Corp account.'),
   h('div',{className:'row'},
    h(C.DatePicker,{id:'ex-range',datePickerType:'range',labelText:'From',endLabelText:'To',value:range,onChange:setRange,maxDate:now,
     invalid:tooLong,invalidText:'Choose a range of 92 days or less ('+span+' days chosen)'}),
    h(C.Dropdown,{id:'ex-fmt',titleText:'Format',label:'Choose a format',items:['CSV','JSON','Parquet'],initialSelectedItem:'CSV'})),
   h('div',{className:'actions'},h(C.Button,{kind:'primary',disabled:tooLong||range.length<2,renderIcon:'download'},'Export '+(span?span+' days':'')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
