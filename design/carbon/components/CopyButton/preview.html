<!-- @dsCard group="Actions" height=498 subtitle="Copy icon button that confirms with a Copied! tooltip: states, sizes, in a key details panel" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;height:80px}.grid{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.lbl{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
.panel{border:1px solid var(--border-subtle-01);padding:24px 24px 48px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.panel h4{font:400 20px/28px var(--font-sans);margin:0 0 16px}
.kv{display:grid;grid-template-columns:140px 1fr;align-items:center;row-gap:8px}.kv dt{color:var(--text-secondary)}.kv dd{margin:0}
.val{display:flex;align-items:center;justify-content:space-between;max-inline-size:440px;background:var(--layer-01);padding-inline-start:16px;font:400 14px/20px var(--font-mono);letter-spacing:.32px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const copy=t=>()=>{try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}};
function Cell(lbl,el){return h('div',{className:'cell'},el)}
function App(){
 return h('div',null,
  Cap('States: rest, hover/focus label (open), feedback after a click (open), disabled'),
  h('div',{className:'grid'},
   Cell('rest',h(C.CopyButton,{iconDescription:'Copy key ID'})),
   Cell('label',h(C.CopyButton,{iconDescription:'Copy key ID',defaultOpen:true})),
   Cell('feedback',h(C.CopyButton,{iconDescription:'Copy key ID',defaultCopied:true,feedbackTimeout:3600000})),
   Cell('disabled',h(C.CopyButton,{iconDescription:'Copy key ID',disabled:true}))),
  Cap('Sizes sm (32px), md (default, 40px), lg (48px); click any of them to see the feedback'),
  h('div',{className:'row'},
   h(C.CopyButton,{size:'sm',iconDescription:'Copy endpoint',feedback:'Endpoint copied'}),
   h(C.CopyButton,{size:'md',iconDescription:'Copy endpoint',feedback:'Endpoint copied'}),
   h(C.CopyButton,{size:'lg',iconDescription:'Copy endpoint',feedback:'Endpoint copied'})),
  Cap('In context: API key details. Each value has its own copy button with a specific label'),
  h('div',{className:'panel'},
   h('h4',null,'ci-deploy'),
   h('dl',{className:'kv',style:{margin:0}},
    h('dt',null,'Key ID'),h('dd',null,h('div',{className:'val'},'ak_7f3c9e21b04d',h(C.CopyButton,{size:'sm',align:'right',iconDescription:'Copy key ID',onClick:copy('ak_7f3c9e21b04d')}))),
    h('dt',null,'Endpoint'),h('dd',null,h('div',{className:'val'},'https://api.us-east.example.com',h(C.CopyButton,{size:'sm',align:'right',iconDescription:'Copy endpoint',onClick:copy('https://api.us-east.example.com')}))),
    h('dt',null,'Created'),h('dd',null,'12 Mar 2026 by ops@example.com'))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
