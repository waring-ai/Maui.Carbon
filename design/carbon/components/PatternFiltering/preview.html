<!-- @dsCard group="Patterns" width=1280 height=1534 subtitle="Filter panel with instant results, applied-filter tags, result count, clear; batch filters in a toolbar flyout" page -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.head{margin:16px 0 24px}
.head h1{margin:0;color:var(--text-primary)}
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);gap:32px;align-items:start}
/* filter panel: on layer-01, header row with Clear all, one accordion item per category */
.fpanel{background:var(--layer-01)}
.fpanel__head{display:flex;align-items:center;justify-content:space-between;height:48px;padding-inline-start:16px;border-bottom:1px solid var(--border-subtle-01)}
.fpanel__head h2{margin:0;color:var(--text-primary)}
.fpanel .cds--accordion__content{padding-block-end:16px}
/* the accordion title already names the category; keep the radio legend for screen readers only */
.pf-radios legend{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fgroup{display:grid;gap:4px}
.fclear{margin-top:8px}
.count{display:flex;align-items:center;gap:8px}
.count .n{color:var(--text-primary)}
.applied{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:40px;margin:16px 0 8px}
.applied .lbl{font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);margin-inline-end:8px}
.results .cds--data-table-container{margin:0;padding:0}
.es{padding:48px 32px}
.es h3{margin:0 0 8px;color:var(--text-primary)}
.es p{margin:0 0 24px;color:var(--text-secondary);max-width:48ch}
.sep{height:1px;background:var(--border-subtle-01);margin:48px 0}
/* batch example: hand-built toolbar like the DataTable toolbar, the flyout is a Popover */
.tb{display:flex;align-items:center;background:var(--layer-01);height:48px}
.tb .cds--search{flex:1}
.tb .ind{display:flex;align-items:center;padding:0 8px}
.flyhost{position:relative;min-height:440px}
.bcount{margin:0;padding:12px 16px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);background:var(--layer-01);border-top:1px solid var(--border-subtle-01)}
.fp{padding:16px;inline-size:368px;box-sizing:border-box}
.fp fieldset{border:0;margin:0 0 16px;padding:0}
.fp legend{font:600 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary);margin:0 0 8px;padding:0}
.fbtns{display:flex;margin:0 -16px -16px}
.fbtns .cds--btn{flex:1 1 50%;max-inline-size:none}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState,useMemo}=React;
function Cap(t){return h('p',{className:'cap'},t)}
const data=[
 ['prod-eu-01','Running','Frankfurt','1.31',12],['prod-us-02','Running','Dallas','1.31',18],['staging-eu-01','Updating','Frankfurt','1.30',4],
 ['payments-ap-01','Warning','Tokyo','1.30',6],['analytics-us-01','Failed','Washington DC','1.29',8],['dev-sandbox-03','Stopped','London','1.31',1],
 ['ml-training-01','Running','Dallas','1.31',24],['edge-cache-02','Running','London','1.31',3],['prod-eu-02','Running','Frankfurt','1.31',12],
 ['batch-jobs-us-01','Running','Washington DC','1.30',10],['search-eu-01','Running','Frankfurt','1.30',6],['qa-us-01','Stopped','Dallas','1.29',2],
 ['ingest-ap-02','Running','Tokyo','1.31',9],['reports-eu-03','Updating','London','1.31',4]
].map((r,i)=>({id:'k'+i,name:r[0],status:r[1],region:r[2],version:r[3],nodes:r[4]}));
const kind={Running:'succeeded',Updating:'in-progress',Warning:'caution-major',Failed:'failed',Stopped:'not-started'};
const statuses=['Running','Updating','Warning','Failed','Stopped'];
const regions=['Dallas','Frankfurt','London','Tokyo','Washington DC'];
const versions=[['any','Any version'],['1.31','1.31'],['1.30','1.30'],['1.29','1.29 (end of support)']];
const headers=[{key:'name',header:'Name'},{key:'status',header:'Status'},{key:'region',header:'Region'},{key:'version',header:'Version'},{key:'nodes',header:'Worker nodes',align:'right'}];
const cell=(v,row,hd)=>hd.key==='name'?h(C.Link,{href:'#'},v):hd.key==='status'?h(C.IconIndicator,{kind:kind[v],label:v}):v;
const countOf=(k,v)=>data.filter(d=>d[k]===v).length;
function toggle(list,v){return list.includes(v)?list.filter(x=>x!==v):list.concat(v)}

function Panel(p){
 const {f,set}=p;
 const any=f.status.length||f.region.length||f.version!=='any';
 const group=(key,title,opts)=>h(C.AccordionItem,{title:title+(f[key].length?' ('+f[key].length+')':''),open:true},
  h('fieldset',{className:'cds--fieldset',style:{margin:0}},h('legend',{className:'cds--visually-hidden'},title),
   h('div',{className:'fgroup'},opts.map(o=>h(C.Checkbox,{key:o,id:'pf-'+key+'-'+o,labelText:o+' ('+countOf(key,o)+')',checked:f[key].includes(o),onChange:()=>set({...f,[key]:toggle(f[key],o)})})))),
  f[key].length?h(C.Button,{kind:'ghost',size:'sm',className:'fclear',onClick:()=>set({...f,[key]:[]})},'Clear '+title.toLowerCase()):null);
 return h('aside',{className:'fpanel','aria-labelledby':'pf-title'},
  h('div',{className:'fpanel__head'},h('h2',{id:'pf-title',className:'cds--type-heading-compact-01'},'Filters'),
   h(C.Button,{kind:'ghost',size:'md',disabled:!any,onClick:()=>set({status:[],region:[],version:'any'})},'Clear all')),
  h(C.Accordion,{align:'end',size:'md'},
   group('status','Status',statuses),
   group('region','Region',regions),
   h(C.AccordionItem,{title:'Kubernetes version',open:true},
    h('div',{className:'pf-radios'},h(C.RadioButtonGroup,{name:'pf-version',legendText:'Kubernetes version',orientation:'vertical',valueSelected:f.version,onChange:v=>set({...f,version:v})},
     versions.map(v=>h(C.RadioButton,{key:v[0],id:'pf-v-'+v[0],value:v[0],labelText:v[1]})))))));
}
function Instant(){
 const [f,set]=useState({status:['Running'],region:['Frankfurt','Dallas'],version:'any'});
 const [q,setQ]=useState('');
 const rows=useMemo(()=>data.filter(d=>(!f.status.length||f.status.includes(d.status))&&(!f.region.length||f.region.includes(d.region))&&(f.version==='any'||d.version===f.version)&&(!q||d.name.includes(q.toLowerCase()))),[f,q]);
 const tags=[].concat(f.status.map(s=>['status',s,'Status: '+s]),f.region.map(r=>['region',r,'Region: '+r]),f.version!=='any'?[['version',f.version,'Version: '+f.version]]:[]);
 const clearAll=()=>{set({status:[],region:[],version:'any'});setQ('')};
 return h('div',{className:'layout'},
  h(Panel,{f,set}),
  h('div',{className:'results'},
   h(C.Search,{id:'pf-search',labelText:'Search clusters',placeholder:'Search clusters by name',size:'lg',value:q,onChange:e=>setQ(e.target.value)}),
   h('div',{className:'applied'},
    h('span',{className:'lbl count',role:'status','aria-live':'polite'},h('span',{className:'n'},'Showing '+rows.length+' of '+data.length+' clusters')),
    tags.map(t=>h(C.DismissibleTag,{key:t[0]+t[1],text:t[2],size:'md',title:'Remove filter '+t[2],onClose:()=>set(t[0]==='version'?{...f,version:'any'}:{...f,[t[0]]:f[t[0]].filter(x=>x!==t[1])})})),
    tags.length||q?h(C.Button,{kind:'ghost',size:'sm',onClick:clearAll},'Clear filters'):null),
   rows.length?h(C.DataTable,{'aria-label':'Clusters, filtered',headers,rows,renderCell:cell,size:'md',isSortable:true}):
    h('div',{className:'es',style:{background:'var(--layer-01)'}},
     h('h3',{className:'cds--type-heading-03'},'No clusters match these filters'),
     h('p',{className:'cds--type-body-01'},'Remove a filter or clear them all to see the '+data.length+' clusters in this account.'),
     h(C.Button,{kind:'tertiary',onClick:clearAll},'Clear filters'))));
}
function Batch(){
 const [open,setOpen]=useState(true);
 const [applied,setApplied]=useState({region:['Frankfurt','London'],status:['Running']});
 const [draft,setDraft]=useState({region:['Frankfurt','London','Tokyo'],status:['Running']});
 const n=applied.region.length+applied.status.length;
 const rows=data.filter(d=>(!applied.status.length||applied.status.includes(d.status))&&(!applied.region.length||applied.region.includes(d.region)));
 const grp=(key,title,opts)=>h('fieldset',null,h('legend',null,title),opts.map(o=>h(C.Checkbox,{key:o,id:'pb-'+key+'-'+o,labelText:o,checked:draft[key].includes(o),onChange:()=>setDraft({...draft,[key]:toggle(draft[key],o)})})));
 return h('div',{className:'flyhost'},
  h('div',{className:'tb'},
   h(C.Search,{id:'pb-search',labelText:'Search clusters',placeholder:'Search clusters by name',size:'lg'}),
   n?h('div',{className:'ind'},h(C.DismissibleTag,{text:n+' filters',type:'high-contrast',title:'Clear '+n+' filters',onClose:()=>{setApplied({region:[],status:[]});setDraft({region:[],status:[]})}})):null,
   h(C.Popover,{open,align:'bottom-end',onRequestClose:()=>setOpen(false)},
    // workaround: IconButton drops aria-expanded, so the trigger is a native button with the icon-only ghost Button classes
    h('button',{type:'button',className:'cds--btn cds--btn--ghost cds--btn--lg cds--btn--icon-only'+(open?' cds--btn--selected':''),'aria-label':'Filter','aria-expanded':open,onClick:()=>setOpen(!open)},h(C.Icon,{name:'filter',size:16,className:'cds--btn__icon'})),
    h(C.PopoverContent,null,h('div',{className:'fp'},
     grp('status','Status',['Running','Updating','Stopped']),
     grp('region','Region',regions.slice(0,4)),
     h('div',{className:'fbtns'},
      h(C.Button,{kind:'secondary',size:'lg',onClick:()=>setDraft({region:[],status:[]})},'Reset'),
      h(C.Button,{kind:'primary',size:'lg',onClick:()=>{setApplied(draft);setOpen(false)}},'Apply filters'))))),
   h(C.Button,{kind:'primary',renderIcon:'add'},'Create cluster')),
  h('p',{className:'bcount',role:'status'},'Showing '+rows.length+' of '+data.length+' clusters'),
  h(C.DataTable,{'aria-label':'Clusters, batch filtered',headers,rows,renderCell:cell,size:'md'}));
}
function App(){
 return h('div',null,
  h(C.Breadcrumb,{noTrailingSlash:true},h(C.BreadcrumbItem,{href:'#'},'Kubernetes'),h(C.BreadcrumbItem,{isCurrentPage:true},'Clusters')),
  h('div',{className:'head'},h(C.Heading,{className:'cds--type-heading-05'},'Clusters')),
  Cap('Instant filters in a left panel: results update on every change; the count, applied-filter tags and Clear filters sit above the results'),
  h(Instant),
  h('div',{className:'sep'}),
  Cap('Batch filters in a toolbar flyout: choices apply together with Apply filters; when the flyout is closed, the tag shows how many filters are on and clears them'),
  h(Batch));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
