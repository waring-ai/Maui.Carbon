<!-- @dsCard group="Actions" height=510 subtitle="Square icon-only button with a tooltip label: kinds, sizes, selected, badge, disabled" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px}.grp{display:flex;align-items:center;gap:8px}.sep{inline-size:1px;block-size:32px;background:var(--border-subtle-01)}
.cell{display:flex;align-items:flex-start;justify-content:center;height:84px}.grid{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.tb{display:flex;align-items:center;background:var(--layer-01);padding-inline-start:16px;font:600 14px/18px var(--font-sans);letter-spacing:.16px}.tb .t{flex:1}
.ctx{border:1px solid var(--border-subtle-01);padding:16px 16px 56px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const IB=p=>h(C.IconButton,p);
function Toolbar(){
 const [view,setView]=React.useState('list');
 return h('div',{className:'tb'},h('span',{className:'t'},'Clusters'),
  IB({kind:'ghost',label:'List view',renderIcon:'menu',isSelected:view==='list',onClick:()=>setView('list')}),
  IB({kind:'ghost',label:'Dashboard view',renderIcon:'dashboard',isSelected:view==='grid',onClick:()=>setView('grid')}),
  IB({kind:'ghost',label:'Filter clusters',renderIcon:'filter',badgeCount:0}),
  IB({kind:'ghost',label:'Refresh',renderIcon:'restart',align:'bottom',defaultOpen:true}),
  IB({kind:'ghost',label:'Export as CSV',renderIcon:'download'}),
  IB({kind:'ghost',label:'Table settings',renderIcon:'settings'}),
  h(C.Button,{kind:'primary',size:'lg',renderIcon:'add'},'Create cluster'));
}
function App(){
 return h('div',null,
  Cap('Kinds: primary (default), secondary, tertiary, ghost; label shown open with align="bottom"'),
  h('div',{className:'grid'},[['primary','Add node','add'],['secondary','Download logs','download'],['tertiary','Edit labels','edit'],['ghost','Settings','settings']].map(k=>h('div',{className:'cell',key:k[0]},IB({kind:k[0],label:k[1],align:'bottom',defaultOpen:true,renderIcon:k[2]})))),
  Cap('Sizes xs, sm, md, lg (default): square 24, 32, 40, 48px'),
  h('div',{className:'row'},
   h('div',{className:'grp'},['xs','sm','md','lg'].map(s=>IB({key:s,kind:'ghost',size:s,label:'Settings ('+s+')',renderIcon:'settings'}))),
   h('span',{className:'sep'}),
   h('div',{className:'grp'},['xs','sm','md','lg'].map(s=>IB({key:s,kind:'primary',size:s,label:'Add node ('+s+')',renderIcon:'add'})))),
  Cap('States: isSelected (toggled on, aria-pressed) and off, badgeCount 12 and 0 (dot) on ghost lg, disabled primary and ghost'),
  h('div',{className:'row'},
   IB({kind:'ghost',label:'Pinned to dashboard',renderIcon:'star',isSelected:true}),
   IB({kind:'ghost',label:'Pin to dashboard',renderIcon:'star',isSelected:false}),
   h('span',{className:'sep'}),
   IB({kind:'ghost',label:'Notifications',renderIcon:'notification',badgeCount:12}),
   IB({kind:'ghost',label:'New activity',renderIcon:'activity',badgeCount:0}),
   h('span',{className:'sep'}),
   IB({kind:'primary',label:'Add node',renderIcon:'add',disabled:true}),
   IB({kind:'ghost',label:'Download logs',renderIcon:'download',disabled:true})),
  Cap('In context: a table toolbar. View switch uses isSelected, filter has a dot badge, the rest are ghost lg'),
  h('div',{className:'ctx'},h(Toolbar)));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
