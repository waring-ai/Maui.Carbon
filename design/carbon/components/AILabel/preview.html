<!-- @dsCard group="AI" height=918 subtitle="Seven sizes, inline, open callout with actions, revert; decorator on tiles and a CheckboxGroup" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:center;margin-bottom:24px}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.lbl{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 12px/16px var(--font-sans);color:var(--text-secondary)}
.ai-c p{margin:0;font-size:.875rem;line-height:1.28572;letter-spacing:.16px} .ai-c .sec{color:var(--text-secondary)} .ai-c .b{font-weight:600}
.ai-c h2{margin:4px 0;font-size:2rem;font-weight:400;line-height:1.25} .ai-c hr{border:0;height:1px;background:var(--border-subtle-01);margin:1.5rem 0}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:48px;align-items:start;margin-bottom:24px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tiles .cds--tile{min-height:120px}
.tt{margin:0 0 8px;font:600 14px/18px var(--font-sans);letter-spacing:.16px}
.td{margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.inl{font:400 14px/20px var(--font-sans);letter-spacing:.16px;display:flex;align-items:center;gap:8px}
.rev{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.panel{background:var(--layer-01);padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.ph{margin:0 0 4px;font:400 20px/28px var(--font-sans)}
.psub{margin:0 0 16px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center;margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.kv dt{color:var(--text-secondary)} .kv dd{margin:0}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Body(){return h('div',{className:'ai-c'},
  h('p',{className:'sec'},'AI explained'),h('h2',null,'84%'),h('p',{className:'sec b'},'Confidence score'),
  h('p',{className:'sec',style:{marginTop:8}},'Sized from 30 days of CPU and memory use on prod-eu-1 and the growth trend of its node pools.'),
  h('hr'),h('p',{className:'sec'},'Model type'),h('p',{className:'b'},'Foundation model'))}
function Short(t){return h(C.AILabelContent,null,h('div',{className:'ai-c'},h('p',{className:'sec'},'AI explained'),h('p',{style:{marginTop:8}},t)))}
function Actions(){return h(C.AILabelActions,null,
  h(C.IconButton,{kind:'ghost',label:'View source data'},h(C.Icon,{name:'view',size:16})),
  h(C.IconButton,{kind:'ghost',label:'Open model card'},h(C.Icon,{name:'folder--open',size:16})),
  h(C.IconButton,{kind:'ghost',label:'Compare runs'},h(C.Icon,{name:'folders',size:16})),
  h(C.Button,null,'View details'))}
function L(t,el){return h('div',{className:'lbl',key:t},el,t)}
function Reverted(){
 const [ai,setAi]=React.useState(false);
 return h(React.Fragment,null,
  h('dt',null,'Nodes per zone'),h('dd',null,ai?'6':'4 (edited)'),
  h('dd',null,ai?h(C.AILabel,{size:'mini','aria-label':'Why 6 nodes'},Short('6 nodes keep CPU under 70% at the forecast peak.')):h(C.AILabel,{revertActive:true,revertLabel:'Revert to AI value (6)',onRevertClick:()=>setAi(true)})));
}
function App(){
 const sizes=['mini','2xs','xs','sm','md','lg','xl'];
 return h('div',null,
  Cap('Default kind, sizes mini 16, 2xs 20, xs 24 (default), sm 32, md 40, lg 48, xl 64'),
  h('div',{className:'row',style:{alignItems:'flex-end'}},sizes.map(s=>L(s,h(C.AILabel,{size:s,'aria-label':'Show explanation'},h(C.AILabelContent,null,h(Body)))))),
  Cap('Inline kind at sm, md, lg; inline with textLabel (bordered); inline beside text'),
  h('div',{className:'row'},
   ['sm','md','lg'].map(s=>h(C.AILabel,{key:s,kind:'inline',size:s},h(C.AILabelContent,null,h(Body)))),
   ['sm','md','lg'].map(s=>h(C.AILabel,{key:'t'+s,kind:'inline',size:s,textLabel:'Suggested'},h(C.AILabelContent,null,h(Body)))),
   h('span',{className:'inl'},'Estimated cost $1,240 / month',h(C.AILabel,{kind:'inline',size:'sm','aria-label':'How the estimate was made'},Short('Estimated from current usage and list prices for eu-de.')))),
  h('div',{className:'split'},
   h('div',null,Cap('Open callout (defaultOpen, align bottom-start) with AILabelActions'),
    h('div',{style:{height:388}},h(C.AILabel,{size:'xs',defaultOpen:true,align:'bottom-start','aria-label':'Show explanation'},h(C.AILabelContent,null,h(Body),h(Actions))))),
   h('div',null,
    Cap('As a decorator: on a Tile (add cds--tile--decorator) and on a SelectableTile, which take the AI gradient'),
    h('div',{className:'tiles',style:{marginBottom:24}},
     h(C.Tile,{className:'cds--tile--decorator'},h('p',{className:'tt'},'Cost forecast'),h('p',{className:'td'},'Spend is likely to reach $1,410 next month.'),h(C.AILabel,{size:'mini','aria-label':'How the forecast was made'},Short('Forecast from 6 months of billing data.'))),
     h(C.SelectableTile,{id:'ai-st',selected:true,decorator:h(C.AILabel,{size:'mini','aria-label':'Why this is suggested'},Short('Suggested because two nodes ran out of memory last week.'))},h('p',{className:'tt'},'Memory-optimized pool'),h('p',{className:'td'},'Suggested for prod-eu-1'))),
    Cap('On a CheckboxGroup legend (decorator prop)'),
    h('div',null,
     h(C.CheckboxGroup,{legendText:'Suggested alerts',decorator:h(C.AILabel,{size:'mini','aria-label':'Why these alerts'},Short('Picked from alerts teams with similar clusters turn on.'))},
      h(C.Checkbox,{id:'ai-c1',labelText:'Node not ready',defaultChecked:true}),h(C.Checkbox,{id:'ai-c2',labelText:'Disk over 85%',defaultChecked:true}),h(C.Checkbox,{id:'ai-c3',labelText:'Certificate expiry'}))))),
  Cap('In context: an AI sizing recommendation. The edited value shows revertActive (ghost undo button); clicking it restores the AI value and its label'),
  h('div',{className:'panel'},
   h('div',null,h('p',{className:'ph'},'Recommended size for prod-eu-1'),h('p',{className:'psub'},'Review the values before you apply them. AI values are marked; values you change lose the mark.'),
    h(C.ButtonSet,null,h(C.Button,{kind:'secondary'},'Dismiss'),h(C.Button,null,'Apply values'))),
   h('dl',{className:'kv'},
    h('dt',null,'Worker flavor'),h('dd',null,'bx2.8x32'),h('dd',null,h(C.AILabel,{size:'mini','aria-label':'Why bx2.8x32'},Short('Memory use peaks at 27 GB per node.'))),
    h(Reverted),
    h('dt',null,'Zones'),h('dd',null,'eu-de-1, eu-de-2, eu-de-3'),h('dd',null))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
