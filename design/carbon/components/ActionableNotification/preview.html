<!-- @dsCard group="Feedback" height=1366 subtitle="Inline and toast layouts with one action; high and low contrast" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:24px} .col{display:flex;flex-direction:column;gap:8px;margin-bottom:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.page{border:1px solid var(--border-subtle-01);padding:16px 24px 24px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}.page h3{font:400 20px/28px var(--font-sans);margin:0 0 16px}
.tbl{inline-size:100%;border-collapse:collapse;margin-top:16px}.tbl th{text-align:start;font-weight:600;background:var(--layer-accent-01);padding:12px 16px}.tbl td{padding:12px 16px;border-block-end:1px solid var(--border-subtle-01);background:var(--layer-01)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const K=[
 ['error','Deployment failed','checkout-api could not start because the image pull timed out.','View logs'],
 ['success','Cluster created','prod-eu-west is ready with 3 worker nodes.','Open cluster'],
 ['warning','Quota almost reached','You have used 92% of your vCPU quota in us-east.','Request increase'],
 ['info','New version available','Kubernetes 1.30.2 is available for prod-us-east.','Upgrade']];
const N=(k,extra)=>h(C.ActionableNotification,Object.assign({key:k[0],role:'status',kind:k[0],title:k[1],subtitle:k[2],actionButtonLabel:k[3]},extra));
function InContext(){
 const [shown,setShown]=React.useState(true);
 return h('div',{className:'page'},h('h3',null,'Billing'),
  shown?h(C.ActionableNotification,{inline:true,lowContrast:true,role:'status',kind:'warning',title:'Payment method expires soon',subtitle:'The card ending 4242 expires on 30 Nov 2026. Update it to avoid service interruption.',actionButtonLabel:'Update card',onClose:()=>{setShown(false);return false}}):h(C.Button,{kind:'ghost',size:'sm',onClick:()=>setShown(true)},'Show the notification again'),
  h('table',{className:'tbl'},h('thead',null,h('tr',null,['Invoice','Period','Amount'].map(x=>h('th',{key:x},x)))),
   h('tbody',null,[['INV-2026-10','October 2026','$4,218.40'],['INV-2026-09','September 2026','$3,977.15']].map(r=>h('tr',{key:r[0]},r.map((c,i)=>h('td',{key:i},c)))))));
}
function App(){
 return h('div',null,
  Cap('inline: high contrast, ghost action; title and subtitle share a line'),
  h('div',{className:'col'},K.map(k=>N(k,{inline:true}))),
  Cap('inline lowContrast'),
  h('div',{className:'col'},K.map(k=>N(k,{inline:true,lowContrast:true}))),
  Cap('Toast layout (default): tertiary action under the text; caption; lowContrast; hideCloseButton'),
  h('div',{className:'row'},
   h(C.ActionableNotification,{role:'status',kind:'error',title:'Backup failed',subtitle:'The snapshot of orders-db could not be written.',caption:'10:42 AM',actionButtonLabel:'Retry backup'}),
   h(C.ActionableNotification,{role:'status',kind:'warning-alt',lowContrast:true,title:'Certificate expires soon',subtitle:'api.example.com expires in 7 days.',caption:'Today',actionButtonLabel:'Renew certificate'}),
   h(C.ActionableNotification,{role:'status',kind:'info-square',hideCloseButton:true,title:'Invitation pending',subtitle:'maria@example.com has not accepted yet.',actionButtonLabel:'Resend invite'})),
  Cap('In context: an inline notification at the top of a page section (close it, then bring it back)'),
  h(InContext));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
