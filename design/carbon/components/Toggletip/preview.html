<!-- @dsCard group="Overlays" height=696 subtitle="Click-to-open information bubble: alignments, actions, closed, in a settings form" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;margin-bottom:24px}.cell{display:flex;align-items:flex-start;block-size:118px}
.lab{display:inline-flex;align-items:center;gap:8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.panel{border:1px solid var(--border-subtle-01);padding:24px;block-size:300px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-content:start}
.panel h4{grid-column:1/-1;font:400 20px/28px var(--font-sans);margin:0 0 24px}
.flabel{display:flex;align-items:center;gap:4px;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin-bottom:8px}
.val{font:400 14px/20px var(--font-sans);letter-spacing:.16px;background:var(--field-01);border-block-end:1px solid var(--border-strong-01);padding:11px 16px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const P=t=>h('p',null,t);
function TT(p,label,...content){return h('span',{className:'lab'},label,h(C.Toggletip,p,h(C.ToggletipButton,{label:'Show information about '+label.toLowerCase()}),h(C.ToggletipContent,null,...content)))}
function App(){
 return h('div',null,
  Cap('Open (defaultOpen): align bottom-start, bottom (default), bottom-end'),
  h('div',{className:'grid'},
   h('div',{className:'cell'},TT({defaultOpen:true,align:'bottom-start'},'Egress',P('Data sent out of the region. The first 100 GB each month is free.'))),
   h('div',{className:'cell',style:{justifyContent:'center'}},TT({defaultOpen:true},'Latency',P('Round-trip time to the nearest region, averaged over 5 minutes.'))),
   h('div',{className:'cell',style:{justifyContent:'flex-end'}},TT({defaultOpen:true,align:'bottom-end'},'Throughput',P('Requests handled per second across all nodes.')))),
  Cap('align top and right; closed (the resting state: click the icon to open, Escape or a click outside closes)'),
  h('div',{className:'grid'},
   h('div',{className:'cell',style:{alignItems:'flex-end',blockSize:110,justifyContent:'center'}},TT({defaultOpen:true,align:'top'},'Uptime',P('Last 30 days.'))),
   h('div',{className:'cell',style:{alignItems:'center',blockSize:110}},TT({defaultOpen:true,align:'right'},'Zones',P('Spread nodes across 3 zones.'))),
   h('div',{className:'cell',style:{alignItems:'center',blockSize:110,justifyContent:'center'}},TT({},'Snapshots',P('Taken daily at 02:00 UTC.')))),
  Cap('In context: field labels in a cluster settings form; the open one holds a link and a button (ToggletipActions)'),
  h('div',{className:'panel'},
   h('h4',null,'Maintenance'),
   h('div',null,
    h('div',{className:'flabel'},'Upgrade window',h(C.Toggletip,{defaultOpen:true,align:'bottom-start'},h(C.ToggletipButton,{label:'Show information about the upgrade window'}),
     h(C.ToggletipContent,null,P('Control plane and node upgrades start only inside this window. Workloads move between zones during an upgrade.'),
      h(C.ToggletipActions,null,h(C.Link,{href:'#'},'Learn more'),h(C.Button,{size:'sm'},'Edit window'))))),
    h('div',{className:'val'},'Saturday 02:00 to 06:00 UTC')),
   h('div',null,
    h('div',{className:'flabel'},'Backup retention',h(C.Toggletip,{align:'bottom-end'},h(C.ToggletipButton,{label:'Show information about backup retention'}),
     h(C.ToggletipContent,null,P('Backups older than this are deleted. Longer retention adds storage cost.')))),
    h('div',{className:'val'},'30 days'))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
