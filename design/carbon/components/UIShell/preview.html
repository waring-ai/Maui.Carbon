<!-- @dsCard group="Navigation" height=1770 subtitle="Header menu, switcher panel, side nav, rail, skip link" -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
/* a transformed ancestor makes the fixed header and side nav position inside the frame */
.frame{position:relative;transform:translateZ(0);height:336px;margin-bottom:24px;border:1px solid var(--border-subtle-01);overflow:hidden;background:var(--layer-background-01)}
.frame--header{height:152px}.frame--rail{height:240px}.frame--panel{height:304px}.frame--small{height:464px}
.frame .cds--header__nav{display:block}
.frame .cds--side-nav__overlay{display:none}
.frame .cds--content{font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.frame .cds--content h4{margin:0 0 8px;font:400 20px/28px var(--font-sans)}
.frame .cds--content p{margin:0;color:var(--text-secondary)}
/* SkipToContent is visually hidden until focused; this frame pins its :focus look so the state is visible without a keypress */
.frame--skip .cds--skip-to-content{z-index:9999;display:flex;align-items:center;padding:0 1rem;border:4px solid var(--focus);background-color:var(--background);block-size:3rem;clip:auto;color:var(--text-secondary);font-family:var(--font-sans);font-size:.875rem;inline-size:auto;inset-block-start:0;inset-inline-start:0;margin:0;overflow:visible;outline:none}
.frame--small .cds--header__nav{display:none}
.frame:last-child{margin-bottom:0}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Shell(p){
 return h(C.Header,{'aria-label':'Platform'},
  p.skip?h(C.SkipToContent,{href:p.skip}):null,
  h(C.HeaderMenuButton,{'aria-label':p.open?'Close menu':'Open menu',isCollapsible:true,isActive:p.open,onClick:p.onMenu}),
  h(C.HeaderName,{href:'#',prefix:'IBM'},'Platform'),
  h(C.HeaderNavigation,{'aria-label':'Platform'},
   h(C.HeaderMenuItem,{href:'#','aria-current':'page'},'Catalog'),
   h(C.HeaderMenuItem,{href:'#'},'Observability'),
   h(C.HeaderMenuItem,{href:'#'},'Billing')),
  h(C.HeaderGlobalBar,null,
   h(C.HeaderGlobalAction,{'aria-label':'Search'},h(C.Icon,{name:'search',size:20})),
   h(C.HeaderGlobalAction,{'aria-label':'Notifications'},h(C.Icon,{name:'notification',size:20})),
   h(C.HeaderGlobalAction,{'aria-label':'User',isActive:p.userActive},h(C.Icon,{name:'user',size:20}))));
}
function Body(p){return h('main',{className:'cds--content',id:p&&p.id,tabIndex:p&&p.id?-1:undefined},h('h4',null,(p&&p.title)||'Buckets'),h('p',null,(p&&p.text)||'14 buckets in 3 regions. Page content sits beside the shell and shifts with the side nav.'))}
function Expanded(){
 const [open,setOpen]=React.useState(true);
 return h('div',{className:'frame'},
  h(Shell,{open:open,onMenu:()=>setOpen(!open)}),
  h(C.SideNav,{'aria-label':'Side navigation',expanded:open,isFixedNav:false,addFocusListeners:false,onOverlayClick:()=>setOpen(false)},
   h(C.SideNavItems,null,
    h(C.SideNavLink,{href:'#',renderIcon:'dashboard'},'Dashboard'),
    h(C.SideNavMenu,{title:'Infrastructure',renderIcon:'folder',defaultExpanded:true},
     h(C.SideNavMenuItem,{href:'#'},'Clusters'),
     h(C.SideNavMenuItem,{href:'#',isActive:true},'Buckets'),
     h(C.SideNavMenuItem,{href:'#'},'Networks')),
    h(C.SideNavMenu,{title:'Manage',renderIcon:'settings'},
     h(C.SideNavMenuItem,{href:'#'},'Users'),
     h(C.SideNavMenuItem,{href:'#'},'API keys')),
    h(C.SideNavDivider),
    h(C.SideNavLink,{href:'#',renderIcon:'report'},'Billing and usage'))),
  h(Body));
}
function Rail(){
 return h('div',{className:'frame frame--rail'},
  h(Shell,{open:false,userActive:false}),
  h(C.SideNav,{'aria-label':'Side navigation',isRail:true},
   h(C.SideNavItems,null,
    h(C.SideNavLink,{href:'#',renderIcon:'dashboard',isActive:true},'Dashboard'),
    h(C.SideNavLink,{href:'#',renderIcon:'folder'},'Clusters'),
    h(C.SideNavLink,{href:'#',renderIcon:'analytics'},'Monitoring'),
    h(C.SideNavLink,{href:'#',renderIcon:'report'},'Billing and usage'))),
  h(Body,{title:'Dashboard',text:'6 clusters healthy, 1 warning. The rail leaves 48px for icons; hover or focus it to read the labels.'}));
}
function MenuShell(){
 const [panel,setPanel]=React.useState(true);
 return h('div',{className:'frame frame--panel'},
  h(C.Header,{'aria-label':'Platform'},
   h(C.HeaderName,{href:'#',prefix:'IBM'},'Platform'),
   h(C.HeaderNavigation,{'aria-label':'Platform'},
    h(C.HeaderMenuItem,{href:'#'},'Catalog'),
    h(C.HeaderMenu,{'aria-label':'Manage',menuLinkName:'Manage',defaultExpanded:true},
     h(C.HeaderMenuItem,{href:'#'},'Users'),
     h(C.HeaderMenuItem,{href:'#',isActive:true},'Access groups'),
     h(C.HeaderMenuItem,{href:'#'},'Audit log')),
    h(C.HeaderMenu,{'aria-label':'Support',menuLinkName:'Support'},
     h(C.HeaderMenuItem,{href:'#'},'Cases'),
     h(C.HeaderMenuItem,{href:'#'},'Status'))),
   h(C.HeaderGlobalBar,null,
    h(C.HeaderGlobalAction,{'aria-label':'Search'},h(C.Icon,{name:'search',size:20})),
    h(C.HeaderGlobalAction,{'aria-label':'Notifications'},h(C.Icon,{name:'notification',size:20})),
    h(C.HeaderGlobalAction,{'aria-label':panel?'Close switcher':'Open switcher','aria-expanded':panel,isActive:panel,id:'uis-switcher-btn',onClick:()=>setPanel(!panel)},h(C.Icon,{name:'switcher',size:20}))),
   h(C.HeaderPanel,{expanded:panel,onHeaderPanelFocus:()=>setPanel(false),href:'#uis-switcher-btn'},
    h(C.Switcher,{'aria-label':'Switcher',expanded:panel},
     h(C.SwitcherItem,{href:'#','aria-label':'Platform',isSelected:true},'Platform'),
     h(C.SwitcherDivider),
     h(C.SwitcherItem,{href:'#','aria-label':'Analytics'},'Analytics'),
     h(C.SwitcherItem,{href:'#','aria-label':'Storage'},'Storage'),
     h(C.SwitcherItem,{href:'#','aria-label':'Security'},'Security'),
     h(C.SwitcherDivider),
     h(C.SwitcherItem,{href:'#','aria-label':'All products'},'All products')))));
}
function Small(){
 const [open,setOpen]=React.useState(true);
 return h('div',{className:'frame frame--small'},
  h(Shell,{open:open,onMenu:()=>setOpen(!open)}),
  h(C.SideNav,{'aria-label':'Side navigation',expanded:open,isFixedNav:false,addFocusListeners:false,onOverlayClick:()=>setOpen(false)},
   h(C.SideNavHeader,{renderIcon:'catalog'},'Platform'),
   h(C.SideNavItems,null,
    h(C.HeaderSideNavItems,{hasDivider:true},
     h(C.HeaderMenuItem,{href:'#',isActive:true},'Catalog'),
     h(C.HeaderMenuItem,{href:'#'},'Observability'),
     h(C.HeaderMenu,{'aria-label':'Manage',menuLinkName:'Manage',defaultExpanded:true},
      h(C.HeaderMenuItem,{href:'#'},'Users'),
      h(C.HeaderMenuItem,{href:'#'},'Access groups'))),
    h(C.SideNavLink,{href:'#',renderIcon:'dashboard'},'Dashboard'),
    h(C.SideNavLink,{href:'#',renderIcon:'report'},'Billing and usage')),
   h(C.SideNavFooter,{expanded:open,onToggle:()=>setOpen(!open)})),
  h(Body));
}
function App(){
 return h('div',null,
  Cap('HeaderMenu open with the current item, HeaderPanel with a Switcher (switcher action active)'),
  h(MenuShell),
  Cap('Header with expanded side nav, nested menu open (selected link and parent state)'),
  h(Expanded),
  Cap('Rail: collapsed to 48px, expands on hover or focus'),
  h(Rail),
  Cap('Below 1056px: header links move into the side nav (HeaderSideNavItems), with SideNavHeader and SideNavFooter'),
  h(Small),
  Cap('SkipToContent in its focused state (first Tab stop, over the header; Enter moves to main); user action active'),
  h('div',{className:'frame frame--header frame--skip'},h(Shell,{open:false,userActive:true,skip:'#uis-main'}),h(Body,{id:'uis-main'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
