<!-- @dsCard group="Layout" height=676 subtitle="Section nesting picks h1-h6, level override, type classes; a reusable card at two depths" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:start} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
 .doc :is(h1,h2,h3,h4,h5,h6){margin:0;display:flex;align-items:baseline;gap:12px;color:var(--text-primary)}
 .doc section{margin-block-start:12px;padding-inline-start:16px;border-inline-start:1px solid var(--border-subtle-01)}
 .tag{flex:none;font:400 12px/16px var(--font-mono);letter-spacing:.32px;color:var(--text-helper)}
 .doc p{margin:4px 0 0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
 .doc h1{font-size:2rem;font-weight:400;line-height:1.25} .doc h2{font-size:1.75rem;font-weight:400;line-height:1.28572} .doc h3{font-size:1.25rem;font-weight:400;line-height:1.4}
 .doc h4{font-size:1rem;font-weight:600;line-height:1.5} .doc h5{font-size:.875rem;font-weight:600;line-height:1.42857;letter-spacing:.16px} .doc h6{font-size:.875rem;font-weight:600;line-height:1.28572;letter-spacing:.16px} .ctx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
 .pane{background:var(--layer-01);padding:16px}
 .pane :is(h1,h2,h3,h4){margin:0 0 4px;color:var(--text-primary)}
 .pane .tag{margin-inline-start:8px}
 .pane p{margin:0 0 12px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
 .card{background:var(--background);padding:12px 16px;margin-top:8px}
 .card p{margin:0}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
// A Heading that also prints the element it rendered as.
function H(props){
 const ref=React.useRef(null),[tag,setTag]=React.useState('');
 React.useLayoutEffect(()=>{setTag(ref.current.tagName.toLowerCase())});
 return h(C.Heading,{ref,className:props.className},props.children,h('span',{className:'tag'},tag+(props.note?' · '+props.note:'')));
}

// A reusable card: its title level comes from wherever it is placed.
function NodePoolCard(props){
 return h(C.Section,{as:'div',className:'card'},h(H,{className:'cds--type-heading-compact-01'},props.name),h('p',null,props.desc));
}
function App(){
 return h('div',{className:'grid'},
  h('div',{className:'doc'},Cap('Nested Sections: each one adds a level'),
   h(H,{note:'heading-05'},'Account settings'),
   h(C.Section,null,
    h(H,{note:'heading-04'},'Profile'),
    h('p',null,'Name, photo and contact details.'),
    h(C.Section,null,
     h(H,{note:'heading-03'},'Contact details'),
     h(C.Section,null,
      h(H,{note:'heading-02'},'Email addresses'),
      h(C.Section,null,
       h(H,{note:'heading-01'},'Primary address'),
       h(C.Section,null,
        h(H,{note:'heading-compact-01'},'Verification'),
        h(C.Section,null,h(H,{note:'capped at 6'},'Deeper sections stay h6')))))))),
  h('div',null,h('div',{className:'doc'},Cap('level override and as'),
   h(C.Section,{level:3,as:'div'},
    h(H,null,'Section level=3'),
    h('p',null,'Rendered as a div; Headings inside are h3.'),
    h(C.Section,null,h(H,null,'Child of level 3'))),
   ),h('div',{style:{height:24}}),
   Cap('Unstyled by default: add a cds--type-* class'),
   h(C.Section,{level:2,as:'div'},
    h(C.Heading,{className:'cds--type-heading-compact-02',style:{margin:0}},'h2 styled heading-compact-02'),
    h(C.Heading,{className:'cds--type-heading-04',style:{margin:'8px 0 0'}},'h2 styled heading-04'))));
}
function Context(){
 return h('div',{style:{marginTop:24}},Cap('In context: the same NodePoolCard component gets h3 on the cluster page and h2 in a dashboard widget, with no level prop'),
  h('div',{className:'ctx'},
   h('div',{className:'pane'},
    h(H,{className:'cds--type-heading-04'},'prod-eu-1'),h('p',null,'Cluster page'),
    h(C.Section,{as:'div'},h(H,{className:'cds--type-heading-02'},'Worker pools'),
     h(NodePoolCard,{name:'default',desc:'3 nodes per zone, bx2.4x16'}),
     h(NodePoolCard,{name:'gpu-a100',desc:'1 node per zone, gx3.16x80'}))),
   h('div',{className:'pane'},
    h('p',null,'Dashboard widget, directly on the page (no enclosing Section)'),
    h(NodePoolCard,{name:'default',desc:'Scaling up: 9 of 12 nodes ready'}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,h(App),h(Context)));
</script>
