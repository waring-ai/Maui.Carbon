<!-- @dsCard group="Actions" height=631 subtitle="Kinds, sizes, disabled, menu alignment, page header" -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.row{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:24px;align-items:flex-end}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.open{display:flex;gap:24px;align-items:flex-start;height:272px;margin-bottom:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;background:var(--layer-01);border-bottom:1px solid var(--border-subtle-01)}
.head h2{margin:0;font:400 20px/28px var(--font-sans);color:var(--text-primary)}
.head p{margin:2px 0 0;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
.head__actions{display:flex;gap:16px;align-items:center}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const I=(label,p)=>h(C.MenuItem,Object.assign({key:label,label:label},p));
const MENUS={
 Actions:()=>[I('Restart cluster'),I('Scale worker pool'),I('Update Kubernetes version'),h(C.MenuItemDivider,{key:'d'}),I('Delete cluster',{kind:'danger'})],
 Export:()=>[I('Export as CSV'),I('Export as JSON'),I('Export audit log as PDF',{shortcut:'Ctrl+E'})],
 Sort:()=>[I('Name'),I('Created'),I('Status')]
};
function MB(label,p){return h(C.MenuButton,Object.assign({key:label+(p&&p.size||'')+(p&&p.kind||''),label:label},p),MENUS[label]())}
function App(){
 return h('div',null,
  Cap('Kinds (lg, default): primary, tertiary, ghost; disabled'),
  h('div',{className:'row'},MB('Actions',{kind:'primary'}),MB('Export',{kind:'tertiary'}),MB('Sort',{kind:'ghost'}),
   h(C.MenuButton,{label:'Actions',disabled:true},MENUS.Actions()),h(C.MenuButton,{label:'Sort',kind:'ghost',disabled:true},MENUS.Sort())),
  Cap('Sizes: xs 24px, sm 32px, md 40px, lg 48px (menu items match the button height)'),
  h('div',{className:'row'},['xs','sm','md','lg'].map(s=>MB('Actions',{size:s}))),
  h('div',{className:'open'},
   h('div',{style:{width:192}},Cap('Open, bottom (default): menu at least as wide as the button'),MB('Actions',{size:'md',defaultOpen:true})),
   h('div',{style:{width:240}},Cap('Open, tertiary, bottom-start: menu grows to fit'),MB('Export',{kind:'tertiary',size:'md',menuAlignment:'bottom-start',defaultOpen:true})),
   h('div',{style:{width:200,display:'flex',flexDirection:'column',alignItems:'flex-end'}},Cap('Open, ghost sm, bottom-end'),MB('Sort',{kind:'ghost',size:'sm',menuAlignment:'bottom-end',defaultOpen:true}))),
  Cap('In context: cluster page header, actions that affect the whole cluster'),
  h('div',{className:'head'},
   h('div',null,h('h2',null,'prod-us-south'),h('p',null,'Kubernetes 1.31 · 12 worker nodes · Dallas')),
   h('div',{className:'head__actions'},
    MB('Export',{kind:'ghost',size:'md'}),
    MB('Actions',{kind:'tertiary',size:'md'}),
    h(C.Button,{kind:'primary',size:'md',renderIcon:'add'},'Add worker pool'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
