<!-- @dsCard group="Status" height=452 subtitle="Default 100px block, custom sizes, dashboard loading" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} .tile{background:var(--layer-01);border:1px solid var(--border-subtle-01);padding:16px} .tile h4{margin:0 0 16px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)} .chart{width:100%;height:120px;margin-bottom:12px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
function Tile(title){return h('div',{className:'tile','aria-busy':'true'},h('h4',null,title),h(C.SkeletonPlaceholder,{className:'chart'}),h(C.SkeletonText,{width:'60%'}))}
function App(){
 return h('div',{className:'stack'},
  h('div',{className:'row'},
   B('Default: 100 x 100',h(C.SkeletonPlaceholder)),
   B('style: 240 x 100 (chart)',h(C.SkeletonPlaceholder,{style:{width:240,height:100}})),
   B('32 x 32 (avatar)',h(C.SkeletonPlaceholder,{style:{width:32,height:32}})),
   B('320 x 48 (toolbar)',h(C.SkeletonPlaceholder,{style:{width:320,height:48}}))),
  B('In context: usage dashboard tiles while metrics load (titles are not data, so they show right away)',h('div',{className:'dash'},Tile('CPU usage, last 24 h'),Tile('Egress, this month'),Tile('Storage by bucket'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
