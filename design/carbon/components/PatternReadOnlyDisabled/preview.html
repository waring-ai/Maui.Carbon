<!-- @dsCard group="Patterns" width=1280 height=1723 subtitle="Enabled, read-only and disabled side by side for the main inputs; a viewer's read-only page with a disabled action" page -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.matrix{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));column-gap:24px}
.matrix > .colh{font:600 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary);padding:0 0 12px;border-bottom:1px solid var(--border-subtle-01)}
.matrix > .colh small{display:block;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin-top:4px}
.matrix > .rowh{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);padding-top:20px}
.matrix > .cell{padding:16px 0;min-width:0}
.matrix > .rowh,.matrix > .cell{border-bottom:1px solid var(--border-subtle-01)}
/* workaround: the base TextInput sets the native readonly attribute but not cds--text-input-wrapper--readonly, so Carbon's read-only look is applied here */
.cds--text-input[readonly]{background:transparent;border-block-end-color:var(--border-subtle-01)}
/* workaround: the base Toggle has no readOnly prop; this is Carbon's read-only look (outlined track, text-primary knob) on a toggle whose onToggle ignores changes */
.ro-toggle .cds--toggle__switch{background-color:transparent;box-shadow:inset 0 0 0 1px var(--icon-disabled)}
.ro-toggle .cds--toggle__switch::before{background-color:var(--text-primary)}
.ro-toggle .cds--toggle__check{fill:var(--background)}
.ro-toggle .cds--toggle__label{cursor:default}
.sep{height:48px}
/* context: a cluster details page as a person with the Viewer role sees it */
.ctx{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:32px;align-items:start}
.ctx h2{margin:0 0 16px;color:var(--text-primary)}
.ctx .cds--inline-notification{max-width:none;margin:0 0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.side{background:var(--layer-01);padding:16px}
.side h3{margin:0 0 8px;color:var(--text-primary)}
.side p{margin:0 0 16px;color:var(--text-secondary)}
.side .cds--inline-notification{margin:16px 0 0}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const noop=()=>{};
const regions=['Dallas (us-south)','Frankfurt (eu-de)','London (eu-gb)','Tokyo (jp-tok)'];
// one row per component: (state, id suffix) => element
const rows=[
 ['TextInput',(s,k)=>h(C.TextInput,{id:'rd-ti-'+k,labelText:'Cluster name',defaultValue:'prod-eu-01',helperText:'Lowercase letters, numbers and hyphens.',...s})],
 ['TextArea',(s,k)=>h(C.TextArea,{id:'rd-ta-'+k,labelText:'Description',rows:2,defaultValue:'Production workloads for the EU storefront.',...s})],
 ['NumberInput',(s,k)=>h(C.NumberInput,{id:'rd-ni-'+k,label:'Worker nodes',min:1,max:50,defaultValue:12,...s})],
 ['Select',(s,k)=>h(C.Select,{id:'rd-se-'+k,labelText:'Region',defaultValue:'eu-de',...s},h(C.SelectItem,{value:'us-south',text:regions[0]}),h(C.SelectItem,{value:'eu-de',text:regions[1]}),h(C.SelectItem,{value:'eu-gb',text:regions[2]}))],
 ['Dropdown',(s,k)=>h(C.Dropdown,{id:'rd-dd-'+k,titleText:'Kubernetes version',label:'Choose a version',items:['1.31.2','1.30.6','1.29.10'],initialSelectedItem:'1.31.2',...s})],
 ['ComboBox',(s,k)=>h(C.ComboBox,{id:'rd-cb-'+k,titleText:'Owner',placeholder:'Search people',items:['Ana Silva','Raj Patel','Mei Chen'],initialSelectedItem:'Ana Silva',...s})],
 ['DatePicker',(s,k)=>h(C.DatePicker,{datePickerType:'single',id:'rd-dp-'+k,labelText:'Maintenance date',defaultValue:'2026-12-06',...s})],
 ['Slider',(s,k)=>h(C.Slider,{id:'rd-sl-'+k,labelText:'Log retention (days)',min:1,max:365,defaultValue:90,...s})],
 ['CheckboxGroup',(s,k)=>h(C.CheckboxGroup,{legendText:'Send alerts by',...s},h(C.Checkbox,{id:'rd-cg1-'+k,labelText:'Email',defaultChecked:true}),h(C.Checkbox,{id:'rd-cg2-'+k,labelText:'Webhook'}))],
 ['RadioButtonGroup',(s,k)=>h(C.RadioButtonGroup,{name:'rd-rb-'+k,legendText:'Plan',orientation:'vertical',defaultSelected:'standard',...s},h(C.RadioButton,{id:'rd-rb1-'+k,value:'standard',labelText:'Standard'}),h(C.RadioButton,{id:'rd-rb2-'+k,value:'dedicated',labelText:'Dedicated'}))],
 ['Toggle',(s,k)=>k==='ro'?h(C.Toggle,{id:'rd-tg-'+k,labelText:'Autoscaling',toggled:true,onToggle:noop,className:'ro-toggle'}):h(C.Toggle,{id:'rd-tg-'+k,labelText:'Autoscaling',defaultToggled:true,...s})]
];
function Matrix(){
 const cols=[['Enabled','Can be changed',{} ,'en'],['Read-only','Shown and focusable, not editable',{readOnly:true},'ro'],['Disabled','Not available right now; skipped by Tab',{disabled:true},'di']];
 return h('div',{className:'matrix'},
  h('div',{className:'colh'}),cols.map(c=>h('div',{key:c[0],className:'colh'},c[0],h('small',null,c[1]))),
  rows.map(r=>[h('div',{key:r[0],className:'rowh'},r[0])].concat(cols.map(c=>h('div',{key:r[0]+c[3],className:'cell'},r[1](c[2],c[3]))))));
}
function Context(){
 return h('div',{className:'ctx'},
  h('div',null,
   h('h2',{className:'cds--type-heading-03'},'Cluster details'),
   h(C.InlineNotification,{kind:'info',lowContrast:true,hideCloseButton:true,title:'You have Viewer access to prod-eu-01.',subtitle:'You can read and copy these settings. To change them, ask an account administrator for the Editor role.'}),
   h('div',{className:'two'},
    h(C.TextInput,{id:'rc-name',labelText:'Cluster name',defaultValue:'prod-eu-01',readOnly:true}),
    h(C.Select,{id:'rc-region',labelText:'Region',defaultValue:'eu-de',readOnly:true},h(C.SelectItem,{value:'eu-de',text:regions[1]})),
    h(C.NumberInput,{id:'rc-nodes',label:'Worker nodes',defaultValue:12,readOnly:true}),
    h(C.Dropdown,{id:'rc-ver',titleText:'Kubernetes version',label:'Choose a version',items:['1.31.2'],initialSelectedItem:'1.31.2',readOnly:true}),
    h(C.TextInput,{id:'rc-crn',labelText:'Cluster ID',defaultValue:'c7k2m9d40f8e1a3b6c55',readOnly:true}),
    h(C.Toggle,{id:'rc-auto',labelText:'Autoscaling',toggled:true,onToggle:noop,className:'ro-toggle'}))),
  h('aside',{className:'side','aria-labelledby':'rc-up'},
   h('h3',{id:'rc-up',className:'cds--type-heading-compact-02'},'Update Kubernetes'),
   h('p',{className:'cds--type-body-compact-01'},'Version 1.32.0 is available for this cluster.'),
   h(C.Button,{kind:'primary',size:'md',disabled:true},'Update to 1.32.0'),
   h(C.InlineNotification,{kind:'warning',lowContrast:true,hideCloseButton:true,title:'Update is paused.',subtitle:'A worker pool is still resizing. You can update when it finishes, in about 10 minutes.'})));
}
function App(){
 return h('div',null,
  Cap('The same field in each state. Read-only keeps the value at full contrast and drops the fill; disabled dims everything and leaves the tab order.'),
  h(Matrix),
  h('div',{className:'sep'}),
  Cap('In context: a Viewer sees the settings read-only (the reason is stated once, at the top); an action blocked by a temporary condition is disabled, with a notification saying when it comes back. Delete is hidden, because Viewers can never use it.'),
  h(Context));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
