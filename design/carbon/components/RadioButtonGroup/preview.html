<!-- @dsCard group="Forms" height=859 subtitle="Horizontal and vertical, label on the left, helper, invalid (none selected), warning, read-only, disabled group and option, skeleton; cluster update settings" -->
<style>body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.sec{margin-bottom:32px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 24px}
.sk{display:flex;flex-direction:column;gap:12px}
.ctx{padding:24px;max-width:592px}
.ttl{font:600 16px/24px var(--font-sans);color:var(--text-primary);margin:0 0 4px}
.sub{font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);margin:0 0 24px}
.actions{display:flex;justify-content:flex-end;margin-top:32px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el){return h('div',null,Cap(t),el)}
const R=(g,v,t,x)=>h(C.RadioButton,Object.assign({key:v,value:v,id:'rb-'+g+'-'+v,labelText:t},x));
function App(){
 const [mode,setMode]=React.useState('never');
 return h('div',null,
  Cap('States'),
  h('div',{className:'g3 sec'},
   Cell('Horizontal (default), helper text',h(C.RadioButtonGroup,{legendText:'Billing cycle',name:'rb-h',defaultSelected:'month',helperText:'Yearly and 3-year terms are billed up front'},[R('h','month','Monthly'),R('h','year','Yearly'),R('h','3y','3 years')])),
   Cell('Vertical',h(C.RadioButtonGroup,{legendText:'Cluster type',name:'rb-v',orientation:'vertical',defaultSelected:'multi'},[R('v','single','Single zone'),R('v','multi','Multizone'),R('v','sat','Satellite location')])),
   Cell('Label on the left',h(C.RadioButtonGroup,{legendText:'Log level',name:'rb-l',labelPosition:'left',orientation:'vertical',defaultSelected:'warn'},[R('l','error','Error'),R('l','warn','Warning'),R('l','debug','Debug')])),
   Cell('Invalid (nothing selected)',h(C.RadioButtonGroup,{legendText:'Backup frequency',name:'rb-inv',invalid:true,invalidText:'Choose how often to back up this database'},[R('inv','d','Daily'),R('inv','w','Weekly'),R('inv','m','Monthly')])),
   Cell('Warning',h(C.RadioButtonGroup,{legendText:'Public access',name:'rb-warn',defaultSelected:'on',warn:true,warnText:'Anyone with the URL can read objects in this bucket'},[R('warn','off','Off'),R('warn','on','On')])),
   Cell('Read only',h(C.RadioButtonGroup,{legendText:'Data residency',name:'rb-ro',readOnly:true,defaultSelected:'eu'},[R('ro','eu','EU only'),R('ro','any','Any region')])),
   Cell('Disabled group',h(C.RadioButtonGroup,{legendText:'Support plan',name:'rb-dis',disabled:true,defaultSelected:'basic',helperText:'Contact sales to change your plan'},[R('dis','basic','Basic'),R('dis','adv','Advanced')])),
   Cell('One option disabled',h(C.RadioButtonGroup,{legendText:'Worker flavor',name:'rb-opt',orientation:'vertical',defaultSelected:'4x16'},[R('opt','4x16','4 vCPU, 16 GB'),R('opt','8x32','8 vCPU, 32 GB'),R('opt','gpu','8 vCPU, 64 GB, 1 GPU (sold out)',{disabled:true})])),
   Cell('Skeleton',h('div',{className:'sk'},h(C.RadioButtonSkeleton),h(C.RadioButtonSkeleton),h(C.RadioButtonSkeleton)))),
  Cap('In context: cluster settings panel'),
  h(C.Layer,{withBackground:true,className:'ctx'},
   h('p',{className:'ttl'},'Kubernetes updates'),
   h('p',{className:'sub'},'Applies to checkout-prod and its 3 worker pools.'),
   h(C.RadioButtonGroup,{legendText:'Patch updates',name:'rb-ctx',orientation:'vertical',valueSelected:mode,onChange:v=>setMode(v),
     helperText:'Patch updates restart one worker node at a time',
     warn:mode==='never',warnText:'Clusters more than two patch versions behind are no longer supported'},
    [R('ctx','auto','Apply automatically during the maintenance window'),R('ctx','notify','Email me and wait for approval'),R('ctx','never','Never update automatically')]),
   h('div',{className:'actions'},h(C.Button,{kind:'primary'},'Save settings'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
