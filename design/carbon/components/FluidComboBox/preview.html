<!-- @dsCard group="Forms" height=1103 subtitle="Typeahead with the label inside a 64px field: open, filtered, condensed, selected, invalid, warning, disabled, read-only, skeleton" -->
<style>body{margin:0;padding:24px;background:var(--background)} .grid{display:grid;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-bottom:24px} .tall{min-height:320px} .grid .cds--list-box__wrapper.cds--list-box__wrapper--fluid{block-size:auto} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.panel{max-inline-size:560px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p,.sum{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)} .sum{padding:12px 16px 16px}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);column-gap:1px;background:var(--border-strong-01)} .pf{display:flex} .pf > .cds--btn{flex:1 1 0;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el,tall){return h('div',{className:tall?'tall':null},Cap(t),el)}
const images=['golang:1.23-alpine','nginx:1.27','node:22-alpine','postgres:16','python:3.12-slim','python:3.13-slim','redis:7.4',{text:'centos:7 (end of life)',disabled:true}];
const base={titleText:'Container image',placeholder:'Type to filter images',items:images,onChange:function(){}};
function CB(p){return h(C.FluidComboBox,Object.assign({},base,p))}

function DeployPanel(){
 const [img,setImg]=React.useState('node:22-alpine');
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Deploy a container'),h('p',null,'Pick a public image or type the full path of one in your registry.')),
  h(C.FluidForm,{'aria-label':'Deploy a container',onSubmit:function(e){e.preventDefault()}},
   h('div',{className:'row'},
    h(C.FluidComboBox,Object.assign({},base,{id:'dc-img',allowCustomValue:true,selectedItem:img,onChange:function(d){setImg(d.selectedItem)}})),
    h(C.FluidNumberInput,{id:'dc-port',label:'Port',defaultValue:8080,min:1,max:65535,hideSteppers:true}))),
  h('p',{className:'sum'},img?'Pulls '+img+' on every node in payments-cluster':'Choose an image to deploy'),
  h('div',{className:'pf'},h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),h(C.Button,{kind:'primary',size:'xl',disabled:!img},'Deploy')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Open: full list (64px rows)',CB({id:'fc-open',defaultOpen:true}),true),
   Cell('Open, filtered by typed text',CB({id:'fc-filter',initialInputValue:'py',defaultOpen:true}),true),
   Cell('Open, selected, isCondensed (40px rows)',CB({id:'fc-sel',isCondensed:true,initialSelectedItem:images[1],defaultOpen:true}),true)),
  h('div',{className:'grid'},
   Cell('Default (placeholder)',CB({id:'fc-def'})),
   Cell('Selected (clear button)',CB({id:'fc-val',initialSelectedItem:images[3]})),
   Cell('Invalid',CB({id:'fc-inv',initialInputValue:'ngnix',invalid:true,invalidText:'No image named ngnix. Choose one from the list'})),
   Cell('Warning',CB({id:'fc-warn',initialSelectedItem:images[4],warn:true,warnText:'A newer patch release is available: python:3.13-slim'})),
   Cell('Disabled',CB({id:'fc-dis',initialSelectedItem:images[2],disabled:true})),
   Cell('Read only',CB({id:'fc-ro',initialSelectedItem:images[2],readOnly:true})),
   Cell('Skeleton (FluidComboBoxSkeleton)',h(C.FluidComboBoxSkeleton))),
  Cap('In context: image picker that also accepts a custom value (allowCustomValue)'),
  h(DeployPanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
