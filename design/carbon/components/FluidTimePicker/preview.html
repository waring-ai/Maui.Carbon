<!-- @dsCard group="Forms" height=823 subtitle="Time input + FluidTimePickerSelect parts: three and two parts, invalid, warning, read-only, disabled, skeleton" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:24px}
.panel{max-inline-size:440px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p,.sum{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)} .sum{padding:12px 16px 16px}
.pf{display:flex} .pf > .cds--btn{flex:1 1 0;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el){return h('div',null,Cap(t),el)}
function Ampm(p){return h(C.FluidTimePickerSelect,Object.assign({labelText:'AM/PM',defaultValue:'am'},p),h(C.SelectItem,{value:'am',text:'AM'}),h(C.SelectItem,{value:'pm',text:'PM'}))}
function Tz(p){return h(C.FluidTimePickerSelect,Object.assign({labelText:'Time zone',defaultValue:'ct'},p),h(C.SelectItem,{value:'et',text:'Eastern Time (ET)'}),h(C.SelectItem,{value:'ct',text:'Central Time (CT)'}),h(C.SelectItem,{value:'pt',text:'Pacific Time (PT)'}),h(C.SelectItem,{value:'utc',text:'Coordinated Universal Time (UTC)'}))}
function TP(p,two){return h(C.FluidTimePicker,Object.assign({labelText:'Start time',placeholder:'hh:mm'},p),h(Ampm,{key:'a'}),two?h(Tz,{key:'t'}):null)}

function BackupPanel(){
 const [t,setT]=React.useState('2:30');
 const [ap,setAp]=React.useState('am');
 const ok=/^(0?[1-9]|1[0-2]):[0-5][0-9]$/.test(t.trim());
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Schedule nightly backup'),h('p',null,'Snapshots every volume in payments-db. Backups take about 20 minutes.')),
  h(C.FluidForm,{'aria-label':'Schedule nightly backup',onSubmit:function(e){e.preventDefault()}},
   h(C.FluidTimePicker,{id:'bk-time',labelText:'Start time',placeholder:'hh:mm',value:t,onChange:function(e){setT(e.target.value)},invalid:!ok,invalidText:'Enter a time from 1:00 to 12:59, for example 2:30'},
    h(C.FluidTimePickerSelect,{id:'bk-ap',labelText:'AM/PM',value:ap,onChange:function(e){setAp(e.target.value)}},h(C.SelectItem,{value:'am',text:'AM'}),h(C.SelectItem,{value:'pm',text:'PM'})),
    h(Tz,{id:'bk-tz'}))),
  h('p',{className:'sum'},ok?'Next backup: tonight at '+t.trim()+' '+ap.toUpperCase()+' Central Time':'Next backup: not scheduled'),
  h('div',{className:'pf'},h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),h(C.Button,{kind:'primary',size:'xl',disabled:!ok},'Save schedule')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Time + AM/PM + time zone (25% / 25% / 50%)',TP({defaultValue:'09:30'},true)),
   Cell('Time + AM/PM (two parts split 50/50)',TP({defaultValue:'09:30'},false)),
   Cell('Invalid (whole picker)',TP({defaultValue:'25:00',invalid:true,invalidText:'Enter a time in hh:mm format, for example 09:30'},true)),
   Cell('Warning',TP({defaultValue:'03:00',warn:true,warnText:'Outside business hours: no one is on call to approve'},true)),
   Cell('Read only',TP({defaultValue:'09:30',readOnly:true},true)),
   Cell('Disabled',TP({defaultValue:'09:30',disabled:true},true)),
   Cell('Skeleton (FluidTimePickerSkeleton)',h(C.FluidTimePickerSkeleton)),
   Cell('Skeleton, two parts (isOnlyTwo)',h(C.FluidTimePickerSkeleton,{isOnlyTwo:true}))),
  Cap('In context: a backup schedule, validated as you type'),
  h(BackupPanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
