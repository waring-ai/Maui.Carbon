<!-- @dsCard group="Forms" height=944 subtitle="Helper, invalid, warning, disabled, read-only, counter, hidden label; four sizes; inline; on a layer" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px;margin-bottom:32px} .sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:32px} .two{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:32px} .panel{padding:16px} .form{background:var(--layer-01);padding:24px;max-width:560px;display:flex;flex-direction:column;gap:24px} .form h4{margin:0;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:24px} .acts{display:flex;justify-content:flex-end;gap:1px;margin:0 -24px -24px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node){return h('div',null,Cap(cap),node)}

function KeyForm(){
 const [name,setName]=useState('ci deploy');
 const bad=/[^a-z0-9-]/.test(name)||!name;
 return h('div',{className:'form'},h(C.Layer,{className:'stack'},
  h('h4',null,'Create API key'),
  h(C.TextInput,{id:'tk-name',labelText:'Key name',value:name,onChange:e=>setName(e.target.value),invalid:bad,invalidText:'Use lowercase letters, numbers and dashes, for example ci-deploy.',helperText:'Shown in audit logs next to every call made with this key.'}),
  h(C.TextInput,{id:'tk-desc',labelText:'Description (optional)',placeholder:'What uses this key?',enableCounter:true,maxCount:80}),
  h(C.TextInput,{id:'tk-acct',labelText:'Account',defaultValue:'northwind-prod (a81f3c)',readOnly:true}),
  h('div',{className:'acts'},h(C.Button,{kind:'secondary'},'Cancel'),h(C.Button,{disabled:bad},'Create key'))));
}
function App(){
 return h('div',null,
  h('div',{className:'grid'},
   B('Default with helper text',h(C.TextInput,{id:'t1',labelText:'Cluster name',placeholder:'e.g. prod-eu-de-1',helperText:'Lowercase letters, numbers and dashes.'})),
   B('invalid + invalidText',h(C.TextInput,{id:'t2',labelText:'Cluster name',defaultValue:'Prod EU',invalid:true,invalidText:'Remove the space and use lowercase letters.'})),
   B('warn + warnText',h(C.TextInput,{id:'t3',labelText:'Bucket name',defaultValue:'logs',warn:true,warnText:'A bucket named logs exists in another region. Names must be unique per region.'})),
   B('disabled',h(C.TextInput,{id:'t4',labelText:'Region',defaultValue:'eu-de',disabled:true,helperText:'Set when the cluster was created.'})),
   B('readOnly: focusable, not editable',h(C.TextInput,{id:'t5',labelText:'Cluster ID',defaultValue:'c7f2a91e-4b0d',readOnly:true})),
   B('enableCounter + maxCount',h(C.TextInput,{id:'t6',labelText:'Description',defaultValue:'Nightly batch jobs',enableCounter:true,maxCount:60,helperText:'Up to 60 characters.'}))),
  Cap('Sizes: xs 24, sm 32, md 40 (default), lg 48'),
  h('div',{className:'sizes'},['xs','sm','md','lg'].map(s=>h(C.TextInput,{key:s,id:'ts-'+s,size:s,labelText:'Node count ('+s+')',defaultValue:'3'}))),
  h('div',{className:'two'},
   h('div',null,
    B('inline: label and helper to the start of the field',h(C.TextInput,{id:'ti1',inline:true,labelText:'Max nodes',helperText:'Per zone',defaultValue:'12'})),
    h('div',{style:{height:16}}),
    h(C.TextInput,{id:'ti2',inline:true,size:'sm',labelText:'Min nodes',defaultValue:'0',invalid:true,invalidText:'Use at least 1 node.'}),
    h('div',{style:{height:24}}),
    B('hideLabel: label kept for screen readers only',h(C.TextInput,{id:'th',labelText:'Filter buckets by name',hideLabel:true,placeholder:'Filter buckets by name',size:'sm'}))),
   B('In context: a form on layer-01 (fields inside Layer use field-02)',h(KeyForm))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
