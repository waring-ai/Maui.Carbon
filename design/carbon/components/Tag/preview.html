<!-- @dsCard group="Status" height=560 subtitle="Twelve types, three sizes, icon, filter, operational, disabled, truncation" -->
<style>body{margin:0;padding:24px;background:var(--background)} .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .item{display:flex;flex-direction:column;align-items:flex-start;gap:2px} .item small{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-helper)} .types{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 16px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 32px}
.res{background:var(--layer-01);max-width:640px} .res-row{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:48px;border-bottom:1px solid var(--border-subtle-01);font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)} .res-row:last-child{border-bottom:0} .res-row b{font-weight:600;min-width:150px} .res-row .tags{display:flex;flex-wrap:wrap;align-items:center}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function It(tag,node){return h('div',{className:'item'},node,h('small',null,tag))}

function Filters(){
 const [f,setF]=useState(['Region: eu-de','Status: running','Owner: platform-team']);
 return h('div',{className:'row'},f.length?f.map(x=>h(C.Tag,{key:x,type:'gray',filter:true,title:'Remove filter '+x,onClose:()=>setF(f.filter(y=>y!==x))},x)):h(C.Button,{kind:'ghost',size:'sm',onClick:()=>setF(['Region: eu-de','Status: running','Owner: platform-team'])},'Restore filters'));
}
function App(){
 const types=[['red','Production'],['magenta','GPU'],['purple','Kubernetes'],['blue','us-south'],['cyan','eu-de'],['teal','Beta'],['green','Public'],['gray','Default'],['cool-gray','Archive'],['warm-gray','Legacy'],['high-contrast','New'],['outline','Draft']];
 return h('div',null,
  Cap('Types: ten color pairs plus high-contrast and outline (md, 24px)'),
  h('div',{className:'row types'},types.map(t=>It(t[0],h(C.Tag,{type:t[0]},t[1])))),
  h('div',{className:'grid'},
   h('div',null,Cap('Sizes: sm 18, md 24, lg 32'),h('div',{className:'row'},It('sm',h(C.Tag,{size:'sm',type:'blue'},'us-south')),It('md',h(C.Tag,{type:'blue'},'us-south')),It('lg',h(C.Tag,{size:'lg',type:'blue'},'us-south')))),
   h('div',null,Cap('renderIcon: decorative, md and lg only'),h('div',{className:'row'},h(C.Tag,{type:'purple',renderIcon:'virtual-machine'},'4 vCPU'),h(C.Tag,{size:'lg',type:'teal',renderIcon:'ai-generate'},'AI assisted'))),
   h('div',null,Cap('Disabled and truncated (13rem, full text in title)'),h('div',{className:'row'},h(C.Tag,{type:'green',disabled:true},'Public'),h(C.Tag,{type:'cyan'},'eu-de-zone-2-private-subnet-backup'))) ),
  h('div',{className:'grid'},
   h('div',{style:{gridColumn:'span 2'}},Cap('filter + onClose: only the close icon is interactive (prefer DismissibleTag)'),h(Filters)),
   h('div',null,Cap('onClick: operational (prefer OperationalTag)'),h('div',{className:'row'},h(C.Tag,{type:'cyan',onClick(){}},'+3 regions'),h(C.Tag,{type:'gray',onClick(){},disabled:true},'+2 owners')))),
  Cap('In context: categorizing clusters in a resource list'),
  h('div',{className:'res'},
   [['prod-eu-de-1',[['red','Production'],['purple','Kubernetes'],['cyan','eu-de']]],['staging-us-1',[['teal','Beta'],['purple','Kubernetes'],['blue','us-south']]],['batch-gpu-2',[['magenta','GPU'],['warm-gray','Legacy']]]].map(r=>
    h('div',{key:r[0],className:'res-row'},h('b',null,r[0]),h('div',{className:'tags'},r[1].map(t=>h(C.Tag,{key:t[1],type:t[0],size:'sm'},t[1])))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
