<!-- @dsCard group="Patterns" width=1280 height=776 subtitle="Two-step login: user ID, then password; alternative login, recovery links, inline and server errors" page -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px;min-height:48px}
.screens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.screen{border:1px solid var(--border-subtle-01);background:var(--background);height:672px;box-sizing:border-box;padding:48px 24px 24px;display:flex;flex-direction:column}
.screen form{display:flex;flex-direction:column}
.screen h1{margin:0 0 8px;color:var(--text-primary)}
.screen .sub{margin:0;color:var(--text-primary)}
.screen hr{border:0;border-top:1px solid var(--border-subtle-01);margin:24px 0}
.screen .cds--inline-notification{max-width:none;margin:0 0 24px}
.full{width:100%;max-width:none}
.gap16{height:16px}.gap24{height:24px}
.alt-label{margin:0 0 16px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.help{margin-top:auto;padding-top:24px;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.forgot{margin-top:8px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState,useEffect}=React;
// workaround: the base TextInput doesn't pass autoComplete through, so it is set on the input after render
function useAutocomplete(id,v){useEffect(()=>{const el=document.getElementById(id);if(el)el.setAttribute('autocomplete',v)},[id,v])}
function Cap(t){return h('p',{className:'cap'},t)}
function Help(){return h('p',{className:'help'},'Need help? ',h(C.Link,{href:'#',inline:true},'Contact support'))}
function IdStep(p){
 const [id,setId]=useState(p.id||'');
 const [err,setErr]=useState(p.err||'');
 useAutocomplete(p.k+'-id','username');
 const check=()=>setErr(!id?'Enter your email address.':/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id)?'':'Enter an email address in the format name@example.com.');
 return h('div',{className:'screen'},
  h('form',{noValidate:true,'aria-labelledby':p.k+'-h',onSubmit:e=>{e.preventDefault();check()}},
   h('h1',{id:p.k+'-h',className:'cds--type-heading-04'},'Log in to Cloud console'),
   h('p',{className:'sub cds--type-body-compact-01'},'Don’t have an account? ',h(C.Link,{href:'#',inline:true},'Create an account')),
   h('hr'),
   p.notice?h(C.InlineNotification,{kind:'error',role:'alert',lowContrast:true,hideCloseButton:true,title:'Your user ID or password is incorrect.',subtitle:'Check both and log in again. After 5 failed attempts your account is locked for 15 minutes.'}):null,
   // workaround: the base TextInput ignores onBlur, so validation listens on a wrapper (React blur events bubble)
   h('div',{onBlur:e=>{if(e.target.tagName==='INPUT')check()}},h(C.TextInput,{id:p.k+'-id',type:'email',labelText:'Email',value:id,onChange:e=>{setId(e.target.value);if(err)setErr('')},invalid:!!err,invalidText:err})),
   h('div',{className:'gap16'}),
   h(C.Checkbox,{id:p.k+'-rem',labelText:'Remember my user ID',defaultChecked:!!p.remember}),
   h('div',{className:'gap24'}),
   h(C.Button,{kind:'primary',type:'submit',renderIcon:'arrow--right',className:'full'},'Continue'),
   h('hr'),
   h('p',{className:'alt-label'},'Alternative login'),
   h(C.Button,{kind:'tertiary',className:'full'},'Log in with company SSO')),
  h(Help));
}
function PasswordStep(){
 const [pw,setPw]=useState('');
 const [err,setErr]=useState('Enter your password.');
 return h('div',{className:'screen'},
  h('form',{noValidate:true,'aria-labelledby':'lp-h',onSubmit:e=>{e.preventDefault();setErr(pw?'':'Enter your password.')}},
   h('h1',{id:'lp-h',className:'cds--type-heading-04'},'Log in'),
   h('p',{className:'sub cds--type-body-compact-01'},'Logging in as ana.silva@northwind.dev. ',h(C.Link,{href:'#',inline:true},'Not you?')),
   h('hr'),
   h('div',{onBlur:e=>{if(e.target.tagName==='INPUT')setErr(pw?'':'Enter your password.')}},h(C.PasswordInput,{id:'lp-pw',labelText:'Password',autoComplete:'current-password',value:pw,onChange:e=>{setPw(e.target.value);if(err)setErr('')},invalid:!!err,invalidText:err})),
   h('div',{className:'forgot'},h(C.Link,{href:'#',size:'sm'},'Forgot password?')),
   h('div',{className:'gap24'}),
   h(C.Button,{kind:'primary',type:'submit',renderIcon:'arrow--right',className:'full'},'Log in')),
  h(Help));
}
function App(){
 return h('div',{className:'screens'},
  h('div',null,Cap('Step 1, user ID. Continue routes to SSO for company domains, or to the password step. Remember sits under the field; alternative logins come after the primary button.'),h(IdStep,{k:'l1',remember:true})),
  h('div',null,Cap('Step 2, password. The ID is confirmed with a way back; an empty field shows its error when it loses focus.'),h(PasswordStep)),
  h('div',null,Cap('After a failed login the page returns to step 1 with the ID kept, the password cleared, and one generic error that doesn’t reveal which part was wrong.'),h(IdStep,{k:'l3',id:'ana.silva@northwind.dev',notice:true,remember:true})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
