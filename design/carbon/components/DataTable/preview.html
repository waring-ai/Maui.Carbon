<!-- @dsCard group="Data" height=3096 subtitle="Sizes, zebra, sort, checkbox and radio selection, batch actions, search, row menus, expandable rows, empty state" -->
<style>body{margin:0;padding:24px;background:var(--background)} .stack{display:flex;flex-direction:column;gap:32px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .exp{margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)} .num{font-variant-numeric:tabular-nums;white-space:nowrap}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function Block(cap,node,p){return h("div",p||null,Cap(cap),node)}

const headers=[{key:'name',header:'Name'},{key:'status',header:'Status'},{key:'region',header:'Region'},{key:'nodes',header:'Nodes',align:'right'},{key:'version',header:'Version'}];
const clusters=[
 ['prod-us-east-1','Running','us-east',12,'1.29.4'],
 ['prod-eu-de-1','Running','eu-de',9,'1.29.4'],
 ['staging-us-south','Updating','us-south',4,'1.28.9'],
 ['dev-jp-tok','Stopped','jp-tok',2,'1.28.9'],
 ['analytics-eu-gb','Running','eu-gb',6,'1.29.4'],
 ['ml-training-us-east','Degraded','us-east',16,'1.29.2'],
 ['batch-au-syd','Running','au-syd',3,'1.28.9'],
 ['edge-ca-tor','Stopped','ca-tor',2,'1.27.12'],
 ['ci-runners-us-south','Running','us-south',8,'1.29.4'],
 ['backup-eu-de-2','Running','eu-de',3,'1.29.4']
].map((r,i)=>({id:'c'+i,name:r[0],status:r[1],region:r[2],nodes:r[3],version:r[4]}));
const three=clusters.slice(0,3), h3=headers.slice(0,3);
const rowActions=[{label:'View details'},{label:'Restart'},{label:'Upgrade version'},{label:'Delete',kind:'danger'}];
const statusType={Running:'green',Updating:'blue',Stopped:'gray',Degraded:'red'};
const tagCell=(v,row,hd)=>hd.key==='status'?h(C.Tag,{type:statusType[v]||'gray',size:'sm'},v):v;

function Full(){
 const [sel,setSel]=useState(['c1','c2']);
 return h(C.DataTable,{title:'Clusters',description:'Kubernetes clusters in this account. Select clusters to restart, stop or export them.',headers,rows:clusters.slice(0,5),
  selectable:true,isSortable:true,search:true,searchPlaceholder:'Filter clusters',selectedIds:sel,onSelectionChange:setSel,defaultSortKey:'nodes',defaultSortDirection:'DESC',
  batchActions:[{label:'Restart',icon:'restart'},{label:'Stop',icon:'stop'},{label:'Export',icon:'export'}],
  toolbarContent:h(C.Button,{size:'lg',renderIcon:'add'},'Create cluster'),rowActions,overflowMenuOnHover:false});
}
function Rest(){
 return h(C.DataTable,{headers:h3,rows:three,selectable:true,search:true,searchPlaceholder:'Filter clusters',size:'md','aria-label':'Clusters',
  batchActions:[{label:'Restart',icon:'restart'}],toolbarContent:[h(C.Button,{key:'s',kind:'ghost',hasIconOnly:true,renderIcon:'settings',iconDescription:'Table settings',size:'lg'}),h(C.Button,{key:'a',size:'lg',renderIcon:'add'},'Create cluster')]});
}
function Primitives(){
 const {Table,TableHead,TableRow,TableHeader,TableBody,TableCell}=C;
 const lines=[['Compute','Virtual servers','2,184 h','$1,048.32'],['Storage','Block storage','3.2 TB','$412.80'],['Network','Public egress','1.8 TB','$162.00'],['Support','Advanced plan','1 mo','$200.00']];
 return h(Table,{size:'md','aria-label':'Charges this month'},
  h(TableHead,null,h(TableRow,null,h(TableHeader,null,'Service'),h(TableHeader,null,'Plan'),h(TableHeader,{align:'right'},'Usage'),h(TableHeader,{align:'right'},'Cost'))),
  h(TableBody,null,lines.map((l,i)=>h(TableRow,{key:i,isSelected:i===1},h(TableCell,null,l[0]),h(TableCell,null,l[1]),h(TableCell,{align:'right',className:'num'},l[2]),h(TableCell,{align:'right',className:'num'},l[3])))));
}
function Nodes(){
 const nodes=Array.from({length:23},(_,i)=>{const z=['us-east-1','us-east-2','us-east-3'][i%3];return {id:'n'+i,name:'worker-'+String(i+1).padStart(2,'0'),status:i===4?'Degraded':i===9?'Updating':'Running',zone:z,cpu:(18+(i*37)%70)+'%',memory:(9+(i*11)%22)+' / 32 GB'}});
 const nh=[{key:'name',header:'Node'},{key:'status',header:'Status'},{key:'zone',header:'Zone'},{key:'cpu',header:'CPU',align:'right'},{key:'memory',header:'Memory',align:'right'}];
 const [pg,setPg]=useState({page:1,pageSize:5});
 const rows=nodes.slice((pg.page-1)*pg.pageSize,pg.page*pg.pageSize);
 return h('div',null,
  h(C.DataTable,{title:'Worker nodes',description:'prod-us-east-1 · 23 nodes in 3 zones',headers:nh,rows,isSortable:true,search:true,searchPlaceholder:'Filter nodes',size:'md',renderCell:tagCell,
   rowActions:[{label:'Reboot'},{label:'Cordon'},{label:'Replace node',kind:'danger'}],toolbarContent:h(C.Button,{size:'lg',renderIcon:'add'},'Add node')}),
  h(C.Pagination,{page:pg.page,pageSize:pg.pageSize,pageSizes:[5,10,25],totalItems:nodes.length,onChange:setPg}));
}
function App(){
 return h('div',{className:'stack'},
  Block('Title, description, batch bar (2 selected), sorted by Nodes descending, row overflow menus always visible',h(Full)),
  Block('Toolbar at rest: expandable search, icon button and primary action; size="md"',h(Rest)),
  h('div',{className:'grid'},
   ['xs','sm','md','lg','xl'].map(s=>Block('size="'+s+'"'+(s==='lg'?' (default)':''),h(C.DataTable,{headers:h3,rows:three.slice(0,2),size:s,isSortable:true,'aria-label':'Clusters, size '+s}),{key:s})),
   Block('useZebraStyles',h(C.DataTable,{headers:h3,rows:clusters.slice(0,4),size:'sm',useZebraStyles:true,'aria-label':'Clusters, zebra'}))),
  h('div',{className:'grid'},
   Block('Single selection (radio); dev-jp-tok disabled',h(C.DataTable,{headers:h3,rows:clusters.slice(1,4).map(r=>r.id==='c3'?Object.assign({},r,{disabled:true}):r),size:'md',selectable:'radio',defaultSelectedIds:['c1'],'aria-label':'Choose a cluster'})),
   Block('Multi selection: header checkbox indeterminate, one row disabled',h(C.DataTable,{headers:h3,rows:clusters.slice(1,4).map(r=>r.id==='c3'?Object.assign({},r,{disabled:true}):r),size:'md',selectable:true,defaultSelectedIds:['c1'],'aria-label':'Select clusters'}))),
  Block('Expandable rows with selection (staging-us-south expanded)',
   h(C.DataTable,{headers:headers.slice(0,4),rows:three,expandable:true,selectable:true,defaultExpandedIds:['c2'],defaultSelectedIds:['c0'],'aria-label':'Clusters, expandable',
    renderExpanded:row=>h('p',{className:'exp'},row.name+' runs Kubernetes '+row.version+' on '+row.nodes+' worker nodes in '+row.region+'. An upgrade to 1.29.4 is in progress; 2 of 4 nodes are done.')})),
  h('div',{className:'grid'},
   Block('Empty state: no rows yet',h(C.DataTable,{headers:h3,rows:[],size:'md','aria-label':'API keys',
    emptyState:{title:'No API keys yet',description:'Create a key to let services call the API on your behalf.',action:h(C.Button,{size:'md',renderIcon:'add'},'Create API key')}})),
   Block('Empty state: search has no match',h(C.DataTable,{headers:h3,rows:three,size:'md',search:true,persistentSearch:true,defaultSearchValue:'tokyo-2',searchPlaceholder:'Filter clusters','aria-label':'Clusters, filtered',
    emptyState:{title:'No clusters match "tokyo-2"',description:'Check the spelling or clear the filter to see all clusters.'}}))),
  h('div',{className:'grid'},
   Block('stickyHeader: body scrolls under the header (max 300px)',h(C.DataTable,{headers:[headers[0],headers[3]],rows:clusters,size:'sm',stickyHeader:true,'aria-label':'All clusters'})),
   Block('Primitives: static Table / TableHead / TableRow / TableHeader / TableBody / TableCell (Storage row isSelected)',h(Primitives))),
  Block('In context: cluster nodes with status tags, row menus on hover, and Pagination',h(Nodes)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
