<!-- @dsCard group="Status" height=432 subtitle="Large and small spinner, stopped, with overlay over a region, inline status" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .stack{display:flex;flex-direction:column;gap:32px} .row{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start} .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.stage{position:relative;transform:translateZ(0);height:200px;border:1px solid var(--border-subtle-01);background:var(--layer-01);overflow:hidden;padding:16px;box-sizing:border-box} .stage h4{margin:0 0 4px;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .stage p{margin:0 0 4px;font:400 14px/20px var(--font-sans);color:var(--text-secondary)}
.inl{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,node,p){return h('div',p||null,Cap(cap),node)}
function App(){
 return h('div',{className:'stack'},
  h('div',{className:'row'},
   B('Default: large (88px), active',h(C.Loading,{withOverlay:false,description:'Loading clusters'})),
   B('small (16px), no overlay',h(C.Loading,{small:true,withOverlay:false,description:'Refreshing metrics'})),
   B('small beside a short status label',h('div',{className:'inl'},h(C.Loading,{small:true,withOverlay:false,description:'Refreshing metrics'}),'Refreshing metrics')),
   B('active={false}: winds down and stops',h(C.Loading,{withOverlay:false,active:false,description:'Clusters loaded'}))),
  B('In context: withOverlay blocks a region while it recalculates (fixed to the viewport in real use; contained here); small spinner in a tile header for a background refresh',h('div',{className:'grid'},
   h('div',{className:'stage'},h('h4',null,'Billing summary'),h('p',null,'March 2026 · $1,823.12 so far'),h('p',null,'Forecast: $2,410.00'),h(C.Loading,{withOverlay:true,description:'Recalculating billing summary'})),
   h('div',{className:'stage'},h('div',{className:'inl',style:{justifyContent:'space-between',marginBottom:8}},h('h4',{style:{margin:0}},'Node CPU'),h('span',{className:'inl'},h(C.Loading,{small:true,withOverlay:false,description:'Refreshing node CPU'}),'Refreshing')),h('p',null,'worker-01 · 18%'),h('p',null,'worker-02 · 55%'),h('p',null,'worker-03 · 22%')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
