<!-- @dsCard group="Containers" height=766 subtitle="Collapsed, expanded, visible labels, interactive content, on a Layer, AI decorator; cluster cards" -->
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--text-primary)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:24px}
.tt{margin:0 0 4px;font:600 14px/18px var(--font-sans);letter-spacing:.16px}
.ts{margin:0;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.above{min-block-size:64px;padding-inline-end:24px}
.below{padding-block-start:16px;padding-inline-end:32px}
.below p{margin:0 0 8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.on-layer{background:var(--layer-01);padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 16px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.kv dt{color:var(--text-secondary)} .kv dd{margin:0}
.head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.acts{display:flex;gap:16px;align-items:center;padding-block-end:8px}
.ai p{margin:0 0 8px;font:400 14px/20px var(--font-sans);letter-spacing:.16px} .ai .s{color:var(--text-secondary)}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const A=(t,s,extra)=>h(C.TileAboveTheFoldContent,null,h('div',{className:'above'},h('p',{className:'tt'},t),h('p',{className:'ts'},s),extra||null));
const B=(...kids)=>h(C.TileBelowTheFoldContent,null,h('div',{className:'below'},kids));
const P=t=>h('p',null,t);
function Cluster(props){
 const c=props.c;
 return h(C.ExpandableTile,{expanded:!!c.open,tileCollapsedIconText:'Show details for '+c.name,tileExpandedIconText:'Hide details for '+c.name},
  h(C.TileAboveTheFoldContent,null,h('div',{className:'above'},
   h('div',{className:'head'},h('p',{className:'tt',style:{margin:0}},c.name),h(C.Tag,{type:c.ok?'green':'red',size:'sm'},c.ok?'Healthy':'Degraded')),
   h('p',{className:'ts'},c.nodes+' nodes · '+c.region))),
  h(C.TileBelowTheFoldContent,null,h('div',{className:'below'},
   h('dl',{className:'kv'},h('dt',null,'Version'),h('dd',null,c.version),h('dt',null,'Worker pools'),h('dd',null,c.pools),h('dt',null,'Created'),h('dd',null,c.created)),
   h('div',{className:'acts'},h(C.Button,{kind:'tertiary',size:'sm'},'View nodes'),h(C.Link,{href:'#'},'Logs')))));
}
function App(){
 const AI=h(C.AILabel,{size:'mini','aria-label':'How this summary was generated'},h(C.AILabelContent,null,h('div',{className:'ai'},h('p',{className:'s'},'AI explained'),h('p',null,'Summarized from the last 7 days of node events for prod-eu-1.'))));
 return h('div',null,
  Cap('No interactive content: the whole tile is the toggle button. Collapsed, expanded, and with visible tileCollapsedLabel / tileExpandedLabel'),
  h('div',{className:'tiles'},
   h(C.ExpandableTile,{tileCollapsedIconText:'Show restart policy',tileExpandedIconText:'Hide restart policy'},A('Restart policy','Pods restart on failure'),B(P('Failed pods restart with exponential back-off, up to 5 minutes between attempts.'))),
   h(C.ExpandableTile,{expanded:true,tileCollapsedIconText:'Show restart policy',tileExpandedIconText:'Hide restart policy'},A('Restart policy','Expanded (expanded prop)'),B(P('Failed pods restart with exponential back-off, up to 5 minutes between attempts.'))),
   h(C.ExpandableTile,{tileCollapsedLabel:'Show more',tileExpandedLabel:'Show less'},A('Network policy','Ingress allowed from 3 namespaces'),B(P('frontend, payments and monitoring may reach this namespace on port 443.')))),
  Cap('Interactive content (link, button): a separate chevron button toggles; on a Layer; with an AI label decorator'),
  h('div',{className:'tiles'},
   h(C.ExpandableTile,{tileCollapsedIconText:'Show certificate details',tileExpandedIconText:'Hide certificate details'},A('TLS certificate','Expires in 12 days',h('div',{style:{marginTop:8}},h(C.Link,{href:'#'},'Renew now'))),B(P('Issued by Let’s Encrypt for api.example.com and *.example.com.'))),
   h('div',{className:'on-layer'},h(C.Layer,null,h(C.ExpandableTile,{tileCollapsedIconText:'Show quota',tileExpandedIconText:'Hide quota'},A('Quota','In a Layer: layer-02 fill'),B(P('48 of 64 vCPUs and 180 of 256 GB memory in use.'))))),
   h(C.ExpandableTile,{decorator:AI,expanded:true,tileCollapsedIconText:'Show summary',tileExpandedIconText:'Hide summary'},A('Health summary','AI-generated, expanded'),B(P('Two nodes restarted after memory pressure on Tuesday. No action needed.')))),
  Cap('In context: a cluster list where each card expands to its details and actions'),
  h('div',{className:'tiles',style:{marginBottom:0}},
   [{name:'prod-eu-1',ok:true,nodes:12,region:'eu-de',version:'Kubernetes 1.30.4',pools:'default, gpu-a100',created:'12 March 2025'},
    {name:'prod-us-2',ok:false,open:true,nodes:9,region:'us-south',version:'Kubernetes 1.29.8',pools:'default',created:'2 June 2024'},
    {name:'staging-eu-1',ok:true,nodes:3,region:'eu-de',version:'Kubernetes 1.30.4',pools:'default',created:'8 January 2026'}].map(c=>h(Cluster,{key:c.name,c}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
