<!-- @dsCard group="Status" height=1102 subtitle="Six kinds in high and low contrast; no close button, link in subtitle, wrapping, in a form" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .two{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin-bottom:16px} .two .cds--inline-notification{margin-block:0 8px} .stack .cds--inline-notification{margin-block:0 16px}
.form{background:var(--layer-01);padding:24px 24px 0;max-width:560px} .form h4{margin:0 0 24px;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .acts{display:flex;justify-content:flex-end;margin:0 -24px} .acts .cds--btn{inline-size:50%;max-inline-size:none} .reopen{margin-bottom:16px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}

const K=[
 ['error','Deployment failed','Image checkout-api:2.4 was not found. Push the image and deploy again.'],
 ['success','Cluster created','prod-eu-de-1 is ready with 3 worker nodes.'],
 ['warning','Storage quota at 92%','Writes to logs-archive stop at 100%. Delete objects or raise the quota.'],
 ['warning-alt','Certificate expires in 7 days','Renew the certificate for api.northwind.dev to avoid downtime.'],
 ['info','Maintenance on Sunday','Control plane upgrades run from 02:00 to 04:00 UTC.'],
 ['info-square','New region available','You can now create clusters in jp-osa.']];
function Dismiss(){
 const [n,setN]=useState(0),[closed,setClosed]=useState(false);
 return h('div',null,
  closed?h('div',{className:'reopen'},h(C.Button,{kind:'ghost',size:'sm',onClick:()=>{setClosed(false);setN(n+1)}},'Show the notification again')):
  h(C.InlineNotification,{key:n,kind:'info',lowContrast:true,title:'Billing moved',subtitle:'Invoices are now under Manage > Billing.',onCloseButtonClick:()=>setClosed(true)}));
}
function Form(){
 return h('div',{className:'form'},
  h('h4',null,'Resize node pool'),
  h(C.TextInput,{id:'in-n',labelText:'Nodes per zone',defaultValue:'40',invalid:true,invalidText:'Enter a number from 1 to 32.'}),
  h(C.InlineNotification,{kind:'error',lowContrast:true,hideCloseButton:true,title:'Fix 1 error to continue',subtitle:'Nodes per zone is above the limit for your plan.'}),
  h('div',{className:'acts'},h(C.Button,{kind:'secondary'},'Cancel'),h(C.Button,null,'Resize')));
}
function App(){
 return h('div',null,
  h('div',{className:'two'},
   h('div',null,Cap('High contrast (default): background-inverse'),K.map(x=>h(C.InlineNotification,{key:x[0],kind:x[0],title:x[1],subtitle:x[2]}))),
   h('div',null,Cap('lowContrast: notification-background-* tints'),K.map(x=>h(C.InlineNotification,{key:x[0],kind:x[0],lowContrast:true,title:x[1],subtitle:x[2]})))),
  h('div',{className:'two'},
   h('div',{className:'stack'},
    Cap('hideCloseButton: the person must act on it'),
    h(C.InlineNotification,{kind:'warning',hideCloseButton:true,title:'Read-only mode',subtitle:'Your trial has ended. Upgrade to make changes.'}),
    Cap('actions: a ghost Button (prefer ActionableNotification)'),
    h(C.InlineNotification,{kind:'info',lowContrast:true,title:'Kubernetes 1.31 is available',subtitle:'prod-eu-de-1 runs 1.29.',actions:h(C.Button,{kind:'ghost',size:'sm'},'Upgrade cluster')}),
    Cap('subtitle as a node with a Link (link-inverse on high contrast)'),
    h(C.InlineNotification,{kind:'error',title:'2 nodes are not ready',subtitle:h('span',null,'Check the ',h(C.Link,{href:'#',inline:true},'node logs'),' or drain and replace them.')}),
    h(C.InlineNotification,{kind:'success',lowContrast:true,title:'Backup restored',subtitle:h('span',null,'Data from 14 Nov is back in db-prod. ',h(C.Link,{href:'#',inline:true},'View restore report'))})),
   h('div',{className:'stack'},
    Cap('Close button: onClose / onCloseButtonClick, Escape inside it also closes'),
    h(Dismiss),
    Cap('In context: a form-level error above the submit buttons'),
    h(Form))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
