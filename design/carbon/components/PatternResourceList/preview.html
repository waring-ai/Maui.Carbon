<!-- @dsCard group="Patterns" width=1280 height=1246 subtitle="Clusters page: shell, page header, searchable selectable table, row menu, pagination" page -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
/* a transformed ancestor makes the fixed header and side nav position inside the frame */
.frame{position:relative;transform:translateZ(0);height:808px;border:1px solid var(--border-subtle-01);overflow:hidden;background:var(--background)}
.frame .cds--header__nav{display:block}
.frame .cds--side-nav__overlay{display:none}
.frame .cds--content{padding:0;height:760px;overflow:hidden}
.body{padding:24px 32px 32px}
.body .cds--data-table-container{margin:0}
/* row overflow menu column: flush 40px cell, as Carbon's .cds--table-column-menu */
.body tbody td:last-child{padding:0;width:40px;text-align:end}
.body td .cds--overflow-menu{vertical-align:middle}
.searching{margin-top:32px;padding-bottom:112px}
/* workaround: the OverflowMenu list is absolutely positioned (no portal), so the table's scrolling wrapper would clip it */
.searching .cds--data-table-content{overflow:visible}
.searching tbody td:last-child{padding:0;width:40px;text-align:end}
/* workaround: header labels are forced to text-align:start, so align:'right' does not reach the header text */
.cds--data-table th[align='right'] .cds--table-header-label{flex:1 1 auto;text-align:end}
.cds--data-table td .cds--menu{text-align:start}
.name a{font:400 14px/18px var(--font-sans);letter-spacing:.16px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
const clusters=[
 ['prod-eu-01','Running','Frankfurt','1.31.2',12,'Nov 3, 2026'],
 ['prod-us-02','Running','Dallas','1.31.2',18,'Oct 28, 2026'],
 ['staging-eu-01','Updating','Frankfurt','1.30.6',4,'Oct 21, 2026'],
 ['payments-ap-01','Warning','Tokyo','1.30.6',6,'Oct 14, 2026'],
 ['analytics-us-01','Failed','Washington DC','1.29.10',8,'Sep 30, 2026'],
 ['dev-sandbox-03','Stopped','London','1.31.2',1,'Sep 22, 2026'],
 ['ml-training-01','Running','Dallas','1.31.2',24,'Sep 9, 2026'],
 ['edge-cache-02','Provisioning','London','1.31.2',3,'Nov 16, 2026'],
 ['prod-eu-02','Running','Frankfurt','1.31.2',12,'Aug 27, 2026'],
 ['batch-jobs-us-01','Running','Washington DC','1.30.6',10,'Aug 12, 2026']
].map((r,i)=>({id:'c'+i,name:r[0],status:r[1],region:r[2],version:r[3],nodes:r[4],created:r[5],actions:''}));
const statusKind={Running:'succeeded',Updating:'in-progress',Warning:'caution-major',Failed:'failed',Stopped:'not-started',Provisioning:'pending'};
const headers=[
 {key:'name',header:'Name'},{key:'status',header:'Status'},{key:'region',header:'Region'},
 {key:'version',header:'Version'},{key:'nodes',header:'Worker nodes',align:'right'},{key:'created',header:'Created'},
 {key:'actions',header:h('span',{className:'cds--visually-hidden'},'Actions'),isSortable:false}];
function rowMenu(row,open){
 return h(C.OverflowMenu,{size:'md',flipped:true,defaultOpen:!!open,iconDescription:'Actions for '+row.name},
  h(C.MenuItem,{label:'View details'}),
  h(C.MenuItem,{label:'Add nodes'}),
  h(C.MenuItem,{label:'Update version',disabled:row.version==='1.31.2'}),
  h(C.MenuItemDivider),
  h(C.MenuItem,{label:'Delete cluster',kind:'danger'}));
}
function renderCell(v,row,hd){
 if(hd.key==='name')return h('span',{className:'name'},h(C.Link,{href:'#'},v));
 if(hd.key==='status')return h(C.IconIndicator,{kind:statusKind[v],label:v});
 if(hd.key==='actions')return rowMenu(row);
 return v;
}
function Shell(){
 return h(C.Header,{'aria-label':'Cloud console'},
  h(C.HeaderMenuButton,{'aria-label':'Close menu',isCollapsible:true,isActive:true}),
  h(C.HeaderName,{href:'#',prefix:''},'Cloud console'),
  h(C.HeaderNavigation,{'aria-label':'Cloud console'},
   h(C.HeaderMenuItem,{href:'#'},'Catalog'),
   h(C.HeaderMenuItem,{href:'#',isActive:true},'Resources'),
   h(C.HeaderMenuItem,{href:'#'},'Billing')),
  h(C.HeaderGlobalBar,null,
   h(C.HeaderGlobalAction,{'aria-label':'Search'},h(C.Icon,{name:'search',size:20})),
   h(C.HeaderGlobalAction,{'aria-label':'Notifications'},h(C.Icon,{name:'notification',size:20})),
   h(C.HeaderGlobalAction,{'aria-label':'Account'},h(C.Icon,{name:'user',size:20}))));
}
function Nav(){
 return h(C.SideNav,{'aria-label':'Kubernetes',expanded:true,isFixedNav:false,addFocusListeners:false},
  h(C.SideNavItems,null,
   h(C.SideNavLink,{href:'#',renderIcon:'dashboard'},'Overview'),
   h(C.SideNavMenu,{title:'Kubernetes',renderIcon:'virtual-machine',defaultExpanded:true},
    h(C.SideNavMenuItem,{href:'#',isActive:true},'Clusters'),
    h(C.SideNavMenuItem,{href:'#'},'Worker pools'),
    h(C.SideNavMenuItem,{href:'#'},'Ingress')),
   h(C.SideNavMenu,{title:'Storage',renderIcon:'folder'},
    h(C.SideNavMenuItem,{href:'#'},'Buckets')),
   h(C.SideNavLink,{href:'#',renderIcon:'analytics'},'Monitoring'),
   h(C.SideNavDivider),
   h(C.SideNavLink,{href:'#',renderIcon:'settings'},'Settings')));
}
function Page(){
 const [sel,setSel]=useState(['c4','c5']);
 const [pg,setPg]=useState({page:1,pageSize:10});
 return h('div',{className:'frame'},
  h(Shell),h(Nav),
  h('main',{className:'cds--content',id:'main-content'},
   h(C.PageHeader,null,
    h(C.PageHeaderBreadcrumbBar,null,
     h(C.Breadcrumb,{noTrailingSlash:true},h(C.BreadcrumbItem,{href:'#'},'Resources'),h(C.BreadcrumbItem,{href:'#'},'Kubernetes'))),
    h(C.PageHeaderContent,{title:'Clusters',
      pageActions:h(C.PageHeaderContentPageActions,{actions:[
       {id:'dl',body:h(C.IconButton,{kind:'ghost',size:'md',renderIcon:'download',label:'Export list',align:'bottom'})}]})},
     h(C.PageHeaderContentText,null,'Managed Kubernetes clusters in this account. Select clusters to stop or delete them together.'))),
   h('div',{className:'body'},
    h(C.DataTable,{'aria-label':'Clusters',headers,rows:clusters,renderCell,size:'md',selectable:true,isSortable:true,
      search:true,searchPlaceholder:'Search clusters',
      selectedIds:sel,onSelectionChange:setSel,
      batchActions:[{label:'Stop',icon:'stop'},{label:'Export',icon:'export'},{label:'Delete'}],
      toolbarContent:h(C.Button,{kind:'primary',renderIcon:'add'},'Create cluster')}),
    h(C.Pagination,{page:pg.page,pageSize:pg.pageSize,pageSizes:[10,25,50],totalItems:23,onChange:setPg}))));
}
function Searching(){
 const cell=(v,row,hd)=>hd.key==='actions'?rowMenu(row,row.id==='c1'):renderCell(v,row,hd);
 return h('div',{className:'searching'},
  h('p',{className:'cap'},'Same table with nothing selected: the toolbar shows the open search (filtered to "prod") and the primary action; a row menu is open'),
  h(C.DataTable,{'aria-label':'Clusters, filtered',headers,rows:clusters,renderCell:cell,size:'md',selectable:true,isSortable:true,
   search:true,persistentSearch:true,defaultSearchValue:'prod',searchPlaceholder:'Search clusters',
   batchActions:[{label:'Stop',icon:'stop'},{label:'Export',icon:'export'},{label:'Delete'}],
   toolbarContent:h(C.Button,{kind:'primary',renderIcon:'add'},'Create cluster')}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',null,h(Page),h(Searching)));
</script>
