<!-- @dsCard group="Overlays" height=488 subtitle="Dotted-underline term that shows its definition on focus, click or hover; in running text and a usage table" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px;margin-bottom:24px}.cell{display:flex;block-size:120px;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
.txt{font:400 14px/20px var(--font-sans);letter-spacing:.16px;margin:0 0 24px;max-inline-size:640px}
table{inline-size:100%;border-collapse:collapse;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
th{block-size:48px;padding:0 16px;text-align:start;font-weight:600;background:var(--layer-accent-01)}th.n,td.n{text-align:end}
td{block-size:48px;padding:0 16px;background:var(--layer-01);border-block-end:1px solid var(--border-subtle-01)}
.ctx{border:1px solid var(--border-subtle-01);padding:16px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const D=(p,term)=>h(C.DefinitionTooltip,p,term);
function App(){
 return h('div',null,
  Cap('Open (defaultOpen): align bottom (default), bottom-start, top, right'),
  h('div',{className:'grid'},
   h('div',{className:'cell',style:{alignItems:'flex-start',justifyContent:'center'}},D({defaultOpen:true,definition:'Gigabyte-hours: memory allocated multiplied by hours running.'},'GB-hours')),
   h('div',{className:'cell',style:{alignItems:'flex-start'}},D({defaultOpen:true,align:'bottom-start',definition:'Data sent out of a region to the internet.'},'Egress')),
   h('div',{className:'cell',style:{alignItems:'flex-end',justifyContent:'center'}},D({defaultOpen:true,align:'top',definition:'Time a request waits before a node accepts it.'},'Queue time')),
   h('div',{className:'cell',style:{alignItems:'center'}},D({defaultOpen:true,align:'right',definition:'Virtual CPU.'},'vCPU'))),
  Cap('Closed, in running text: click or focus opens; openOnHover also opens on hover (the second term). Escape, blur and mouse leave close'),
  h('p',{className:'txt'},'Each node pool reserves ',D({definition:'Capacity held back for system pods, so workloads cannot use it.'},'system overhead'),' and bills ',D({openOnHover:true,definition:'Billed only while at least one pod is scheduled on the node.',align:'top'},'active node time'),' by the second.'),
  Cap('In context: a usage table. Column headers that need a definition use the term as the header'),
  h('div',{className:'ctx'},
   h('table',null,
    h('thead',null,h('tr',null,h('th',null,'Resource'),h('th',{className:'n'},D({defaultOpen:true,align:'bottom-end',definition:'Memory allocated multiplied by hours running, summed for the month.'},'GB-hours')),h('th',{className:'n'},D({align:'bottom-end',definition:'Data sent out of the region.'},'Egress (GB)')),h('th',{className:'n'},'Cost'))),
    h('tbody',null,[['prod-us-east','18,420','312','$1,284.10'],['staging-eu','4,096','41','$268.75']].map(r=>h('tr',{key:r[0]},h('td',null,r[0]),h('td',{className:'n'},r[1]),h('td',{className:'n'},r[2]),h('td',{className:'n'},r[3])))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
