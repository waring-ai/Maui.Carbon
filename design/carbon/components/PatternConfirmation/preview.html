<!-- @dsCard group="Patterns" height=1424 subtitle="Delete by impact: undo for low, confirm for moderate, type the name for high; discard changes" page -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.sec{margin-bottom:32px}
.sec:last-child{margin-bottom:0}
.modal-body p{margin:0 0 16px}
.modal-body ul{margin:0 0 16px;padding:0;list-style:none}
.modal-body li{font:400 14px/20px var(--font-mono);color:var(--text-primary)}
.modal-body strong{font-weight:600}
.low{position:relative;transform:translateZ(0);height:176px;border:1px solid var(--border-subtle-01);background:var(--background);padding:24px;box-sizing:border-box;overflow:hidden}
.low h3{margin:0 0 4px;color:var(--text-primary)}
.low p{margin:0 0 16px;color:var(--text-secondary)}
.labels{display:flex;flex-wrap:wrap;gap:8px}
.low .toast{position:absolute;top:16px;right:16px}
.low .toast .cds--actionable-notification{margin:0}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
const noop=()=>{};
function Low(){
 const all=['env:production','team:payments','cost-center:4410','tier:gold'];
 const [labels,setLabels]=useState(all.filter(l=>l!=='team:payments'));
 const [removed,setRemoved]=useState('team:payments');
 return h('div',{className:'low'},
  h('h3',{className:'cds--type-heading-compact-02'},'Labels on prod-eu-01'),
  h('p',{className:'cds--type-body-compact-01'},'Labels help you group clusters in billing reports.'),
  h('div',{className:'labels'},labels.map(l=>h(C.DismissibleTag,{key:l,text:l,type:'gray',title:'Remove label '+l,onClose:()=>{setLabels(labels.filter(x=>x!==l));setRemoved(l)}}))),
  removed?h('div',{className:'toast'},h(C.ActionableNotification,{kind:'info',role:'status',hasFocus:false,lowContrast:false,title:'Label removed',subtitle:removed+' was removed from prod-eu-01.',actionButtonLabel:'Undo',
   onActionButtonClick:()=>{setLabels(all.filter(x=>labels.includes(x)||x===removed));setRemoved(null)},onClose:()=>{setRemoved(null);return false}})):null);
}
function High(){
 const [v,setV]=useState('prod-eu-0');
 const ok=v==='prod-eu-01';
 return h(C.Modal,{inline:true,inlineHeight:'26rem',open:true,danger:true,size:'sm',modalLabel:'prod-eu-01',modalHeading:'Delete cluster',
   primaryButtonText:'Delete cluster',secondaryButtonText:'Cancel',primaryButtonDisabled:!ok,onRequestClose:noop,onRequestSubmit:noop,shouldSubmitOnEnter:false},
  h('div',{className:'modal-body'},
   h('p',null,'Deleting prod-eu-01 removes its 12 worker nodes, 184 pods and all persistent volumes. Backups in other regions are kept. You can’t undo this.'),
   h(C.TextInput,{id:'pc-confirm',labelText:'Type prod-eu-01 to confirm',value:v,onChange:e=>setV(e.target.value),autoComplete:'off',
    helperText:ok?'Name matches.':'The Delete cluster button turns on when the name matches.'})));
}
function App(){
 return h('div',null,
  h('div',{className:'sec'},Cap('Low impact, easy to reverse: act at once, then offer Undo in a toast. No dialog.'),h(Low)),
  h('div',{className:'sec'},Cap('Moderate impact or several items: a danger modal names what is deleted and the consequence; Cancel left, the danger action right and named for the action'),
   h(C.Modal,{inline:true,inlineHeight:'21rem',open:true,danger:true,size:'sm',modalHeading:'Delete 2 snapshots?',primaryButtonText:'Delete snapshots',secondaryButtonText:'Cancel',onRequestClose:noop,onRequestSubmit:noop},
    h('div',{className:'modal-body'},
     h('p',null,'These snapshots will be deleted from prod-eu-01:'),
     h('ul',null,h('li',null,'snap-2026-11-02-0200'),h('li',null,'snap-2026-11-09-0200')),
     h('p',null,'You can’t restore the cluster to these points after they are deleted.')))),
  h('div',{className:'sec'},Cap('High impact, can’t be undone: the person types the resource name before the danger button turns on. Type the rest of the name to try it.'),h(High)),
  h('div',{className:'sec'},Cap('Leaving with unsaved changes: a non-danger transactional modal; the safe choice is the primary action'),
   h(C.Modal,{inline:true,inlineHeight:'15rem',open:true,size:'xs',modalHeading:'Discard unsaved changes?',primaryButtonText:'Keep editing',secondaryButtonText:'Discard',onRequestClose:noop,onRequestSubmit:noop},
    h('div',{className:'modal-body'},h('p',null,'You changed 3 settings on Create cluster. If you leave now, those changes are lost.')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
