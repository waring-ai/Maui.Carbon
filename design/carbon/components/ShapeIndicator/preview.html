<!-- @dsCard group="Status" height=627 subtitle="Shape and label for severity and lifecycle: eleven kinds at 12 and 14px, in a findings table" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 24px;margin-bottom:24px}
table{inline-size:100%;border-collapse:collapse;font:400 14px/20px var(--font-sans);letter-spacing:.16px}
th{block-size:48px;padding:0 16px;text-align:start;font-weight:600;background:var(--layer-accent-01);color:var(--text-primary)}
td{block-size:48px;padding:0 16px;background:var(--layer-01);border-block-end:1px solid var(--border-subtle-01);color:var(--text-secondary)}td:first-child{color:var(--text-primary)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const kinds=[['failed','Failed'],['critical','Critical'],['high','High'],['medium','Medium'],['low','Low'],['cautious','Cautious'],['undefined','Undefined'],['stable','Stable'],['informative','Informative'],['incomplete','Incomplete'],['draft','Draft']];
const rows=[['CVE-2026-1182 in openssl 3.0.13','checkout-api','critical','Critical','Fix available'],['Public read access on bucket','billing-exports','high','High','Open'],['TLS 1.1 still enabled','api-gateway','medium','Medium','Open'],['Unused API key older than 90 days','ci-deploy','low','Low','Snoozed'],['Default network policy','prod-eu-west','informative','Informative','Reviewed']];
function App(){
 return h('div',null,
  Cap('All eleven kinds, textSize 12 (default, helper-text-01)'),
  h('div',{className:'cols'},kinds.map(k=>h(C.ShapeIndicator,{key:k[0],kind:k[0],label:k[1]}))),
  Cap('textSize 14 (body-compact-01); the shape stays 16px'),
  h('div',{className:'cols'},kinds.map(k=>h(C.ShapeIndicator,{key:k[0],kind:k[0],textSize:14,label:k[1]}))),
  Cap('In context: the severity column of a security findings table (textSize 14 to match the row text)'),
  h('table',null,
   h('thead',null,h('tr',null,['Finding','Resource','Severity','State'].map(t=>h('th',{key:t},t)))),
   h('tbody',null,rows.map(r=>h('tr',{key:r[0]},h('td',null,r[0]),h('td',null,r[1]),h('td',null,h(C.ShapeIndicator,{kind:r[2],label:r[3],textSize:14})),h('td',null,r[4]))))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
