<!-- @dsCard group="Status" height=403 subtitle="Dot and count badge pinned to the top-right of an icon button; in a console header" -->
<style>body{margin:0;padding:24px;background:var(--background);color:var(--text-primary)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:center;margin-bottom:24px}.box{position:relative;display:inline-flex}
.hdr{display:flex;align-items:center;block-size:48px;background:var(--background);border-block-end:1px solid var(--border-subtle-01);font:600 14px/18px var(--font-sans);letter-spacing:.1px}
.hdr .nm{flex:1;padding-inline-start:16px}.hdr .nm span{font-weight:400}
.frame{border:1px solid var(--border-subtle-01)}.body{padding:16px;font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);block-size:56px}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Box(label,badge,size,icon){return h('div',{className:'box'},h(C.Button,{hasIconOnly:true,kind:'ghost',size:size||'lg',renderIcon:icon||'notification',iconDescription:label}),badge)}
function App(){
 return h('div',null,
  Cap('Dot (no count), count 4, count 28, 1200 shown as 999+; each sits in a position:relative ghost lg button'),
  h('div',{className:'row'},
   Box('New activity',h(C.BadgeIndicator,null),'lg','activity'),
   Box('Notifications',h(C.BadgeIndicator,{count:4})),
   Box('Notifications',h(C.BadgeIndicator,{count:28})),
   Box('Notifications',h(C.BadgeIndicator,{count:1200}))),
  Cap('Through IconButton badgeCount (the badge gets an id and the button aria-describedby): 7 and 0 (dot)'),
  h('div',{className:'row'},
   h(C.IconButton,{kind:'ghost',label:'Notifications',renderIcon:'notification',badgeCount:7}),
   h(C.IconButton,{kind:'ghost',label:'New activity',renderIcon:'activity',badgeCount:0})),
  Cap('In context: global actions in a console header. The count is on notifications, a dot marks new activity'),
  h('div',{className:'frame'},
   h('div',{className:'hdr'},h('div',{className:'nm'},'Cloud ',h('span',null,'console')),
    h(C.IconButton,{kind:'ghost',label:'Search',renderIcon:'search'}),
    h(C.IconButton,{kind:'ghost',label:'Activity',renderIcon:'activity',badgeCount:0}),
    h(C.IconButton,{kind:'ghost',label:'Notifications',renderIcon:'notification',badgeCount:3,align:'bottom-end'}),
    h(C.IconButton,{kind:'ghost',label:'Account',renderIcon:'user',align:'bottom-end'})),
   h('div',{className:'body'},'3 unread: deployment checkout-api finished, invoice for October is ready, quota at 92%.')));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
