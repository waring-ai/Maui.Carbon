<!-- @dsCard group="Forms" height=682 subtitle="Label inside a 64px field: filled, counter, password, invalid, warning, read-only, disabled, skeleton" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start;margin-bottom:24px}
.panel{max-inline-size:400px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px 16px 16px} .ph h3{margin:0 0 4px;font:600 16px/22px var(--font-sans);color:var(--text-primary)} .ph p{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.pf{display:flex} .pf > .cds--btn{flex:1 1 0;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
function Cell(t,el){return h('div',null,Cap(t),el)}

function RenamePanel(){
 const [name,setName]=React.useState('prod-us-south-01');
 const bad=!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(name);
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Rename cluster'),h('p',null,'The new name shows in the cluster list, billing and CLI output.')),
  h(C.FluidForm,{'aria-label':'Rename cluster',onSubmit:function(e){e.preventDefault()}},
   h(C.FluidTextInput,{id:'rn-name',labelText:'Cluster name',value:name,onChange:function(e){setName(e.target.value)},enableCounter:true,maxCount:32,
    invalid:bad,invalidText:'Use lowercase letters, numbers and hyphens; start and end with a letter or number'})),
  h('div',{className:'pf'},h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),h(C.Button,{kind:'primary',size:'xl',disabled:bad},'Save name')));
}

function App(){
 return h('div',null,
  h('div',{className:'grid'},
   Cell('Default (placeholder)',h(C.FluidTextInput,{labelText:'Cluster name',placeholder:'e.g. prod-us-south-01'})),
   Cell('Filled, with counter',h(C.FluidTextInput,{labelText:'Cluster name',defaultValue:'prod-us-south-01',enableCounter:true,maxCount:32})),
   Cell('Password (isPassword)',h(C.FluidTextInput,{labelText:'API key',isPassword:true,defaultValue:'k8s-4f9a2c7e1b'})),
   Cell('Invalid',h(C.FluidTextInput,{labelText:'Cluster name',defaultValue:'Prod US South',invalid:true,invalidText:'Use lowercase letters, numbers and hyphens'})),
   Cell('Warning',h(C.FluidTextInput,{labelText:'Cluster name',defaultValue:'test',warn:true,warnText:'Short names are hard to find in long lists'})),
   Cell('Read only',h(C.FluidTextInput,{labelText:'Cluster ID',defaultValue:'c7f2k9d20lmn8a3b',readOnly:true})),
   Cell('Disabled',h(C.FluidTextInput,{labelText:'Resource group',defaultValue:'default',disabled:true})),
   Cell('Long label (scrolls, never wraps)',h(C.FluidTextInput,{labelText:'Fully qualified domain name of the private service endpoint',defaultValue:'api.private.us-south.cloud'})),
   Cell('Skeleton (FluidTextInputSkeleton)',h(C.FluidTextInputSkeleton))),
  Cap('In context: a rename side panel, validated as you type'),
  h(RenamePanel));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
