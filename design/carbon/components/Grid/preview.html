<!-- @dsCard group="Layout" width=1120 height=1338 subtitle="16-column grid at lg: spans, offsets, modes, fullWidth, subgrid, FlexGrid, a console page" -->
<style>body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--text-primary)}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.g{margin-bottom:8px} .gap{margin-bottom:24px}
.c{background:var(--layer-accent-01);outline:1px solid var(--border-interactive);outline-offset:-1px;padding:8px 4px;text-align:center;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-primary);min-block-size:32px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2{background:var(--layer-accent-hover-01)}
.mode{display:grid;grid-template-columns:120px 1fr;align-items:center;margin-bottom:8px} .mode .cap{margin:0}
.zoomwrap{outline:1px dashed var(--border-strong-01);outline-offset:-1px;margin-bottom:8px;overflow:hidden}
.zoom{zoom:.5} .zoom .c{font-size:24px;line-height:32px;min-block-size:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
/* in-context page */
.page{outline:1px solid var(--border-subtle-01);outline-offset:-1px;padding-block:16px;background:var(--background)}
.ph{font:400 28px/36px var(--font-sans);margin:0} .phs{font:400 14px/20px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary);margin:4px 0 0}
.side{background:var(--layer-01);padding:16px;display:flex;flex-direction:column;gap:16px;block-size:100%;box-sizing:border-box}
.sh{margin:0;font:600 14px/18px var(--font-sans);letter-spacing:.16px}
.kpi{margin:0;font:300 42px/50px var(--font-sans)} .kl{margin:0;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary)}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t,s){return h('p',{className:'cap',style:s},t)}
const Cell=(p,t,k)=>h(C.Column,Object.assign({key:k,className:'c'},p),t);
const FCell=(p,t,k)=>h(C.Column,Object.assign({key:k},p),h('div',{className:'c'},t));
function App(){
 return h('div',null,
  Cap('Grid: 16 columns at lg (66rem / 1056px and up), 8 at md, 4 at sm; 2rem gutter (1rem each side of a column)'),
  h(C.Grid,{className:'gap'},Array.from({length:16},(_,i)=>Cell({sm:1,md:1,lg:1},i+1,i))),
  Cap('Spans per breakpoint (sm / md / lg): a number of columns or a percentage of the row'),
  h(C.Grid,{className:'g'},Cell({sm:4,md:8,lg:8},'lg={8}',1),Cell({sm:2,md:4,lg:4},'lg={4}',2),Cell({sm:2,md:4,lg:4},'lg={4}',3)),
  h(C.Grid,{className:'g'},Cell({sm:4,md:4,lg:'25%'},"lg='25%'",1),Cell({sm:4,md:4,lg:'75%'},"lg='75%'",2)),
  h(C.Grid,{className:'gap'},Cell({sm:1,md:2,lg:3},'lg={3}',1),Cell({sm:3,md:6,lg:13},'lg={13}',2)),
  Cap('Offsets and explicit placement: { span, offset } and { start, end }'),
  h(C.Grid,{className:'g'},Cell({sm:4,md:{span:4,offset:2},lg:{span:8,offset:4}},'lg={{ span: 8, offset: 4 }}  (starts at column 5)',1)),
  h(C.Grid,{className:'g'},Cell({sm:2,md:4,lg:{span:4,offset:2}},'{ span: 4, offset: 2 }',1),Cell({sm:2,md:4,lg:{span:4,offset:12}},'{ span: 4, offset: 12 }',2)),
  h(C.Grid,{className:'gap'},Cell({sm:4,md:8,lg:{start:3,end:15}},'lg={{ start: 3, end: 15 }}  (columns 3 to 14)',1)),
  Cap('Modes: wide (default, 2rem gutter), narrow (no gutter before each column, hangs into the margin), condensed (1px gutter)'),
  ['wide','narrow','condensed'].map(m=>h('div',{key:m,className:'mode'},h('p',{className:'cap'},m==='wide'?'<Grid>':'<Grid '+m+'>'),
    h(C.Grid,{narrow:m==='narrow',condensed:m==='condensed'},[1,2,3,4].map(i=>Cell({sm:1,md:2,lg:4},'lg={4}',i))))),
  h('div',{style:{height:16}}),
  Cap('Max width: the grid stops at 99rem (1584px) and centres; fullWidth lifts the cap; align="start" pins it left. Drawn at 50% scale in a 2144px-wide area'),
  h('div',{className:'zoomwrap'},h('div',{className:'zoom'},
    h(C.Grid,{className:'g'},Array.from({length:4},(_,i)=>Cell({lg:4},'default: centred, max 99rem',i))),
    h(C.Grid,{className:'g',align:'start'},Array.from({length:4},(_,i)=>Cell({lg:4},'align="start"',i))),
    h(C.Grid,{fullWidth:true},Array.from({length:4},(_,i)=>Cell({lg:4},'fullWidth',i))))),
  h('div',{style:{height:16}}),
  h('div',{className:'two'},
   h('div',null,Cap('A Grid inside a Column becomes a subgrid on the parent columns'),
    h(C.Grid,{fullWidth:true},Cell({sm:4,md:8,lg:16,className:'c c2',style:{padding:'8px 0'}},
      h(C.Grid,null,Cell({sm:2,md:4,lg:8},'sub lg={8}',1),Cell({sm:2,md:4,lg:4},'sub lg={4}',2),Cell({sm:2,md:4,lg:4},'sub lg={4}',3)),1))),
   h('div',null,Cap('FlexGrid + Row + Column: flexbox, padded gutters; offsets, condensed and narrow rows'),
    h(C.FlexGrid,{fullWidth:true},
     h(C.Row,null,FCell({sm:2,md:4,lg:4},'lg={4}',1),FCell({sm:2,md:4,lg:12},'lg={12}',2)),
     h('div',{style:{height:8}}),
     h(C.Row,null,FCell({sm:4,md:{span:4,offset:4},lg:{span:8,offset:8}},'{ span: 8, offset: 8 }',1)),
     h('div',{style:{height:8}}),
     h(C.Row,{condensed:true},FCell({sm:2,md:4,lg:8},'Row condensed',1),FCell({sm:2,md:4,lg:8},'lg={8}',2)),
     h('div',{style:{height:8}}),
     h(C.Row,{narrow:true},FCell({sm:2,md:4,lg:8},'Row narrow',1),FCell({sm:2,md:4,lg:8},'lg={8}',2))))),
  h('div',{style:{height:24}}),
  Cap('In context: a console overview page. Title spans 16, filters lg 4 / md 8, content lg 12 with a subgrid of three lg 4 tiles'),
  h('div',{className:'page'},
   h(C.Grid,null,
    h(C.Column,{sm:4,md:8,lg:16,style:{marginBlockEnd:24}},h('p',{className:'ph'},'Clusters'),h('p',{className:'phs'},'12 clusters in 3 regions')),
    h(C.Column,{sm:4,md:8,lg:4},h('div',{className:'side'},h('p',{className:'sh'},'Filter'),
      h(C.Checkbox,{id:'gr-f1',labelText:'us-south',defaultChecked:true}),h(C.Checkbox,{id:'gr-f2',labelText:'eu-de',defaultChecked:true}),h(C.Checkbox,{id:'gr-f3',labelText:'jp-tok'}))),
    h(C.Column,{sm:4,md:8,lg:12},
     h(C.Grid,null,
      [['Running','11','green','Healthy'],['Nodes','148','blue','Across 3 zones'],['Monthly cost','$18,420','gray','Up 4% on last month']].map((k,i)=>
       h(C.Column,{key:i,sm:4,md:4,lg:4},h(C.Tile,null,h('p',{className:'kl'},k[0]),h('p',{className:'kpi'},k[1]),h(C.Tag,{type:k[2],size:'sm'},k[3])))),
      h(C.Column,{sm:4,md:8,lg:12,style:{marginBlockStart:16}},h(C.InlineNotification,{kind:'warning',lowContrast:true,hideCloseButton:true,title:'prod-us-2 is degraded.',subtitle:'2 of 12 nodes are not ready.'})))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
