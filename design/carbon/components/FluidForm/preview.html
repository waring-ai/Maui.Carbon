<!-- @dsCard group="Forms" height=580 subtitle="A create-deployment form built from fluid fields: flush rows, 1px column gaps, fluid buttons" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.panel{max-inline-size:800px;background:var(--background);border:1px solid var(--border-subtle-01)} .ph{padding:16px 16px 24px} .ph h3{margin:0 0 4px;font:400 20px/28px var(--font-sans);color:var(--text-primary)} .ph p{margin:0;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-secondary)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1px;background:var(--border-strong-01)} .row.r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)} .row > *{min-inline-size:0}
.pf{display:flex;justify-content:flex-end} .pf > .cds--btn{flex:0 0 50%;max-inline-size:none}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const images=['nginx:1.27','node:22-alpine','postgres:16','python:3.12-slim','redis:7.4'];
const zones=[{id:'1',text:'Dallas 1'},{id:'2',text:'Dallas 2'},{id:'3',text:'Dallas 3'}];
const access=[{id:'priv',text:'Private network only'},{id:'pub',text:'Public and private'}];
const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);

function CreateDeployment(){
 const [name,setName]=React.useState('payments-api');
 const bad=!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(name);
 return h('div',{className:'panel'},
  h('div',{className:'ph'},h('h3',null,'Create deployment'),h('p',null,'Runs a container image on payments-cluster. You can change everything except the name later.')),
  h(C.FluidForm,{'aria-label':'Create deployment',onSubmit:function(e){e.preventDefault()}},
   h('div',{className:'row'},
    h(C.FluidTextInput,{id:'cd-name',labelText:'Deployment name',value:name,onChange:function(e){setName(e.target.value)},invalid:bad,invalidText:'Use lowercase letters, numbers and hyphens'}),
    h(C.FluidSelect,{id:'cd-region',labelText:'Region',defaultValue:'us-south'},h(C.SelectItem,{value:'us-south',text:'Dallas (us-south)'}),h(C.SelectItem,{value:'eu-de',text:'Frankfurt (eu-de)'}),h(C.SelectItem,{value:'jp-tok',text:'Tokyo (jp-tok)'}))),
   h('div',{className:'row'},
    h(C.FluidComboBox,{id:'cd-image',titleText:'Container image',placeholder:'Type to filter images',items:images,initialSelectedItem:'node:22-alpine',onChange:function(){}}),
    h(C.FluidNumberInput,{id:'cd-rep',label:'Replicas',defaultValue:3,min:1,max:20,invalidText:'Enter 1 to 20 replicas'})),
   h('div',{className:'row'},
    h(C.FluidMultiSelect,{id:'cd-zones',titleText:'Zones',label:'Choose zones',items:zones,initialSelectedItems:zones}),
    h(C.FluidDropdown,{id:'cd-access',titleText:'Network access',label:'Choose access',items:access,initialSelectedItem:access[0]})),
   h('div',{className:'row'},
    h(C.FluidDatePicker,{id:'cd-date',datePickerType:'single',defaultValue:start,style:{width:'100%'}},h(C.FluidDatePickerInput,{id:'cd-date-in',labelText:'Rollout date',placeholder:'mm/dd/yyyy'})),
    h(C.FluidTimePicker,{id:'cd-time',labelText:'Rollout time',placeholder:'hh:mm',defaultValue:'02:00'},
     h(C.FluidTimePickerSelect,{id:'cd-ap',labelText:'AM/PM',defaultValue:'am'},h(C.SelectItem,{value:'am',text:'AM'}),h(C.SelectItem,{value:'pm',text:'PM'})),
     h(C.FluidTimePickerSelect,{id:'cd-tz',labelText:'Time zone',defaultValue:'ct'},h(C.SelectItem,{value:'ct',text:'Central Time (CT)'}),h(C.SelectItem,{value:'utc',text:'UTC'})))),
   h(C.FluidTextArea,{id:'cd-notes',labelText:'Description (optional)',placeholder:'What this deployment does and who owns it',rows:2}),
   h('div',{className:'pf'},
    h(C.Button,{kind:'secondary',size:'xl'},'Cancel'),
    h(C.Button,{kind:'primary',size:'xl',type:'submit',disabled:bad},'Create deployment'))));
}

function App(){
 return h('div',null,
  Cap('Fields stack flush (0px), side-by-side fields are split by a 1px border-strong-01 gap; buttons hug the bottom edge'),
  h(CreateDeployment));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
