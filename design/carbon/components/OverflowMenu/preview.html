<!-- @dsCard group="Actions" height=808 subtitle="Sizes, icons, disabled, flipped, direction top, table row actions" -->
<style>
body{margin:0;padding:24px;background:var(--background)}
.row{display:flex;flex-wrap:wrap;gap:32px;margin-bottom:24px;align-items:flex-start}
.cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px}
.item{display:flex;flex-direction:column;align-items:flex-start}
.open{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;height:272px;margin-bottom:24px}
.open>div{display:flex;flex-direction:column}
.end{align-items:flex-end;text-align:right}
.bottom{justify-content:flex-end}
table{width:100%;border-collapse:collapse;font:400 14px/18px var(--font-sans);letter-spacing:.16px;background:var(--layer-01)}
th{height:48px;padding:0 16px;text-align:left;font-weight:600;color:var(--text-primary);background:var(--layer-accent-01)}
td{height:48px;padding:0 16px;color:var(--text-secondary);border-top:1px solid var(--border-subtle-01)}
td.name{color:var(--text-primary)}
td.menu,th.menu{width:48px;padding:0}
td.menu .cds--overflow-menu__wrapper{display:block}
.tbl{height:320px}
</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement;
function Cap(t){return h('p',{className:'cap'},t)}
const I=(label,p)=>h(C.MenuItem,Object.assign({key:label,label:label},p));
const items=()=>[I('Edit labels'),I('Clone'),I('Move to project',{disabled:true}),h(C.MenuItemDivider,{key:'d'}),I('Delete',{kind:'danger'})];
const OM=(p)=>h(C.OverflowMenu,Object.assign({iconDescription:'Bucket actions'},p),items());
const KEYS=[['ci-deploy','Service ID: ci-pipeline','Nov 2, 2026','Active'],['grafana-read','Service ID: monitoring','Oct 18, 2026','Active'],['legacy-backup','User: a.rivera','Mar 9, 2025','Expired'],['terraform','Service ID: infra','Sep 30, 2026','Active']];
function KeysTable(){
 return h('table',null,
  h('thead',null,h('tr',null,h('th',null,'Name'),h('th',null,'Owner'),h('th',null,'Created'),h('th',null,'Status'),h('th',{className:'menu','aria-label':'Actions'}))),
  h('tbody',null,KEYS.map((k,i)=>h('tr',{key:k[0]},
   h('td',{className:'name'},k[0]),h('td',null,k[1]),h('td',null,k[2]),h('td',null,k[3]),
   h('td',{className:'menu'},h(C.OverflowMenu,{size:'lg',flipped:true,iconDescription:'Actions for '+k[0],defaultOpen:i===0},
    I('Rename'),I('Rotate key'),I('Lock',{disabled:k[3]==='Expired'}),h(C.MenuItemDivider,{key:'d'}),I('Delete API key',{kind:'danger'})))))));
}
function App(){
 return h('div',null,
  Cap('Sizes xs 24, sm 32, md 40 (default), lg 48; horizontal icon; disabled'),
  h('div',{className:'row'},
   ['xs','sm','md','lg'].map(s=>h('div',{key:s,className:'item'},Cap(s),OM({size:s}))),
   h('div',{className:'item'},Cap('horizontal'),OM({renderIcon:'overflow-menu--horizontal'})),
   h('div',{className:'item'},Cap('disabled'),OM({disabled:true}))),
  h('div',{className:'open'},
   h('div',null,Cap('Open, md: disabled item, divider, danger last'),OM({defaultOpen:true})),
   h('div',null,Cap('Open, sm (menu items 32px)'),OM({size:'sm',defaultOpen:true})),
   h('div',{className:'bottom'},Cap('direction="top"'),h('div',{style:{marginTop:'auto'}},OM({direction:'top',defaultOpen:true}))),
   h('div',{className:'end'},Cap('flipped: aligned to the trigger end'),OM({flipped:true,defaultOpen:true}))),
  Cap('In context: row actions in an API keys table (lg rows and menu, flipped at the table edge)'),
  h('div',{className:'tbl'},h(KeysTable)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
