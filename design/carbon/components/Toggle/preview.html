<!-- @dsCard group="Forms" height=705 subtitle="md and sm, on and off, custom state text, hidden label, disabled, read-only" -->
<style>body{margin:0;padding:24px;background:var(--background)} .cap{font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-secondary);margin:0 0 8px} .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 32px;margin-bottom:32px} .col{display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.panel{background:var(--layer-01);max-width:640px} .panel h4{margin:0;padding:16px;font:600 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary);border-bottom:1px solid var(--border-subtle-01)} .set{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 16px;border-bottom:1px solid var(--border-subtle-01)} .set:last-child{border-bottom:0} .set b{display:block;font:400 14px/18px var(--font-sans);letter-spacing:.16px;color:var(--text-primary)} .set span.d{display:block;margin-top:2px;font:400 12px/16px var(--font-sans);letter-spacing:.32px;color:var(--text-helper)}</style>
<div id="root"></div>
<script>
const C=window.Carbon,h=React.createElement,{useState}=React;
function Cap(t){return h('p',{className:'cap'},t)}
function B(cap,...kids){return h('div',null,Cap(cap),h('div',{className:'col'},...kids))}

const SETTINGS=[['Auto-upgrade control plane','Applies patch releases in the maintenance window.',true],['Public endpoint','Expose the API server on the internet.',false],['Audit logging','Required by your organization policy.',true,true]];
function Settings(){
 const [on,setOn]=useState(SETTINGS.map(s=>s[2]));
 return h('div',{className:'panel'},h('h4',null,'Cluster settings'),
  SETTINGS.map((s,i)=>h('div',{key:i,className:'set'},
   h('div',null,h('b',{id:'ts-l'+i},s[0]),h('span',{className:'d'},s[1])),
   h(C.Toggle,{id:'ts-'+i,size:'sm','aria-labelledby':'ts-l'+i,readOnly:!!s[3],toggled:on[i],onToggle:v=>setOn(on.map((x,j)=>j===i?v:x)),className:'set-toggle'}))));
}
function App(){
 return h('div',null,
  h('div',{className:'grid'},
   B('md (48x24): off and on',h(C.Toggle,{id:'m1',labelText:'Auto-scaling'}),h(C.Toggle,{id:'m2',labelText:'Auto-scaling',defaultToggled:true})),
   B('sm (32x16): check mark when on',h(C.Toggle,{id:'s1',size:'sm',labelText:'Spot instances'}),h(C.Toggle,{id:'s2',size:'sm',labelText:'Spot instances',defaultToggled:true})),
   B('labelA / labelB state text',h(C.Toggle,{id:'c1',labelText:'Maintenance mode',labelA:'Disabled',labelB:'Enabled',defaultToggled:true}),h(C.Toggle,{id:'c2',labelText:'Billing alerts',labelA:'Muted',labelB:'Active'})),
   B('hideLabel: name beside the switch',h(C.Toggle,{id:'h1',labelText:'Dark mode',hideLabel:true,defaultToggled:true}),h(C.Toggle,{id:'h2',size:'sm',labelText:'Show system namespaces',hideLabel:true}))),
  h('div',{className:'grid'},
   B('disabled',h(C.Toggle,{id:'d1',labelText:'Backups',disabled:true}),h(C.Toggle,{id:'d2',labelText:'Backups',disabled:true,defaultToggled:true})),
   B('disabled sm',h(C.Toggle,{id:'d3',size:'sm',labelText:'Backups',disabled:true}),h(C.Toggle,{id:'d4',size:'sm',labelText:'Backups',disabled:true,defaultToggled:true})),
   B('readOnly: focusable, does not switch',h(C.Toggle,{id:'r1',labelText:'Encryption at rest',readOnly:true,defaultToggled:true}),h(C.Toggle,{id:'r2',labelText:'Encryption at rest',readOnly:true})),
   B('readOnly sm',h(C.Toggle,{id:'r3',size:'sm',labelText:'Audit logging',readOnly:true,defaultToggled:true}),h(C.Toggle,{id:'r4',size:'sm',labelText:'Audit logging',readOnly:true}))),
  Cap('In context: settings that apply immediately; sm toggles named by the row title (aria-labelledby), the last row read-only'),
  h(Settings));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
